<!doctype html>
<html lang="en" data-design="proclamation">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>State Proclamation · Lucky Draw</title>
<link rel="stylesheet" href="../vendor/fonts/proclamation.css">
<link rel="stylesheet" href="ui.css">
<style>
/* Layout: looking down on a dark lacquered table; an ivory scroll on gilded rollers sits centre stage,
   unrolls toward the viewer, the name is written across it in ink and a gold wax seal is pressed beside it. */
:root { --bg: #0b0605; --ink: #f2e8d6; --muted: #b9a58b; --accent: #d8b46a; --accent-2: #9b7330; --btn-ink: #1d1407;
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif; --body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --paper: #f4ecd9; --paper-2: #e6d8b8; --ink-brown: #2a1b0c; --gilt: #c9a052; }
body { background:
  radial-gradient(80% 70% at 50% 45%, rgba(70,22,14,.55) 0%, rgba(20,8,6,0) 70%),
  repeating-linear-gradient(92deg, rgba(255,255,255,.012) 0 2px, rgba(0,0,0,0) 2px 9px),
  radial-gradient(120% 100% at 50% 50%, #1a0b08 0%, #070303 100%); }
.ui.top h1 { font-weight: 600; letter-spacing: .02em; }
#draw { font-family: var(--body); font-weight: 600; font-size: 15px; letter-spacing: .34em; padding: 16px 52px; }

#table { position: fixed; inset: 0; display: grid; place-items: center; perspective: 1400px; perspective-origin: 50% 30%; }
#tilt { position: relative; width: min(820px, 60vw, 92vh * 1.62 * .72); transform-style: preserve-3d; transform: rotateX(28deg) translateY(-2vh); will-change: transform; }
/* the scroll */
.roller { position: relative; z-index: 3; height: clamp(22px, 2.6vw, 32px); margin: 0 -3.2%; border-radius: 999px;
  background: linear-gradient(180deg, #fbe7ad 0%, #d6a752 30%, #8f6324 62%, #5a3c13 82%, #c99a4c 100%);
  box-shadow: 0 10px 22px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.4); }
.roller::before, .roller::after { content: ""; position: absolute; top: 50%; width: clamp(26px, 3vw, 38px); aspect-ratio: 1; border-radius: 50%; transform: translateY(-50%);
  background: radial-gradient(circle at 38% 35%, #fff1c2, #d0a04c 45%, #6a4716 80%); box-shadow: 0 6px 14px rgba(0,0,0,.5); }
.roller::before { left: -14px; } .roller::after { right: -14px; }
#sheetClip { position: relative; z-index: 2; transform-origin: 50% 0; will-change: transform; }
#sheet { position: relative; aspect-ratio: 1.62; transform-origin: 50% 0; padding: 5.2% 7% 4.6%;
  background:
    radial-gradient(120% 90% at 50% 40%, rgba(255,255,255,.35), rgba(255,255,255,0) 60%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .36  0 0 0 0 .22  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
    linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
  box-shadow: inset 0 0 60px rgba(120,84,30,.28), 0 24px 50px rgba(0,0,0,.5);
  display: grid; grid-template-rows: auto auto 1fr auto; justify-items: center; text-align: center; color: var(--ink-brown); }
#sheet::before { content: ""; position: absolute; inset: 3.2% 3.6%; border: 1.5px solid rgba(160,118,48,.75); outline: 1px solid rgba(160,118,48,.45); outline-offset: 5px; pointer-events: none; }
.crest { font-family: "Cinzel", var(--display); font-weight: 600; letter-spacing: .32em; font-size: clamp(10px, 1.15vw, 15px); color: #7c5a22; }
.heading { margin-top: 2.4%; font-family: "Cinzel", var(--display); font-weight: 500; letter-spacing: .26em; font-size: clamp(10px, 1.05vw, 14px); color: #6d5332; }
#nameWrap { width: 100%; display: grid; place-items: center; align-self: center; }
#nameSvg { width: 100%; height: auto; overflow: visible; }
#nameSvg text { font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 600; fill: var(--ink-brown); fill-opacity: 0;
  stroke: var(--ink-brown); stroke-width: 1.1; stroke-linejoin: round; paint-order: stroke; }
.foot { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; width: 100%; gap: 4%; font-size: clamp(10px, 1vw, 13px); letter-spacing: .18em; text-transform: uppercase; color: #6d5332; }
.foot .line { border-top: 1px solid rgba(110,80,40,.55); padding-top: 6px; }
.foot .prize { font-family: "Cinzel", var(--display); letter-spacing: .2em; color: #4a3313; font-size: clamp(11px, 1.15vw, 15px); }
#seal { position: absolute; z-index: 4; right: 9%; bottom: 13%; width: clamp(70px, 9.5vw, 120px); aspect-ratio: 1; will-change: transform, opacity; opacity: 0; }
/* ribbon wrapped around the rolled scroll */
.ribbon { position: absolute; z-index: 5; top: -40%; bottom: -40%; width: 4.2%; left: 48%; background: linear-gradient(90deg, #5d0d12, #a3202a 45%, #6b0f16); box-shadow: 0 4px 12px rgba(0,0,0,.5); will-change: transform, opacity; }
.ribbon.b { left: 51%; transform: rotate(8deg); }
#bottomRoller { will-change: transform; }
#loading { display: none; }
</style>
</head>
<body>
<div id="table">
  <div id="tilt">
    <div class="roller" id="topRoller"><div class="ribbon a"></div><div class="ribbon b"></div></div>
    <div id="sheetClip"><div id="sheet">
      <div class="crest" id="crest">Lucky Draw</div>
      <div class="heading" id="heading">Is hereby awarded to</div>
      <div id="nameWrap"><svg id="nameSvg" aria-hidden="true"></svg></div>
      <div class="foot" id="foot"><div class="line" id="dateLine"></div><div class="prize" data-ld-prize></div><div class="line">Witnessed</div></div>
      <svg id="seal" viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <radialGradient id="wax" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#f5d48a"/><stop offset=".45" stop-color="#c38e3c"/><stop offset=".85" stop-color="#7d5418"/><stop offset="1" stop-color="#5a3a10"/></radialGradient>
          <radialGradient id="waxIn" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#e5bb6c"/><stop offset="1" stop-color="#8f6122"/></radialGradient>
        </defs>
        <path d="M60 4c8 0 10 6 17 8s13-1 17 6 1 11 5 17 10 7 10 15-6 10-6 17 5 12 0 18-11 3-16 8-4 13-11 16-11-3-18-2-11 9-18 7-6-10-12-14-14-1-17-8 3-11 0-17-11-7-11-15 7-10 8-17-5-12 0-18 12-2 17-7 5-12 12-15 10 2 16 1z" fill="url(#wax)"/>
        <circle cx="60" cy="61" r="36" fill="url(#waxIn)" stroke="#6b4813" stroke-opacity=".6" stroke-width="1.5"/>
        <circle cx="60" cy="61" r="30" fill="none" stroke="#6b4813" stroke-opacity=".5" stroke-dasharray="2 3"/>
        <!-- placeholder emblem: replace with the event's own emblem artwork -->
        <g fill="#6b4813" fill-opacity=".75" transform="translate(60 61)">
          <path d="M0-20 4-6 18-6 7 3 11 17 0 9-11 17-7 3-18-6-4-6Z"/>
        </g>
      </svg>
    </div></div>
    <div class="roller" id="bottomRoller"></div>
  </div>
</div>
<div class="ui top"><div><h1 data-ld-prize>Lucky Draw</h1><p id="meta"></p></div><button id="soundBtn" class="ghost" type="button">Sound on</button></div>
<div class="ui bottom"><div class="controls"><button id="draw" type="button">Proclaim</button><button id="reset" class="ghost" type="button" hidden>New draw</button></div><p class="hint" id="hint"></p></div>
<div id="result" class="sr" role="status" aria-live="polite"></div>

<script src="../core.js"></script>
<script type="importmap">
{ "imports": { "gsap": "../vendor/gsap/index.js", "gsap/": "../vendor/gsap/" } }
</script>
<script type="module">
import { gsap } from 'gsap';
const $ = id => document.getElementById(id);
const tilt = $('tilt'), clip = $('sheetClip'), sheet = $('sheet'), bottom = $('bottomRoller'), seal = $('seal'), svg = $('nameSvg');
const ribbons = [...document.querySelectorAll('.ribbon')];
const NS = 'http://www.w3.org/2000/svg';
$('dateLine').textContent = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

// the scroll "unrolls" by scaling its clip from the top roller while the content is counter-scaled,
// so the paper is revealed (not squashed) — transforms only, no layout animation
const S = { roll: 0 };
function applyRoll() {
  const k = Math.max(S.roll, .0001), h = sheet.offsetHeight;
  gsap.set(clip, { scaleY: k }); gsap.set(sheet, { scaleY: 1 / k });
  gsap.set(bottom, { y: -(1 - S.roll) * h });
}
addEventListener('resize', applyRoll);

// build the name as one <text> per character so each letter can be inked in turn
function setName(name) {
  svg.replaceChildren();
  const words = name.split(/\s+/), lines = [];
  // two balanced lines for long names
  if (name.length > 26 && words.length > 1) { let best = 1, bd = 1e9; for (let i = 1; i < words.length; i++) { const d = Math.abs(words.slice(0, i).join(' ').length - words.slice(i).join(' ').length); if (d < bd) { bd = d; best = i; } } lines.push(words.slice(0, best).join(' '), words.slice(best).join(' ')); }
  else lines.push(name);
  const FS = 100, LH = FS * 1.08, chars = [];
  const probe = document.createElementNS(NS, 'text'); probe.setAttribute('font-size', FS); probe.style.whiteSpace = 'pre'; // keep trailing spaces in measurements
  svg.appendChild(probe);
  let maxW = 0;
  lines.forEach((line, li) => {
    probe.textContent = line; const lw = probe.getComputedTextLength(); maxW = Math.max(maxW, lw);
    let x = -lw / 2;
    for (let i = 0; i < line.length; i++) {
      probe.textContent = line.slice(0, i); const off = i ? probe.getComputedTextLength() : 0;
      if (line[i] === ' ') continue;
      const t = document.createElementNS(NS, 'text'); t.setAttribute('font-size', FS); t.setAttribute('x', (-lw / 2 + off).toFixed(1)); t.setAttribute('y', (li * LH).toFixed(1)); t.textContent = line[i];
      svg.appendChild(t); chars.push(t);
    }
  });
  probe.remove();
  const h = (lines.length - 1) * LH + FS * 1.1;
  svg.setAttribute('viewBox', `${(-maxW / 2 - 20).toFixed(0)} ${(-FS * .85).toFixed(0)} ${(maxW + 40).toFixed(0)} ${h.toFixed(0)}`);
  // cap the rendered size so short names are not huge
  svg.style.maxWidth = Math.min(100, (maxW + 40) / 11) + '%';
  chars.forEach(t => { const L = Math.ceil(t.getComputedTextLength() * 3.2 + 60); t.style.strokeDasharray = L; t.style.strokeDashoffset = L; t.dataset.len = L; });
  return chars;
}

// ---------- sound ----------
function rustle(dur, vol) { LD.snd.noise(dur, vol, { type: 'bandpass', freq: 3200, q: .6, attack: dur * .3 }); }
function scratch() { LD.snd.noise(.09, .012, { type: 'highpass', freq: 5200, q: .7, attack: .01 }); }
function thud() { LD.snd.tone(68, .5, .12, 'sine'); LD.snd.tone(140, .25, .04, 'triangle'); LD.snd.noise(.18, .05, { type: 'lowpass', freq: 400, q: .5, attack: .004 }); }

let tl = null, chars = [];
function closedState() {
  S.roll = 0; applyRoll();
  gsap.set(tilt, { rotateX: 28, y: '-2vh', scale: .96 });
  gsap.set(ribbons, { x: 0, y: 0, rotate: (i) => i ? 8 : 0, autoAlpha: 1 });
  gsap.set(['#crest', '#heading', '#foot'], { autoAlpha: 0 });
  gsap.set(seal, { autoAlpha: 0, scale: 1.7, rotate: -8 });
}
closedState();

LD.stage({
  accent: '#d8b46a', drawingHint: 'The proclamation is being read…',
  async draw(winner) {
    // letters are positioned by measuring the calligraphy face, so it must be loaded first
    try { await Promise.race([document.fonts.load('italic 600 100px "Cormorant Garamond"'), new Promise(r => setTimeout(r, 1500))]); } catch (e) {}
    chars = setName(winner);
    gsap.set(chars, { fillOpacity: 0 });
    rustle(1.4, .03);
    tl = gsap.timeline();
    // 0–1.2 s: the ribbon slips loose
    tl.to(ribbons, { x: (i) => i ? 70 : -60, y: 40, rotate: (i) => i ? 34 : -26, autoAlpha: 0, duration: 1.1, ease: 'power2.in', stagger: .12 }, .2)
    // 1–3.4 s: the table tilts toward the viewer as the scroll unrolls (a slight overshoot, then it settles)
      .to(tilt, { rotateX: 9, y: '-5vh', scale: 1, duration: 2.6, ease: 'sine.inOut' }, .9)
      .to(S, { roll: 1.025, duration: 1.9, ease: 'sine.inOut', onUpdate: applyRoll }, 1.1)
      .to(S, { roll: 1, duration: .6, ease: 'sine.inOut', onUpdate: applyRoll }, 3.0)
      .add(() => rustle(1.8, .04), 1.1)
      .to(['#crest', '#heading'], { autoAlpha: 1, duration: .9, ease: 'sine.out', stagger: .25 }, 2.9)
    // 3.6–7 s: the name is written in ink, letter by letter, then the ink settles into solid letters
      .to(chars, { strokeDashoffset: 0, duration: .55, ease: 'sine.inOut', stagger: { amount: Math.min(2.6, chars.length * .07) }, onStart: () => {} }, 3.6)
      .to(chars, { fillOpacity: 1, duration: .5, ease: 'sine.out', stagger: { amount: Math.min(2.6, chars.length * .07) } }, 3.95);
    // a faint pen scratch per letter
    chars.forEach((c, i) => tl.add(() => { if (!LD.reduced) scratch(); }, 3.6 + i * Math.min(2.6, chars.length * .07) / Math.max(1, chars.length - 1)));
    const after = 3.95 + Math.min(2.6, chars.length * .07) + .5;
    // the seal is pressed: it comes down, squashes a touch and settles
    tl.to(seal, { autoAlpha: 1, scale: .96, rotate: -2, duration: .5, ease: 'power2.in' }, after)
      .add(thud, after + .5)
      .to(seal, { scale: 1, rotate: 0, duration: .45, ease: 'back.out(2.2)' }, after + .5)
      .to('#foot', { autoAlpha: 1, duration: .8, ease: 'sine.out' }, after + .7)
      .add(() => LD.snd.chime(), after + .9);
    if (LD.reduced) tl.progress(1);
    return tl.then(() => {});
  },
  reset() {
    tl = gsap.timeline();
    tl.to([seal, '#foot', '#crest', '#heading'], { autoAlpha: 0, duration: .6, ease: 'sine.out' }, 0)
      .to(chars, { fillOpacity: 0, strokeDashoffset: (i, t) => +t.dataset.len, duration: .6, ease: 'sine.in' }, 0)
      .to(S, { roll: 0, duration: 1.6, ease: 'sine.inOut', onUpdate: applyRoll }, .5)
      .to(tilt, { rotateX: 28, y: '-2vh', scale: .96, duration: 1.8, ease: 'sine.inOut' }, .5)
      .add(() => rustle(1.2, .03), .5)
      .to(ribbons, { x: 0, y: 0, rotate: (i) => i ? 8 : 0, autoAlpha: 1, duration: .8, ease: 'sine.out' }, 1.9)
      .set(seal, { scale: 1.7, rotate: -8 });
    if (LD.reduced) tl.progress(1);
    return tl.then(() => {});
  }
});
if (location.hash === '#debug') window.__procl = { S, gsap, get tl() { return tl; } };
</script>
</body>
</html>
