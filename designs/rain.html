<!doctype html>
<html lang="en" data-design="rain">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rain Glass · Lucky Draw</title>
<link rel="stylesheet" href="../vendor/fonts/rain.css">
<link rel="stylesheet" href="ui.css">
<style>
/* Layout: rain on a dark window with a warm lamp behind it. Drops fall and join one another; then they are drawn to the
   one drop the draw has chosen, which holds the centre of the glass and is the only one left. Its name comes into focus. */
:root { --bg: #05080d; --ink: #f4e6c2; --muted: #9fb0bd; --accent: #d6b46a; --accent-2: #9a7230; --btn-ink: #1d1407;
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif; --body: "Manrope", "Segoe UI", system-ui, sans-serif; }
body { background: var(--bg); }
#glass { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#nameBox { position: fixed; left: 0; right: 0; top: 62%; height: 16vh; display: grid; place-items: center; padding: 0 6vw;
  opacity: 0; pointer-events: none; text-align: center; }
#name { font-family: var(--display); font-weight: 600; line-height: 1.04; color: #f4e6c2; max-width: 100%; overflow-wrap: anywhere; text-shadow: 0 2px 18px rgba(0,0,0,.7); }
#lbl { position: fixed; left: 0; right: 0; top: calc(62% + 16vh + 4px); margin: 0; text-align: center; font: 600 11px/1 var(--body);
  letter-spacing: .34em; text-transform: uppercase; color: var(--muted); opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="glass" aria-hidden="true"></canvas>
<div id="nameBox"><div id="name"></div></div>
<p id="lbl">One drop remains</p>

<div class="ui top"><div><h1 data-ld-prize>Lucky Draw</h1><p id="meta"></p></div><button id="soundBtn" class="ghost" type="button">Sound on</button></div>
<div class="ui bottom"><div class="controls"><button id="draw" type="button">Let it rain</button><button id="reset" class="ghost" type="button" hidden>New draw</button></div><p class="hint" id="hint"></p></div>
<div id="result" class="sr" role="status" aria-live="polite"></div>

<script src="../core.js"></script>
<script type="importmap">
{ "imports": { "gsap": "../vendor/gsap/index.js", "gsap/": "../vendor/gsap/" } }
</script>
<script type="module">
const $ = id => document.getElementById(id);
const cv = $('glass'), ctx = cv.getContext('2d'), nameBox = $('nameBox'), nameEl = $('name'), lbl = $('lbl');
const MAX_DROPS = 48;
let W = 0, H = 0, dpr = 1, drops = [], cx = 0, cy = 0, winnerDrop = null;
const P = { t: 0, run: false, resolve: null, fade: 1 };

function size() {
  dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W * 0.5; cy = H * 0.42;
}
addEventListener('resize', size); size();

// a sample of the entrants as drops (the winner always among them); the drawn winner is chosen in core.js, not here
function seed(winner) {
  const others = LD.shuffle(LD.pool().filter(n => n !== winner)).slice(0, MAX_DROPS - 1);
  drops = others.map(() => ({ x: Math.random() * W, y: Math.random() * H * 0.6 - H * 0.1, r: 4 + Math.random() * 7,
    vx: (Math.random() - 0.5) * 12, vy: 30 + Math.random() * 40, win: false }));
  winnerDrop = { x: cx, y: cy, r: 16, vx: 0, vy: 0, win: true };
  drops.push(winnerDrop);
}

// one physics step: free fall and merging, then (after 3.6 s) every other drop is drawn to the winner's drop
function step(dt) {
  P.t += dt;
  const steer = P.t > 3.6;
  for (const d of drops) {
    if (d.win) { continue; }
    if (steer) {
      const k = Math.min(1, 3 * dt);
      d.vx += ((cx - d.x) * 2.2 - d.vx) * k; d.vy += ((cy - d.y) * 2.2 - d.vy) * k;
    } else {
      d.vx += (Math.sin(P.t * 2 + d.r) * 4 - d.vx) * Math.min(1, dt * 2);
      d.vy = Math.min(d.vy + 20 * dt, 160);
    }
    d.x += d.vx * dt; d.y += d.vy * dt;
    if (!steer && d.y > H + d.r) { d.y = -d.r - Math.random() * 60; d.x = Math.random() * W; }
  }
  // merge: a drop that touches another joins it (the larger keeps the area); the winner's drop always survives
  for (let i = 0; i < drops.length; i++) {
    for (let j = i + 1; j < drops.length; j++) {
      const a = drops[i], b = drops[j];
      if (Math.hypot(a.x - b.x, a.y - b.y) < (a.r + b.r) * 0.8) {
        const keep = a.win ? a : b.win ? b : a.r >= b.r ? a : b, gone = keep === a ? b : a;
        keep.r = Math.min(64, Math.sqrt(keep.r * keep.r + gone.r * gone.r));
        if (!keep.win) { keep.x = (a.x * a.r * a.r + b.x * b.r * b.r) / (a.r * a.r + b.r * b.r); keep.y = (a.y * a.r * a.r + b.y * b.r * b.r) / (a.r * a.r + b.r * b.r); }
        drops.splice(drops.indexOf(gone), 1); i = -1; break;
      }
    }
  }
  // finish: once the others have been drawn in (or after 9 s), any drop left joins the winner
  if (drops.length === 1 || P.t > 9) {
    for (const d of drops) if (!d.win) { winnerDrop.r = Math.min(64, Math.sqrt(winnerDrop.r ** 2 + d.r ** 2)); }
    drops = [winnerDrop];
    return true;
  }
  return false;
}

function drawDrop(d) {
  const g = ctx.createRadialGradient(d.x - d.r * 0.35, d.y - d.r * 0.4, d.r * 0.1, d.x, d.y, d.r);
  g.addColorStop(0, 'rgba(240,250,255,.75)'); g.addColorStop(0.6, 'rgba(143,177,198,.22)'); g.addColorStop(1, 'rgba(45,70,88,.45)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = d.win ? 'rgba(246,227,173,.9)' : 'rgba(207,226,238,.35)'; ctx.lineWidth = d.win ? 2 : 1; ctx.stroke();
  // a small highlight, and a faint trail above falling drops
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(d.x - d.r * 0.35, d.y - d.r * 0.45, d.r * 0.22, d.r * 0.13, -0.6, 0, Math.PI * 2); ctx.fill();
  if (!d.win && d.vy > 20) { ctx.strokeStyle = 'rgba(207,226,238,.12)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(d.x, d.y - d.r); ctx.lineTo(d.x, d.y - d.r - d.r * 3); ctx.stroke(); }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0c1520'); g.addColorStop(1, '#05080d');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // the warm lamp behind the glass
  const warm = ctx.createRadialGradient(W * .86, H * .1, 0, W * .86, H * .1, Math.max(W, H) * .6);
  warm.addColorStop(0, 'rgba(214,180,106,.28)'); warm.addColorStop(1, 'rgba(214,180,106,0)');
  ctx.fillStyle = warm; ctx.fillRect(0, 0, W, H);
  if (P.run) { if (step(dt)) { P.run = false; P.resolve && P.resolve(); } }
  ctx.globalAlpha = P.fade;
  for (const d of drops) drawDrop(d);
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

LD.stage({
  accent: '#d6b46a', drawingHint: 'Rain is running down the glass…',
  async draw(winner) {
    nameEl.textContent = winner; LD.fitText(nameEl, { max: 58, min: 16 });
    seed(winner);
    P.t = 0; P.fade = 1;
    if (LD.reduced) { while (!step(1 / 30)) {} }
    else { await new Promise(res => { P.resolve = res; P.run = true; }); }
    LD.snd.chime();
    await LD.tween(1500, e => {
      nameBox.style.opacity = e; nameBox.style.transform = `translateY(${(1 - e) * 10}px) scale(${0.97 + 0.03 * e})`;
      lbl.style.opacity = e;
    }, LD.ease.outCubic);
  },
  async reset() {
    await LD.tween(800, e => { nameBox.style.opacity = 1 - e; lbl.style.opacity = 1 - e; P.fade = 1 - e; }, LD.ease.inOutSine);
    nameBox.style.transform = ''; drops = []; winnerDrop = null; P.fade = 1;
  }
});
</script>
</body>
</html>
