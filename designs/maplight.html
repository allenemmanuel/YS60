/* Layout: Sabah drawn in gold light on deep navy, filling the upper two-thirds; every entrant is a point of light;

:root { --bg: #030714; --ink: #f1ead8; --muted: #9ea7bf; --accent: #e4c47c; --accent-2: #a58340; --btn-ink: #161108;

body { background: radial-gradient(90% 80% at 50% 38%, #0b1633 0%, #040918 60%, #02040b 100%); }
.ui.top h1 { font-weight: 600; letter-spacing: .02em; }
#draw { font-family: var(--body); font-weight: 600; font-size: 15px; letter-spacing: .34em; padding: 16px 52px; }
#map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.winner { visibility: hidden; padding: 66vh 6vw 13vh; }
.winner .box { max-height: 22vh; gap: .9vh; }
.winner .lbl { color: rgba(241,234,216,.7); letter-spacing: .5em; font-size: clamp(11px, 1.2vw, 14px); }
.winner .name { font-family: var(--display); font-weight: 600; line-height: 1.02; color: #e9c879; filter: drop-shadow(0 2px 10px rgba(0,0,0,.6)); }
.winner .name .ch { display: inline-block; background: linear-gradient(180deg, #fff6d8 0%, #f1d38c 34%, #c99a45 66%, #e2bd6e 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; will-change: transform, opacity; }
.winner .name .wd { display: inline-block; white-space: nowrap; }
.winner .rule { width: min(300px, 34vw); height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
.winner .prize { letter-spacing: .3em; }
.note { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); font-size: 10px; letter-spacing: .12em; color: rgba(158,167,191,.45); pointer-events: none; }
</style>

// glow sprite
const glow = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,240,200,1)'); gr.addColorStop(.25, 'rgba(255,214,140,.55)'); gr.addColorStop(1, 'rgba(255,200,120,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64); return c; })();

// ---------- state ----------
// trace: outline drawn in gold (0..1); lights: points appear (0..1); threads: travel to the capital (0..1); bloom: the capital flares
const P = { trace: 0, lights: .35, threads: 0, bloom: 0, fade: 0 };
const bez = (a, c, b, t) => (1 - t) * (1 - t) * a + 2 * (1 - t) * t * c + t * t * b;
let idleT = 0;
function render() {
  g.clearRect(0, 0, W, H);
  const kk = project(KK), still = LD.reduced ? 0 : 1;
  // faint resting outline, then the gold trace running over it
  g.lineJoin = 'round'; g.lineCap = 'round';
  g.beginPath(); path.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y));
  g.strokeStyle = 'rgba(214,180,106,.16)'; g.lineWidth = 1.2; g.stroke();
  if (P.trace > 0) {
    const L = total * Math.min(1, P.trace);
    g.save(); g.setLineDash([L, total + 10]); g.shadowColor = 'rgba(255,205,120,.85)'; g.shadowBlur = 14;
    g.strokeStyle = 'rgba(244,214,140,.95)'; g.lineWidth = 1.8; g.stroke(); g.restore();
    // the pen tip
    if (P.trace < 1) { let i = pathLen.findIndex(l => l >= L); if (i < 0) i = path.length - 1; const [x, y] = path[i];
      g.globalCompositeOperation = 'lighter'; g.drawImage(glow, x - 14, y - 14, 28, 28); g.globalCompositeOperation = 'source-over'; }
  }
  // islands: faint at rest, gilded once the coastline trace has gone all the way round
  const isl = THREE_smooth((P.trace - .92) / .08);
  for (const r of islands) { g.beginPath(); r.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y));
    g.strokeStyle = `rgba(232,200,128,${(.16 + .7 * isl).toFixed(3)})`; g.lineWidth = 1 + .4 * isl; g.stroke(); }
  g.globalCompositeOperation = 'lighter';
  for (const d of dots) {
    const appear = THREE_smooth((P.lights - d.at * .9) / .1);
    // the thread: grows from the point to the capital, its head a bright spark
    const tt = THREE_smooth((P.threads - d.delay) / .65);
    if (tt > 0) {
      g.beginPath(); g.moveTo(d.x, d.y); const N = 18;
      for (let s = 1; s <= N; s++) { const t = tt * s / N; g.lineTo(bez(d.x, d.cx, kk[0], t), bez(d.y, d.cy, kk[1], t)); }
      g.strokeStyle = `rgba(255,214,140,${(.16 * (1 - P.fade)).toFixed(3)})`; g.lineWidth = .9; g.stroke();
      if (tt < 1) { const hx = bez(d.x, d.cx, kk[0], tt), hy = bez(d.y, d.cy, kk[1], tt); g.globalAlpha = .9 * (1 - P.fade); g.drawImage(glow, hx - 7, hy - 7, 14, 14); g.globalAlpha = 1; }
    }
    if (appear > 0) { const tw = .75 + .25 * Math.sin(idleT * 1.7 + d.tw) * still, a = appear * tw * (1 - .6 * tt) * (1 - P.fade);
      g.globalAlpha = a; const s = 6 + d.r * 4; g.drawImage(glow, d.x - s / 2, d.y - s / 2, s, s); g.globalAlpha = 1; }
  }
  // the capital: brightens as threads arrive, then blooms
  const arrive = THREE_smooth((P.threads - .55) / .45), b = P.bloom;
  const cs = 16 + 30 * arrive + 120 * b;
  g.globalAlpha = Math.min(1, .25 + .75 * arrive + b); g.drawImage(glow, kk[0] - cs / 2, kk[1] - cs / 2, cs, cs); g.globalAlpha = 1;
  if (b > 0) for (let k = 0; k < 3; k++) { const rr = 20 + (b * 140 + k * 26) * (1 + k * .2), a = Math.max(0, .5 * (1 - b) - k * .1);
    g.beginPath(); g.arc(kk[0], kk[1], rr, 0, 6.29); g.strokeStyle = `rgba(255,220,150,${a.toFixed(3)})`; g.lineWidth = 1.2; g.stroke(); }
  g.globalCompositeOperation = 'source-over';
}
function THREE_smooth(x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }

let tl = null;
gsap.ticker.add((t, dms) => { idleT += Math.min(dms / 1000, .05); render(); });
if (location.hash === '#debug') window.__map = { P, gsap, get tl() { return tl; }, render };

// ---------- sound ----------
function shimmer(dur) { LD.snd.noise(dur, .018, { type: 'bandpass', freq: 6200, q: 1.2, attack: dur * .4 }); }
function pad(notes, dur, vol) { notes.forEach((f, i) => LD.snd.tone(f, dur, vol / (1 + i * .4), 'sine', i * .05)); }

// ---------- reveal ----------
const winEl = document.getElementById('win'), nameEl = document.getElementById('winName'), ruleEl = document.getElementById('rule');
const lblEl = winEl.querySelector('.lbl'), prizeEl = winEl.querySelector('.prize');
let split = null;

LD.stage({
  accent: '#e4c47c', drawingHint: 'Light gathers from every district…',
  draw(winner) {
    placeDots();
    if (split) { split.revert(); split = null; }
    nameEl.textContent = winner;
    gsap.set(winEl, { autoAlpha: 1 }); gsap.set([lblEl, prizeEl], { autoAlpha: 0 }); gsap.set(ruleEl, { scaleX: 0 });
    LD.fitText(nameEl, { max: Math.min(92, innerWidth * .066), min: 22 });
    split = new SplitText(nameEl, { type: 'words,chars', wordsClass: 'wd', charsClass: 'ch' });
    const kk = project(KK);
    split.chars.forEach(c => { const r = c.getBoundingClientRect(); gsap.set(c, { x: kk[0] - (r.left + r.width / 2), y: kk[1] - (r.top + r.height / 2), scale: .2, autoAlpha: 0 }); });
    shimmer(3);
    tl = gsap.timeline();
    // 0–3 s: the coastline is traced from Kudat round the state; the points of light come up across the districts
    tl.to(P, { trace: 1, duration: 3.0, ease: 'sine.inOut' }, 0)
      .to(P, { lights: 1, duration: 2.6, ease: 'sine.inOut' }, .4)
    // 3–7 s: threads of light run from every point to the capital, braiding as they go
      .add(() => pad([146.83, 220, 293.66], 4.5, .03), 3.0)
      .to(P, { threads: 1, duration: 4.0, ease: 'sine.inOut' }, 3.0)
    // 7–9 s: Kota Kinabalu blooms and the name rises out of it
      .to(P, { bloom: 1, duration: 1.6, ease: 'sine.out' }, 6.9)
      .to(P, { fade: .7, duration: 1.6, ease: 'sine.inOut' }, 7.0)
      .add(() => { pad([293.66, 440, 587.33, 880], 3.2, .04); }, 6.9)
      .to(split.chars, { x: 0, y: 0, scale: 1, autoAlpha: 1, duration: 1.3, ease: 'back.out(1.1)', stagger: { amount: Math.min(1.1, .03 * split.chars.length) } }, 7.0)
      .to(lblEl, { autoAlpha: 1, duration: .9, ease: 'sine.out' }, 7.6)
      .to(ruleEl, { scaleX: 1, duration: 1.1, ease: 'power2.out' }, 8.2)
      .to(prizeEl, { autoAlpha: 1, duration: .9, ease: 'sine.out' }, 8.4);
    if (LD.reduced) tl.progress(1);
    return tl.then(() => {});
  },
  reset() {
    tl = gsap.timeline();
    tl.to(winEl, { autoAlpha: 0, duration: .6 }, 0)
      .to(P, { fade: 1, bloom: 0, duration: 1.0, ease: 'sine.inOut' }, 0)
      .to(P, { trace: 0, duration: 1.2, ease: 'sine.inOut' }, .3)
      .add(() => { P.threads = 0; P.lights = 0; placeDots(); if (split) { split.revert(); split = null; } }, 1.5)
      .to(P, { fade: 0, duration: .01 }, 1.5)
      .to(P, { lights: .35, duration: 1.4, ease: 'sine.out' }, 1.55);
    if (LD.reduced) tl.progress(1);
    return tl.then(() => {});
  }
});
</script>
</body>
