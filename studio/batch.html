<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="pages.css">
    <title>Batch draw · Lucky Draw Studio</title>
    <style>
        .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; perspective: 900px; }
        .trophy { position: relative; overflow: hidden; display: grid; gap: 10px; align-content: start; min-height: 150px; padding: 18px 16px 16px; border-radius: 14px;
            background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)); border: 1px solid var(--line);
            box-shadow: inset 0 -3px 0 rgba(232,199,122,.35); transition: border-color .4s ease, background .4s ease, transform .4s ease; }
        .trophy .no { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
        .trophy .prize { font: 500 14px/1.35 var(--body); color: var(--muted); overflow-wrap: anywhere; }
        .trophy .who { font: 700 1.2rem/1.2 var(--display); color: var(--faint); min-height: 2.4em; overflow-wrap: anywhere; }

        /* drawing: the card lifts and a light sweeps across it while the draw is saved */
        .trophy.drawing { border-color: rgba(92,184,95,.6); transform: translateY(-4px); box-shadow: inset 0 -3px 0 rgba(92,184,95,.6), 0 14px 30px rgba(0,0,0,.45); }
        .trophy.drawing::after { content: ""; position: absolute; inset: 0; pointer-events: none;
            background: linear-gradient(100deg, transparent 35%, rgba(170,235,170,.22) 50%, transparent 65%);
            transform: translateX(-100%); animation: sweep 1.1s ease-in-out infinite; }
        @keyframes sweep { to { transform: translateX(100%); } }

        /* won: the card turns over to show the winner, then settles with a gold edge */
        .trophy.won { border-color: rgba(232,199,122,.5); background: linear-gradient(180deg, rgba(232,199,122,.14), rgba(232,199,122,.03)); }
        .trophy.won .who { color: var(--gold); }
        .trophy.won .prize { color: var(--ink); }
        .trophy.reveal { animation: turn .8s cubic-bezier(.2,.8,.2,1) both; }
        @keyframes turn { from { transform: rotateX(-90deg) translateY(6px); opacity: 0; } 60% { opacity: 1; } to { transform: none; opacity: 1; } }
    </style>
</head>
<body>
<div class="wrap wide">
  <nav class="nav" id="nav" aria-label="Pages"></nav>

  <header class="page-head">
    <h1>Batch draw</h1>
    <p class="sub">Draw the next prizes in one go, before the top prizes. Each prize gets its own winner, saved to the event as it is drawn.</p>
  </header>

  <div class="gate" id="gate" role="region" aria-label="Sign in"></div>

  <section class="panel" aria-labelledby="setH">
    <div class="head">
      <h2 id="setH">Set up the batch</h2>
      <div class="stat"><b id="left">—</b><span>prizes left</span></div>
    </div>
    <div class="row">
      <label class="sub" for="howMany">How many prizes to draw</label>
      <input id="howMany" class="field num" type="number" min="1" step="1" value="10" inputmode="numeric">
      <button id="start" class="primary" type="button">Draw batch</button>
    </div>
    <p class="msg" id="msg" role="status"></p>
  </section>

  <section aria-labelledby="shelfH">
    <div class="head" style="margin-bottom: 14px">
      <h2 id="shelfH">The shelf</h2>
      <span class="sub" id="shelfInfo"></span>
    </div>
    <div class="shelf" id="shelf"></div>
    <p class="empty" id="empty" hidden>Set how many prizes to draw. The next prizes in draw order appear here.</p>
  </section>
</div>
<script src="core.js"></script>
<script src="pages.js"></script>
<script>
nav('batch.html');
gate($('gate'));

const PACE_MS = 1500;       // each card gets at least this long, so the sweep and turn are seen
let running = false;
let slots = [];             // the prizes in this batch, in draw order
const cards = new Map();    // prize id -> card element
let result = null;          // { text, err } after a batch finishes or stops

const remaining = () => prizeRows().filter(p => !p.won);
const requested = () => Math.floor(Number($('howMany').value));
const sleep = ms => new Promise(r => setTimeout(r, LD.reduced ? 0 : ms));

// Why the batch can't start yet, or '' if it can
function problem() {
    if (LD.live.state() !== 'on') return 'Sign in first.';
    const n = requested();
    if (!Number.isFinite(n) || n < 1) return 'Enter a number of at least 1.';
    const left = remaining().length;
    if (!left) return 'No prizes are left to draw.';
    if (n > left) return `Only ${left} prize${left === 1 ? ' is' : 's are'} left to draw.`;
    const names = LD.pool().length;
    if (names < n) return `Only ${names} name${names === 1 ? ' is' : 's are'} left in the draw.`;
    return '';
}

// Build the cards once for the current batch. Cards are not rebuilt during a draw, so their animations are not restarted.
function buildShelf() {
    cards.clear();
    $('shelf').replaceChildren(...slots.map(p => {
        const el = document.createElement('article');
        el.className = 'trophy';
        el.innerHTML = `<span class="no">Prize ${p.order}</span><div class="prize"></div><div class="who">—</div>`;
        el.querySelector('.prize').textContent = p.name;
        cards.set(p.id, el);
        return el;
    }));
    $('empty').hidden = slots.length > 0;
    $('shelfInfo').textContent = slots.length ? `0 of ${slots.length} drawn` : '';
}

function setCard(id, state, name) {
    const el = cards.get(id);
    if (!el) return;
    el.classList.toggle('drawing', state === 'drawing');
    if (state === 'idle') el.querySelector('.who').textContent = '—';
    if (state === 'won' && !el.classList.contains('won')) {
        el.classList.add('won', 'reveal');
        el.querySelector('.who').textContent = name;
    }
    if (state === 'drawing') el.querySelector('.who').textContent = '…';
}

function countDrawn() {
    const n = [...cards.values()].filter(el => el.classList.contains('won')).length;
    $('shelfInfo').textContent = slots.length ? `${n} of ${slots.length} drawn` : '';
}

function showMessage() {
    const why = problem();
    $('start').disabled = running || !!why;
    if (result) { $('msg').classList.toggle('err', result.err); $('msg').textContent = result.text; return; }
    $('msg').classList.toggle('err', !!why && LD.live.state() === 'on');
    $('msg').textContent = why;
}

// Show the next prizes in draw order for the number typed in (not while a batch is running)
function preview() {
    if (running) return;
    slots = remaining().slice(0, Math.max(0, requested() || 0));
    buildShelf();
}

function refresh() {
    $('left').textContent = LD.live.state() === 'on' ? remaining().length : '—';
    if (!running) showMessage();
}

$('howMany').addEventListener('input', () => { result = null; preview(); refresh(); });

$('start').addEventListener('click', async () => {
    const why = problem();
    if (why) { result = { text: why, err: true }; showMessage(); return; }
    const n = requested();
    if (!confirm(`Draw the next ${n} prize${n === 1 ? '' : 's'}? Each winner is saved to the event as it is drawn.`)) return;

    running = true; result = null;
    $('howMany').disabled = true; $('start').disabled = true;
    slots = remaining().slice(0, n);
    buildShelf();
    $('msg').classList.remove('err'); $('msg').textContent = 'Drawing…';

    let done = 0;
    try {
        for (const p of slots) {
            setCard(p.id, 'drawing');
            // the card sweeps while the draw is saved; the winner shows only after the server accepts it
            const [claim] = await Promise.all([LD.live.draw(), sleep(PACE_MS)]);
            setCard(p.id, 'idle');
            setCard(claim.prize.id, 'won', claim.name);
            done++;
            countDrawn();
            $('msg').textContent = `${done} of ${n} drawn.`;
        }
        result = { text: `Done. ${done} prize${done === 1 ? '' : 's'} drawn.`, err: false };
    } catch (err) {
        console.error(err);
        // clear the sweep on the card that was being drawn
        for (const el of cards.values()) el.classList.remove('drawing');
        result = { text: `Stopped after ${done} of ${n}. ${err.message || 'The draw was not saved.'}`, err: true };
    } finally {
        running = false;
        $('howMany').disabled = false;
        countDrawn();
        refresh();
    }
});

LD.live.onChange(() => { if (!running && !slots.length) preview(); refresh(); });
preview();
refresh();
</script>
</body>
</html>
