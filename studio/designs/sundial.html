<!doctype html>
<html lang="en" data-design="sundial">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sundial · Lucky Draw</title>
<link rel="stylesheet" href="../vendor/fonts/sundial.css">
<link rel="stylesheet" href="ui.css">
<style>
/* Layout: a large brass sundial in warm late light. Every entrant is a mark on its rim; the gnomon's shadow turns,
   gathers pace, eases across the marks and comes to rest on the winner's, which then glows and the name rises. */
:root { --bg: #090604; --ink: #f4e6c2; --muted: #b39a6c; --accent: #e9c57c; --accent-2: #8f6a2c; --btn-ink: #1d1407;
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif; --body: "Manrope", "Segoe UI", system-ui, sans-serif; }
body { background: radial-gradient(80% 70% at 50% 25%, #3d2b1a 0%, #090604 75%); }
#stage { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); width: min(56vh, 82vw, 480px); aspect-ratio: 1; }
#dial { width: 100%; height: 100%; display: block; overflow: visible; }
/* a fixed-size box under the dial: fitText shrinks the name to fit it, and it always stays on screen */
#nameBox { position: absolute; left: 50%; margin-left: -46vw; width: 92vw; top: 100%; height: 16vh; opacity: 0; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; }
#name { font-family: var(--display); font-weight: 600; line-height: 1.05; color: #f4e6c2; max-width: 100%; overflow-wrap: anywhere; }
#lbl { margin: 0 0 6px; font: 600 10px/1 var(--body); letter-spacing: .34em; text-transform: uppercase; color: #b39a6c; }
</style>
</head>
<body>
<div id="stage">
  <svg id="dial" viewBox="0 0 600 600" aria-hidden="true">
    <defs>
      <radialGradient id="brass" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#f1d28a"/><stop offset=".6" stop-color="#8f6a2c"/><stop offset="1" stop-color="#4a3314"/></radialGradient>
    </defs>
    <circle cx="300" cy="300" r="262" fill="url(#brass)"/>
    <circle cx="300" cy="300" r="236" fill="none" stroke="#3a2610" stroke-opacity=".5" stroke-width="2"/>
    <g id="ticks" stroke="#e0bd74" stroke-opacity=".8"></g>
    <g id="marks"></g>
    <g id="gnomon">
      <polygon points="300,300 288,70 312,70" fill="#120b05" fill-opacity=".72"/>
    </g>
    <circle cx="300" cy="300" r="10" fill="#2a1a0a"/>
    <circle cx="300" cy="300" r="4" fill="#e9c57c"/>
  </svg>
  <div id="nameBox"><p id="lbl">The shadow stops</p><div id="name"></div></div>
</div>

<div class="ui top"><div><h1 data-ld-prize>Lucky Draw</h1><p id="meta"></p></div><button id="soundBtn" class="ghost" type="button">Sound on</button></div>
<div class="ui bottom"><div class="controls"><button id="draw" type="button">Read the shadow</button><button id="reset" class="ghost" type="button" hidden>New draw</button></div><p class="hint" id="hint"></p></div>
<div id="result" class="sr" role="status" aria-live="polite"></div>

<script src="../core.js"></script>
<script type="importmap">
{ "imports": { "gsap": "../vendor/gsap/index.js", "gsap/": "../vendor/gsap/" } }
</script>
<script type="module">
import { gsap } from 'gsap';
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg', C = 300, MARK_R = 186;
const gnomon = $('gnomon'), marks = $('marks'), nameBox = $('nameBox'), nameEl = $('name');
const pt = (deg, r) => [C + r * Math.cos(deg * Math.PI / 180), C + r * Math.sin(deg * Math.PI / 180)];

// 60 hour-and-minute ticks around the rim, majors every five
(function ticks() {
  const g = $('ticks');
  for (let i = 0; i < 60; i++) {
    const a = -90 + i * 6, major = i % 5 === 0, [x1, y1] = pt(a, major ? 222 : 232), [x2, y2] = pt(a, 250);
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', x1); l.setAttribute('y1', y1); l.setAttribute('x2', x2); l.setAttribute('y2', y2);
    l.setAttribute('stroke-width', major ? 3 : 1.5); g.appendChild(l);
  }
})();
gsap.set(gnomon, { svgOrigin: `${C} ${C}`, rotation: 0 });

// one mark per entrant, evenly spaced from the top of the dial, clockwise
function buildMarks(list) {
  marks.replaceChildren();
  const n = list.length, r = Math.max(2.2, Math.min(5, 60 / Math.sqrt(n)));
  list.forEach((_, i) => {
    const [x, y] = pt(-90 + i * 360 / n, MARK_R);
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', r); c.setAttribute('fill', '#fbe6b0');
    marks.appendChild(c);
  });
  return [...marks.children];
}
buildMarks(LD.pool());

LD.stage({
  accent: '#e9c57c', drawingHint: 'The shadow is turning…',
  async draw(winner) {
    const list = LD.pool(), n = list.length, w = Math.max(0, list.indexOf(winner));
    const dots = buildMarks(list);
    nameEl.textContent = winner; LD.fitText(nameEl, { max: 52, min: 16 });
    // six full turns, then the shadow comes to rest on the winner's mark
    const target = 6 * 360 + (w * 360) / n;
    const wx = dots[w].getAttribute('cx'), wy = dots[w].getAttribute('cy');
    dots[w].setAttribute('fill', '#fff0c2');
    gsap.set(dots[w], { svgOrigin: `${wx} ${wy}`, scale: 1 });
    LD.snd.noise(2.4, 0.012, { type: 'lowpass', freq: 700, attack: 0.8 });
    const tl = gsap.timeline();
    tl.to(gnomon, { rotation: target, duration: 6.4, ease: 'power3.inOut' }, 0)
      .to(dots[w], { scale: 2.2, duration: 0.6, ease: 'sine.out', yoyo: true, repeat: 3 }, 6.4)
      .fromTo(nameBox, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 1.4, ease: 'sine.out' }, 7.2)
      .add(() => LD.snd.chime(), 7.3);
    if (LD.reduced) tl.progress(1);
    return tl.then(() => {});
  },
  async reset() {
    // turn the shadow back the short way: from its resting angle to a full turn, which looks the same as zero
    const rest = gsap.getProperty(gnomon, 'rotation') % 360;
    gsap.set(gnomon, { rotation: rest });
    const tl = gsap.timeline();
    tl.to(nameBox, { opacity: 0, y: 0, duration: 0.6, ease: 'sine.out' }, 0)
      .to(gnomon, { rotation: 360, duration: LD.reduced ? 0 : 1.6, ease: 'sine.inOut' }, 0.2);
    await tl.then(() => {});
    gsap.set(gnomon, { rotation: 0 });
    buildMarks(LD.pool());
  }
});
</script>
</body>
</html>
