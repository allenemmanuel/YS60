<!doctype html>
<html lang="en" data-design="foundry">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Foundry · Lucky Draw</title>
<link rel="stylesheet" href="../vendor/fonts/foundry.css">
<link rel="stylesheet" href="ui.css">
<style>
/* Layout: a foundry at night. The crucible tilts, molten gold runs into a sand mould in the shape of the winner's name,
   cools from orange to gold, and the cast plate is lifted into the light. The cast is the keepsake. */
:root { --bg: #0a0604; --ink: #f4e6c2; --muted: #b39a6c; --accent: #e8b25c; --accent-2: #9a6a24; --btn-ink: #1d1407;
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif; --body: "Manrope", "Segoe UI", system-ui, sans-serif; }
body { background: #0a0604; }
#scene { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(88vw, 760px); height: min(60vh, 520px); }
#furnace { position: absolute; left: -12%; top: -8%; width: 62%; height: 62%; opacity: 0; pointer-events: none;
  background: radial-gradient(closest-side, rgba(255,140,60,.55), rgba(120,40,10,.25) 60%, transparent); }
#crucible { position: absolute; left: 22%; top: 4%; width: 18%; transform-origin: 96% 14%; }
#crucible svg { width: 100%; display: block; }
#stream { position: absolute; left: 38.6%; top: 5.5%; width: 9px; height: 38%; transform-origin: 50% 0; transform: scaleY(0);
  border-radius: 4px; background: linear-gradient(90deg, #ffe49a, #ff9a3c); box-shadow: 0 0 12px 3px rgba(255,160,60,.5); }
#mould { position: absolute; left: 22%; top: 36%; width: 56%; height: 30%; border: 1px solid #5a4130; border-radius: 3px;
  background: radial-gradient(120% 120% at 50% 0%, #4a3423, #2a1c12 70%); box-shadow: inset 0 10px 18px rgba(0,0,0,.5), 0 14px 30px rgba(0,0,0,.5); }
#plate { position: absolute; left: 22%; top: 41%; width: 56%; height: 20%; display: grid; place-items: center; padding: 0;
  border-radius: 4px; overflow: hidden; background: linear-gradient(180deg, #fff0b8, #e2b25c 45%, #9a6a24);
  box-shadow: 0 0 0 1px rgba(122,84,24,.6), 0 10px 26px rgba(0,0,0,.5); }
#molten { position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(0);
  background: linear-gradient(90deg, #ff8a2c, #ffd27a 55%, #ff9a3c); }
/* the name wraps inside the plate; fitText sizes it to the plate's height so no line is cut off */
#plateName { position: relative; max-width: 100%; box-sizing: border-box; padding: 6px 14px; font-family: var(--display); font-weight: 700; line-height: 1.05; color: #4a2e0c; text-align: center; overflow-wrap: anywhere; opacity: 0; }
#sparks { position: absolute; inset: 0; pointer-events: none; }
#sparks i { position: absolute; left: 40%; top: 42%; width: 3px; height: 3px; border-radius: 50%; background: #ffd27a; opacity: 0; }
#lbl { position: absolute; left: 0; right: 0; top: 84%; margin: 0; text-align: center; font: 600 10px/1 var(--body); letter-spacing: .34em; text-transform: uppercase; color: var(--muted); opacity: 0; }
</style>
</head>
<body>
<div id="scene">
  <div id="furnace"></div>
  <div id="crucible"><svg viewBox="0 0 100 60" aria-hidden="true">
    <path d="M6 14 H72 Q72 44 40 46 H30 Q6 44 6 14Z" fill="#2c1c12" stroke="#6a4a2a"/>
    <path d="M72 18 L94 8 L96 14 L74 26Z" fill="#2c1c12" stroke="#6a4a2a"/>
    <ellipse cx="39" cy="14" rx="33" ry="5" fill="#ff9a3c"/>
  </svg></div>
  <div id="stream"></div>
  <div id="mould"></div>
  <div id="plate"><div id="molten"></div><span id="plateName"></span></div>
  <div id="sparks"></div>
  <p id="lbl">The cast cools to gold</p>
</div>

<div class="ui top"><div><h1 data-ld-prize>Lucky Draw</h1><p id="meta"></p></div><button id="soundBtn" class="ghost" type="button">Sound on</button></div>
<div class="ui bottom"><div class="controls"><button id="draw" type="button">Pour</button><button id="reset" class="ghost" type="button" hidden>New draw</button></div><p class="hint" id="hint"></p></div>
<div id="result" class="sr" role="status" aria-live="polite"></div>

<script src="../core.js"></script>
<script type="importmap">
{ "imports": { "gsap": "../vendor/gsap/index.js", "gsap/": "../vendor/gsap/" } }
</script>
<script type="module">
import { gsap } from 'gsap';
const $ = id => document.getElementById(id);
const crucible = $('crucible'), stream = $('stream'), furnace = $('furnace'), plate = $('plate'), molten = $('molten'),
      plateName = $('plateName'), lbl = $('lbl'), sparksBox = $('sparks');
const sparks = Array.from({ length: 14 }, () => { const s = document.createElement('i'); sparksBox.appendChild(s); return s; });

function ring() {
  LD.snd.tone(784, 3.0, 0.05, 'sine');
  LD.snd.tone(1176, 2.4, 0.02, 'triangle');
  LD.snd.tone(1568, 1.8, 0.012, 'sine');
}
function setStart() {
  gsap.set(crucible, { rotation: 0 });
  gsap.set(stream, { scaleY: 0 });
  gsap.set(furnace, { opacity: 0 });
  gsap.set(molten, { scaleX: 0, opacity: 1 });
  gsap.set(plate, { y: 0, scale: 1 });
  gsap.set(plateName, { opacity: 0 });
  gsap.set(lbl, { opacity: 0 });
  gsap.set(sparks, { opacity: 0 });
}
setStart();

LD.stage({
  accent: '#e8b25c', drawingHint: 'The metal is pouring…',
  async draw(winner) {
    plateName.textContent = winner; LD.fitText(plateName, { max: 40, min: 10 });
    setStart();
    const tl = gsap.timeline();
    tl.to(furnace, { opacity: 1, duration: 1.2, ease: 'sine.out' }, 0)
      .to(crucible, { rotation: 28, duration: 1.6, ease: 'power2.inOut' }, 0.2)
      .add(() => LD.snd.noise(1.6, 0.02, { type: 'lowpass', freq: 900, attack: 0.3 }), 1.4)
      .to(stream, { scaleY: 1, duration: 0.6, ease: 'power1.in' }, 1.4)
      .to(molten, { scaleX: 1, duration: 2.4, ease: 'sine.inOut' }, 1.8)
      .to(sparks, { opacity: 1, duration: 0.2, stagger: 0.02 }, 2.2)
      .to(sparks, { x: () => (Math.random() - 0.5) * 60, y: () => -(12 + Math.random() * 50), opacity: 0, duration: 0.9, ease: 'power2.out', stagger: 0.05, repeat: 2 }, 2.2)
      .to(stream, { scaleY: 0, duration: 0.5, ease: 'power1.out' }, 4.2)
      .to(crucible, { rotation: 0, duration: 1.0, ease: 'power2.inOut' }, 4.4)
      .to(molten, { opacity: 0, duration: 2.6, ease: 'sine.inOut' }, 5.2)
      .to(plateName, { opacity: 1, duration: 1.0, ease: 'sine.out' }, 6.2)
      .add(ring, 6.5)
      .to(plate, { y: '-105%', scale: 1.4, duration: 1.6, ease: 'power3.inOut' }, 7.2)
      .to(furnace, { opacity: 0.35, duration: 1.0, ease: 'sine.out' }, 7.2)
      .to(lbl, { opacity: 1, duration: 0.8, ease: 'sine.out' }, 8.4);
    if (LD.reduced) tl.progress(1);
    return tl.then(() => {});
  },
  async reset() {
    const tl = gsap.timeline();
    tl.to([lbl, plateName], { opacity: 0, duration: 0.6, ease: 'sine.out' }, 0)
      .to(plate, { y: 0, scale: 1, duration: 1.4, ease: 'power3.inOut' }, 0.2)
      .to(furnace, { opacity: 0, duration: 1.0, ease: 'sine.out' }, 0)
      .to(sparks, { opacity: 0, duration: 0.3 }, 0);
    if (LD.reduced) tl.progress(1);
    await tl.then(() => {});
    setStart();
  }
});
</script>
</body>
</html>
