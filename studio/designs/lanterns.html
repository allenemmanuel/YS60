<!doctype html>
<html lang="en" data-design="lanterns">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sky Lanterns · Lucky Draw</title>
<link rel="stylesheet" href="../vendor/fonts/lanterns.css">
<link rel="stylesheet" href="ui.css">
<style>
/* Layout: full-bleed dusk sky over still water; lanterns rise; the chosen lantern drifts to the front and a silk banner unrolls beneath it with the name; title top-left, Release docked bottom-centre */
:root { --bg: #0b1030; --ink: #fff6e4; --muted: #c3b7d8; --accent: #ffc56b; --accent-2: #d9772a; --btn-ink: #2a1505;
  --display: "Cormorant Garamond", Georgia, serif; --body: "Nunito Sans", "Segoe UI", system-ui, sans-serif; }
.ui.top h1 { font-style: italic; }
.banner { position: fixed; z-index: 5; left: 50%; width: min(1000px, 90vw); transform: translateX(-50%); pointer-events: none;
  clip-path: inset(0 0 100% 0); display: grid; grid-template-rows: auto 1fr auto; justify-items: center; text-align: center; gap: 1vh;
  padding: 2.4vh 4vw 3vh; background: linear-gradient(180deg, #8f1c1c, #b3282a 12%, #a42224 88%, #7a1515);
  box-shadow: 0 30px 60px rgba(0,0,0,.45), inset 0 0 0 3px rgba(255,205,120,.55), inset 0 0 0 9px rgba(122,21,21,.9), inset 0 0 0 10px rgba(255,205,120,.35); }
.banner::before, .banner::after { content: ""; position: absolute; left: -2%; right: -2%; height: 14px; border-radius: 7px; background: linear-gradient(180deg, #ffe0a0, #c98f2c 60%, #8a5a14); }
.banner::before { top: -7px; } .banner::after { bottom: -7px; opacity: 0; transition: opacity .3s; }
.banner.open::after { opacity: 1; }
.banner .lbl { font: 700 clamp(11px, 1.3vw, 15px)/1 var(--body); letter-spacing: .4em; text-transform: uppercase; color: #ffd99a; }
.banner .fit { width: 100%; min-height: 0; display: grid; place-items: center; overflow: hidden; }
.banner .name { font-family: var(--display); font-weight: 700; color: #fff4dc; line-height: 1.05; text-shadow: 0 2px 0 rgba(90,10,10,.6), 0 0 24px rgba(255,190,100,.35); overflow-wrap: normal; text-wrap: balance; }
.banner .prize { font: 600 clamp(11px, 1.2vw, 14px)/1 var(--body); letter-spacing: .26em; text-transform: uppercase; color: #ffd99a; min-height: 1em; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div class="banner" id="banner" aria-hidden="true"><div class="lbl">Fortune smiles on</div><div class="fit"><div class="name" id="winName"></div></div><div class="prize" data-ld-prize></div></div>
<div class="ui top"><div><h1 data-ld-prize>Lucky Draw</h1><p id="meta"></p></div><button id="soundBtn" class="ghost" type="button">Sound on</button></div>
<div class="ui bottom"><div class="controls"><button id="draw" type="button">Release</button><button id="reset" class="ghost" type="button" hidden>New draw</button></div><p class="hint" id="hint"></p></div>
<div id="result" class="sr" role="status" aria-live="polite"></div>

<script src="../core.js"></script>
<script>
(() => {
const cv = document.getElementById('c'), g = cv.getContext('2d');
let W, H, dpr, bg = null, lanterns = [], wind = 0, hero = null;
const SPR_W = 200, SPR_H = 300;

// one lantern drawn once at high resolution; every lantern on screen is this image scaled
const sprite = (() => {
  const c = document.createElement('canvas'); c.width = SPR_W; c.height = SPR_H; const s = c.getContext('2d');
  const cx = SPR_W / 2, top = 70, bot = 250, tw = 70, bw = 52;
  const halo = s.createRadialGradient(cx, 175, 10, cx, 175, 140); halo.addColorStop(0, 'rgba(255,170,70,.55)'); halo.addColorStop(1, 'rgba(255,120,40,0)');
  s.fillStyle = halo; s.fillRect(0, 0, SPR_W, SPR_H);
  s.beginPath(); s.moveTo(cx - tw, top + 12); s.quadraticCurveTo(cx - tw, top, cx - tw + 12, top); s.lineTo(cx + tw - 12, top); s.quadraticCurveTo(cx + tw, top, cx + tw, top + 12);
  s.bezierCurveTo(cx + tw + 6, top + 80, cx + bw + 4, bot - 40, cx + bw, bot); s.lineTo(cx - bw, bot); s.bezierCurveTo(cx - bw - 4, bot - 40, cx - tw - 6, top + 80, cx - tw, top + 12); s.closePath();
  const body = s.createRadialGradient(cx, bot - 30, 6, cx, 160, 120);
  body.addColorStop(0, '#fff6cf'); body.addColorStop(0.35, '#ffc062'); body.addColorStop(0.75, '#e8742e'); body.addColorStop(1, '#a8361c');
  s.fillStyle = body; s.fill();
  s.strokeStyle = 'rgba(140,40,15,.35)'; s.lineWidth = 2;
  for (const k of [-0.5, 0, 0.5]) { s.beginPath(); s.moveTo(cx + k * tw, top); s.quadraticCurveTo(cx + k * tw * 1.1, (top + bot) / 2, cx + k * bw, bot); s.stroke(); }
  s.fillStyle = '#6e2412'; s.fillRect(cx - bw, bot - 4, bw * 2, 8);
  const fl = s.createRadialGradient(cx, bot + 4, 0, cx, bot + 4, 22); fl.addColorStop(0, 'rgba(255,255,230,1)'); fl.addColorStop(1, 'rgba(255,190,80,0)');
  s.fillStyle = fl; s.beginPath(); s.arc(cx, bot + 4, 22, 0, Math.PI * 2); s.fill();
  return c;
})();

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  bg = document.createElement('canvas'); bg.width = W * dpr; bg.height = H * dpr; const b = bg.getContext('2d'); b.scale(dpr, dpr);
  const sky = b.createLinearGradient(0, 0, 0, H * 0.72);
  sky.addColorStop(0, '#070b26'); sky.addColorStop(0.45, '#1c1a4a'); sky.addColorStop(0.8, '#5a2f5a'); sky.addColorStop(1, '#b0574a');
  b.fillStyle = sky; b.fillRect(0, 0, W, H * 0.72);
  for (let i = 0; i < W * H / 3500; i++) { b.fillStyle = `rgba(255,255,255,${Math.random() * 0.6})`; b.fillRect(Math.random() * W, Math.random() * H * 0.5, 1.2, 1.2); }
  const moon = b.createRadialGradient(W * 0.82, H * 0.16, 0, W * 0.82, H * 0.16, H * 0.12); moon.addColorStop(0, 'rgba(255,248,225,1)'); moon.addColorStop(0.32, 'rgba(255,240,205,.95)'); moon.addColorStop(0.36, 'rgba(255,230,190,.25)'); moon.addColorStop(1, 'rgba(255,230,190,0)');
  b.fillStyle = moon; b.fillRect(0, 0, W, H);
  // far hills
  b.fillStyle = '#1a1433'; b.beginPath(); b.moveTo(0, H * 0.72);
  for (let x = 0; x <= W; x += 20) b.lineTo(x, H * 0.72 - 30 - Math.sin(x / W * 7 + 1) * 22 - Math.sin(x / W * 17) * 10 - (x > W * 0.15 && x < W * 0.45 ? Math.sin((x - W * 0.15) / (W * 0.3) * Math.PI) * H * 0.09 : 0));
  b.lineTo(W, H * 0.72); b.fill();
  // still water
  const water = b.createLinearGradient(0, H * 0.72, 0, H); water.addColorStop(0, '#3a2348'); water.addColorStop(1, '#0a0b22');
  b.fillStyle = water; b.fillRect(0, H * 0.72, W, H * 0.28);
  for (let y = H * 0.73; y < H; y += 6) { b.fillStyle = `rgba(255,190,140,${0.05 * (1 - (y - H * 0.72) / (H * 0.28))})`; b.fillRect(W * 0.2 + Math.sin(y) * 30, y, W * 0.6, 1); }
  if (!lanterns.length) seed();
}
function spawn(y) {
  const z = Math.random(); // 0 far .. 1 near
  return { x: Math.random() * W, y: y ?? H * (0.75 + Math.random() * 0.2), z, s: 0.08 + z * z * 0.32, vy: 0.15 + z * 0.45 + Math.random() * 0.15, ph: Math.random() * 6, f: Math.random() * 6 };
}
function seed() { lanterns = Array.from({ length: Math.round(Math.min(60, W / 22)) }, () => spawn(Math.random() * H * 0.9)); lanterns.sort((a, b) => a.z - b.z); }
function drawLantern(x, y, s, alpha, flick) {
  const w = SPR_W * s, h = SPR_H * s;
  g.globalAlpha = alpha * (0.88 + 0.12 * flick); g.drawImage(sprite, x - w / 2, y - h / 2, w, h);
  // reflection in the water
  const ry = H * 0.72 + (H * 0.72 - y) * 0.35;
  if (y < H * 0.72 && ry < H) { g.globalAlpha = alpha * 0.12; g.drawImage(sprite, x - w / 2, ry - h / 2, w, h * 0.6); }
  g.globalAlpha = 1;
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(2.5, (now - last) / 16.67), t = now / 1000; last = now;
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.drawImage(bg, 0, 0, W, H);
  wind *= Math.pow(0.985, dt);
  for (const L of lanterns) {
    L.y -= (L.vy + wind * (0.4 + L.z)) * dt; L.x += (Math.sin(t * 0.6 + L.ph) * 0.15 + wind * 0.5 * L.z) * dt;
    if (L.y < -SPR_H * L.s) { if (wind > 0.5) { L.dead = true; continue; } Object.assign(L, spawn(H * 0.78 + Math.random() * 30)); }
    if (L.x > W + 60) L.x = -50;
    drawLantern(L.x, L.y, L.s, 0.35 + L.z * 0.65, Math.sin(t * 9 + L.f));
  }
  lanterns = lanterns.filter(L => !L.dead);
  if (hero) drawLantern(hero.x + Math.sin(t * 0.9) * hero.sway, hero.y + Math.sin(t * 1.3) * hero.bob, hero.s, 1, Math.sin(t * 11));
  requestAnimationFrame(loop);
}

const banner = document.getElementById('banner');
LD.stage({
  accent: '#ffc56b', drawingHint: 'Make a wish…',
  async draw(winner) {
    // a warm gust sends the lanterns up and away
    LD.snd.whoosh(2.2, 0.06); wind = 4.5;
    await LD.sleep(2600);
    // the chosen lantern drifts down from above to the front
    hero = { x: W * 0.62, y: -SPR_H * 0.5, s: 0.25, sway: 0, bob: 0 };
    const targetS = Math.min((H * 0.36) / SPR_H, (W * 0.3) / SPR_W), ty = H * 0.25;
    LD.snd.tone(523, 2.5, 0.03); LD.snd.tone(784, 2.5, 0.02, 'sine', 0.4);
    await LD.tween(LD.reduced ? 0 : 3600, (e, k) => {
      hero.x = W * 0.62 + (W / 2 - W * 0.62) * e + Math.sin(k * Math.PI * 2) * W * 0.04;
      hero.y = -SPR_H * 0.5 + (ty + SPR_H * 0.5) * e; hero.s = 0.25 + (targetS - 0.25) * e;
      hero.sway = 6 * e; hero.bob = 5 * e;
    }, LD.ease.outCubic);
    // the banner unrolls under it
    const nameEl = document.getElementById('winName'); nameEl.textContent = winner;
    const top = ty + SPR_H * targetS * 0.42, avail = H - top - H * 0.16;
    Object.assign(banner.style, { top: top + 'px', height: Math.max(150, Math.min(avail, H * 0.42)) + 'px' });
    LD.fitText(nameEl, { max: Math.min(110, innerWidth * 0.08), min: 18 });
    LD.snd.whoosh(0.9, 0.05);
    await banner.animate([{ clipPath: 'inset(0 0 100% 0)' }, { clipPath: 'inset(0 0 0% 0)' }], { duration: LD.reduced ? 1 : 1300, easing: 'cubic-bezier(.3,.7,.2,1)', fill: 'forwards' }).finished;
    banner.classList.add('open');
    LD.snd.chime(); LD.confetti({ colors: ['#ffc56b', '#fff2cc', '#ff8a4c', '#e34a3a'], count: 160 });
    // new lanterns slowly return around it
    wind = 0; for (let i = 0; i < 20; i++) lanterns.push(spawn(H * (0.8 + Math.random() * 0.2)));
  },
  async reset() {
    banner.classList.remove('open');
    await banner.animate([{ clipPath: 'inset(0 0 0% 0)' }, { clipPath: 'inset(0 0 100% 0)' }], { duration: 700, easing: 'cubic-bezier(.5,0,.75,0)', fill: 'forwards' }).finished;
    const y0 = hero.y;
    await LD.tween(1600, e => { hero.y = y0 - (y0 + SPR_H) * e; hero.s *= 0.995; }, LD.ease.inOutCubic);
    hero = null;
    while (lanterns.length < Math.round(Math.min(60, W / 22))) lanterns.push(spawn(H * (0.75 + Math.random() * 0.25)));
    lanterns.sort((a, b) => a.z - b.z);
  }
});
addEventListener('resize', resize);
resize(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
