<!doctype html><html data-design="board"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Departure Board Draw</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../vendor/fonts/board.css">
<style>
/* Layout: a station-hall wall in oxblood enamel; one brass-framed split-flap board centred, status rail above, entries ticker below, controls docked at the bottom */
:root {
  --wall: #2a0b10;
  --wall-2: #3d1218;
  --brass: #c9a25a;
  --brass-dim: #8a6a33;
  --tile: #141313;
  --tile-2: #1d1c1b;
  --glyph: #f2ead8;
  --amber: #ffb547;
  --ink: #f5ece0;
  --muted: #c6a9a0;
  --tiles: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --display: "Big Shoulders Display", "Barlow Condensed", Impact, sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: radial-gradient(120% 90% at 50% 0%, var(--wall-2) 0%, var(--wall) 60%, #1a0609 100%) fixed, var(--wall);
  color: var(--ink); font-family: var(--body); overflow-x: hidden; }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .18;
  background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 88px); }
.page { min-height: 100%; display: flex; flex-direction: column; align-items: center; gap: clamp(18px, 3vh, 30px);
  padding-block: calc(22px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.mast { width: min(1120px, 100%); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.mast h1 { margin: 0; font-family: var(--display); font-weight: 900; letter-spacing: .04em; font-size: clamp(30px, 5.5vw, 54px); line-height: .95; color: var(--brass); text-transform: uppercase; }
.mast h1 small { display: block; font-family: var(--body); font-weight: 500; font-size: 12px; letter-spacing: .32em; color: var(--muted); margin-top: 6px; }
button { font-family: var(--tiles); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; cursor: pointer; transition: transform .12s, background .2s, opacity .2s; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
.ghost { background: transparent; color: var(--brass); border: 1px solid var(--brass-dim); border-radius: 6px; padding: 10px 16px; font-size: 14px; }
.ghost:hover { background: rgba(201,162,90,.1); }

/* board */
.housing { width: min(1120px, 100%); padding: clamp(10px, 2vw, 22px); border-radius: 14px;
  background: linear-gradient(180deg, #2c2a27, #171615); border: 2px solid var(--brass-dim);
  box-shadow: 0 0 0 6px #120405, 0 30px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08); }
.rail { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 0 4px 12px; font-family: var(--tiles);
  font-weight: 600; letter-spacing: .18em; font-size: clamp(12px, 1.6vw, 15px); color: var(--brass); text-transform: uppercase; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.status { display: inline-flex; align-items: center; gap: 8px; color: var(--glyph); }
.lamp { width: 10px; height: 10px; border-radius: 50%; background: #4a3a20; box-shadow: inset 0 1px 2px rgba(0,0,0,.6); }
.lamp.on { background: var(--amber); box-shadow: 0 0 10px var(--amber), 0 0 22px rgba(255,181,71,.6); }
.lamp.blink { animation: blink .5s steps(2) infinite; }
@keyframes blink { 50% { background: #4a3a20; box-shadow: none; } }
#board { display: grid; gap: var(--gap); justify-content: center; padding: var(--gap); background: #0b0b0b; border-radius: 6px; }
.tile { position: relative; width: var(--tw); height: var(--th); perspective: calc(var(--th) * 6); font-family: var(--tiles); font-weight: 600;
  font-size: var(--fs); color: var(--glyph); }
.half, .flap { position: absolute; left: 0; right: 0; height: 50%; overflow: hidden; background: linear-gradient(180deg, var(--tile-2), var(--tile)); backface-visibility: hidden; }
.half.top, .flap.ftop { top: 0; border-radius: 3px 3px 0 0; transform-origin: 50% 100%; }
.half.bot, .flap.fbot { bottom: 0; border-radius: 0 0 3px 3px; transform-origin: 50% 0%; background: linear-gradient(180deg, #121111, #0e0d0d); }
.half span, .flap span { display: block; height: var(--th); line-height: var(--th); text-align: center; }
.half.bot span, .flap.fbot span { transform: translateY(-50%); }
.tile::after { content: ""; position: absolute; left: 0; right: 0; top: calc(50% - 1px); height: 2px; background: #000; z-index: 3; }
.flap { z-index: 2; visibility: hidden; }
.tile.win .half span, .tile.win .flap span { color: var(--amber); text-shadow: 0 0 calc(var(--fs) * .25) rgba(255,181,71,.55); }

/* ticker */
.ticker { width: min(1120px, 100%); overflow: hidden; border-block: 1px solid rgba(201,162,90,.35); padding-block: 8px; mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
.ticker-track { display: inline-flex; gap: 28px; white-space: nowrap; animation: tick var(--dur, 60s) linear infinite; font-family: var(--tiles); font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-size: 14px; }
.ticker-track span.won { color: var(--brass); text-decoration: line-through; text-decoration-color: rgba(201,162,90,.6); }
@keyframes tick { to { transform: translateX(-50%); } }

/* winner banner */
#result { width: min(1120px, 100%); text-align: center; opacity: 0; transition: opacity 1.2s ease; min-height: 1px; }
#result.show { opacity: 1; }
#result .lbl { font-size: 12px; letter-spacing: .32em; text-transform: uppercase; color: var(--muted); }
#result .name { font-family: var(--display); font-weight: 800; color: var(--amber); line-height: 1.05; margin-top: 6px; overflow-wrap: anywhere; text-wrap: balance;
  font-size: clamp(26px, 4.6vw, 46px); text-shadow: 0 0 24px rgba(255,181,71,.35); }

.controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center; }
#draw { font-size: 22px; padding: 16px 54px; border-radius: 8px; border: 0; color: #2a1405;
  background: linear-gradient(180deg, #ffd27c, var(--amber) 55%, #d98a1e); box-shadow: 0 6px 0 #7a4710, 0 12px 30px rgba(255,181,71,.35); }
#draw:hover:not(:disabled) { transform: translateY(-1px); }
#draw:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 #7a4710, 0 6px 16px rgba(255,181,71,.3); }
#draw:disabled { opacity: .45; cursor: default; }
.hint { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }

/* names drawer */
#drawer { position: fixed; z-index: 6; top: 0; right: 0; bottom: 0; width: min(390px, 100%); background: rgba(26, 7, 10, .97);
  border-left: 1px solid var(--brass-dim); display: flex; flex-direction: column; gap: 14px;
  padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: 22px; padding-right: max(22px, env(safe-area-inset-right, 0px));
  transform: translateX(105%); transition: transform .35s cubic-bezier(.2,.8,.2,1); visibility: hidden; }
#drawer.open { transform: none; visibility: visible; }
#drawer header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
#drawer h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: .06em; color: var(--brass); text-transform: uppercase; }
#drawer label.cap { font-size: 13px; color: var(--muted); }
#names { flex: 1; min-height: 160px; resize: none; background: rgba(0,0,0,.3); color: var(--ink); border: 1px solid var(--brass-dim); border-radius: 8px; padding: 12px 14px; font: 14px/1.55 var(--body); }
.row { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.row input { accent-color: var(--amber); width: 18px; height: 18px; }
.drawer-actions { display: flex; gap: 10px; flex-wrap: wrap; }
#saveNames { font-size: 15px; padding: 11px 22px; border-radius: 6px; border: 0; color: #2a1405; background: var(--amber); }
.winners { font-size: 14px; max-height: 28vh; overflow-y: auto; }
.winners h3 { margin: 0 0 6px; font-family: var(--tiles); font-size: 13px; letter-spacing: .2em; color: var(--brass); font-weight: 600; }
.winners ol { margin: 0; padding-left: 22px; display: grid; gap: 4px; overflow-wrap: anywhere; }
@media (prefers-reduced-motion: reduce) { .ticker-track { animation: none; } #drawer { transition: none; } }
</style>

<div class="page">
  <header class="mast">
    <h1>Lucky Draw<small data-ld-prize>Grand prize</small></h1>
    <div class="controls">
      <button id="soundBtn" class="ghost" type="button" aria-pressed="true">Sound on</button>
      <button id="namesBtn" class="ghost" type="button" aria-controls="drawer" aria-expanded="false">Names</button>
    </div>
  </header>

  <section class="housing" aria-label="Draw board">
    <div class="rail">
      <span id="drawNo">Draw 01</span>
      <span id="entries">— entries</span>
      <span class="status"><span class="lamp" id="lamp"></span><span id="statusText">Ready</span></span>
    </div>
    <div id="board" role="img" aria-label="Split-flap board"></div>
  </section>

  <div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>

  <div id="result" role="status" aria-live="polite"><div class="lbl">And the winner is</div><div class="name" id="winName">—</div></div>

  <div class="controls">
    <button id="draw" type="button">Draw</button>
    <button id="reset" class="ghost" type="button" hidden>New draw</button>
  </div>
  <p class="hint" id="hint">Press Draw to pick a winner</p>
</div>

<aside id="drawer" aria-label="Names in the draw">
  <header><h2>Names</h2><button id="closeDrawer" class="ghost" type="button">Close</button></header>
  <label class="cap" for="names">One name per line. These are sample names, so replace them with your own.</label>
  <textarea id="names" spellcheck="false"></textarea>
  <label class="row" for="removeWinners"><input type="checkbox" id="removeWinners" checked> Take winners out of the next draws</label>
  <div class="drawer-actions">
    <button id="saveNames" type="button">Save names</button>
    <button id="clearWinners" class="ghost" type="button">Clear winners</button>
  </div>
  <div class="winners" id="winnersBox" hidden><h3>Winners so far</h3><ol id="winnersList"></ol></div>
</aside>

<script src="../core.js"></script>
<script>
(() => {
const CHARS = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-/.'@&";
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);

// ---------- names ----------
const LS = LD.load();
let names = LS.names, winners = LS.winners, removeWinners = LS.removeWinners, soundOn = LS.soundOn, musicOn = LS.musicOn;
const persist = () => LD.save({ names, winners, removeWinners, soundOn, musicOn });
const drawPool = () => removeWinners ? names.filter(n => !winners.includes(n)) : names.slice();
const toBoard = s => s.toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '').split('').map(c => CHARS.includes(c) ? c : ' ').join('');

// ---------- sound: a short filtered noise "clack" per flap ----------
let ac = null, noiseBuf = null, lastClack = 0;
function initAudio() {
  if (ac) return; try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.03), ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 4);
  } catch (e) { ac = null; }
}
function clack() {
  if (!soundOn || !ac) return;
  const now = ac.currentTime; if (now - lastClack < 0.012) return; lastClack = now;
  const src = ac.createBufferSource(); src.buffer = noiseBuf; src.playbackRate.value = 0.8 + Math.random() * 0.5;
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2200 + Math.random() * 1400; f.Q.value = 1.2;
  const g = ac.createGain(); g.gain.value = 0.11 + Math.random() * 0.06;
  src.connect(f).connect(g).connect(ac.destination); src.start(now);
}

// ---------- tiles ----------
class Tile {
  constructor() {
    this.el = document.createElement('div'); this.el.className = 'tile';
    this.el.innerHTML = '<div class="half top"><span></span></div><div class="half bot"><span></span></div><div class="flap ftop"><span></span></div><div class="flap fbot"><span></span></div>';
    [this.top, this.bot, this.ftop, this.fbot] = [...this.el.children];
    this.char = ' '; this.set(' '); this.token = 0;
  }
  set(c) { this.char = c; this.top.firstChild.textContent = c; this.bot.firstChild.textContent = c; }
  async flip(to, d) {
    const from = this.char; if (from === to) return;
    this.top.firstChild.textContent = to;            // revealed behind the falling flap
    this.ftop.firstChild.textContent = from; this.fbot.firstChild.textContent = to;
    this.ftop.style.visibility = 'visible'; this.fbot.style.visibility = 'visible';
    this.fbot.style.transform = 'rotateX(90deg)';
    clack();
    if (d > 0) {
      await this.ftop.animate([{ transform: 'rotateX(0deg)' }, { transform: 'rotateX(-90deg)' }], { duration: d / 2, easing: 'ease-in', fill: 'forwards' }).finished;
      await this.fbot.animate([{ transform: 'rotateX(90deg)' }, { transform: 'rotateX(0deg)' }], { duration: d / 2, easing: 'ease-out', fill: 'forwards' }).finished;
    }
    this.bot.firstChild.textContent = to; this.char = to;
    this.ftop.style.visibility = 'hidden'; this.fbot.style.visibility = 'hidden';
    this.ftop.getAnimations().forEach(a => a.cancel()); this.fbot.getAnimations().forEach(a => a.cancel());
  }
}

// ---------- board layout (columns adapt to screen; long names wrap across rows) ----------
const boardEl = $('board');
let cols = 0, rows = 0, tiles = [];
function layoutFor(w) { return w >= 900 ? [24, 4] : w >= 600 ? [18, 5] : [13, 7]; }
function wrapName(text, c) {
  const words = text.split(/\s+/).filter(Boolean), lines = []; let line = '';
  for (let w of words) {
    while (w.length > c) { if (line) { lines.push(line); line = ''; } lines.push(w.slice(0, c - 1) + '-'); w = w.slice(c - 1); }
    const t = line ? line + ' ' + w : w;
    if (t.length <= c) line = t; else { lines.push(line); line = w; }
  }
  if (line) lines.push(line);
  return lines;
}
// a frame is the full grid as one string per row, each line centred
function frameFor(lines) {
  const out = Array.from({ length: rows }, () => ' '.repeat(cols));
  const top = Math.max(0, Math.floor((rows - lines.length) / 2));
  lines.slice(0, rows).forEach((l, i) => { const pad = Math.floor((cols - l.length) / 2); out[top + i] = (' '.repeat(pad) + l).padEnd(cols, ' '); });
  return out.join('');
}
function build(minRows = 0) {
  const housingW = boardEl.parentElement.clientWidth - parseFloat(getComputedStyle(boardEl.parentElement).paddingLeft) * 2;
  let [c, r] = layoutFor(window.innerWidth); r = Math.max(r, minRows);
  const gap = c > 18 ? 4 : 3;
  const tw = Math.floor((housingW - gap * (c + 1)) / c), th = Math.round(tw * 1.42);
  boardEl.style.setProperty('--gap', gap + 'px'); boardEl.style.setProperty('--tw', tw + 'px');
  boardEl.style.setProperty('--th', th + 'px'); boardEl.style.setProperty('--fs', Math.round(th * 0.74) + 'px');
  if (c === cols && r === rows) return false;
  const prev = tiles.map(t => t.char).join('');
  cols = c; rows = r; boardEl.style.gridTemplateColumns = `repeat(${cols}, var(--tw))`;
  tiles = Array.from({ length: cols * rows }, () => new Tile());
  boardEl.replaceChildren(...tiles.map(t => t.el));
  return true;
}
function maxRowsNeeded(list) { return list.reduce((m, n) => Math.max(m, wrapName(toBoard(n), layoutFor(innerWidth)[0]).length), 0); }

// ---------- animation ----------
let runId = 0;
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function sequenceTo(tile, target, d, run) { // real split-flap order: step through the drum of characters
  let i = CHARS.indexOf(tile.char), j = CHARS.indexOf(target); if (j < 0) j = 0;
  while (i !== j && run === runId) { i = (i + 1) % CHARS.length; await tile.flip(CHARS[i], d); }
}
async function showFrame(frame, { d = 70, stagger = 18, run = ++runId } = {}) {
  await Promise.all(tiles.map(async (t, k) => {
    const col = k % cols, row = Math.floor(k / cols);
    await sleep(col * stagger + row * stagger * 2);
    await sequenceTo(t, frame[k], reduced ? 0 : d, run);
  }));
}
async function scramble(ms, run) {
  const end = performance.now() + ms;
  await Promise.all(tiles.map(async t => {
    await sleep(Math.random() * 200);
    while (performance.now() < end && run === runId) await t.flip(CHARS[1 + Math.floor(Math.random() * 26)], 46 + Math.random() * 30);
  }));
}

// ---------- UI ----------
const drawBtn = $('draw'), resetBtn = $('reset'), namesBtn = $('namesBtn'), drawerEl = $('drawer'), namesEl = $('names');
const resultEl = $('result'), winNameEl = $('winName'), hintEl = $('hint'), lamp = $('lamp'), statusText = $('statusText');
let busy = false, shownWinner = false;
function setStatus(text, mode) { statusText.textContent = text; lamp.className = 'lamp' + (mode === 'blink' ? ' on blink' : mode === 'on' ? ' on' : ''); }
function renderUI() {
  const p = drawPool().length;
  $('entries').textContent = p === 1 ? '1 entry' : `${p} entries`;
  $('drawNo').textContent = 'Draw ' + String(winners.length + (shownWinner ? 0 : 1)).padStart(2, '0');
  namesBtn.textContent = `Names · ${names.length}`;
  $('winnersBox').hidden = winners.length === 0;
  $('winnersList').replaceChildren(...winners.map(w => Object.assign(document.createElement('li'), { textContent: w })));
  $('removeWinners').checked = removeWinners;
  $('soundBtn').textContent = soundOn ? 'Sound on' : 'Sound off'; $('soundBtn').setAttribute('aria-pressed', String(soundOn));
  if (!busy && !shownWinner) { drawBtn.disabled = p === 0; hintEl.textContent = p === 0 ? 'Add names to start the draw' : 'Press Draw to pick a winner'; }
  const track = $('ticker');
  const items = names.map(n => `<span class="${winners.includes(n) && removeWinners ? 'won' : ''}">${n.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))}</span><span>◆</span>`).join('');
  track.innerHTML = items + items; track.style.setProperty('--dur', Math.max(30, names.join('').length * 0.18) + 's');
}
function idleFrame() { const p = drawPool().length; return frameFor(['LUCKY DRAW', '', p ? `${p} ENTRIES` : 'ADD NAMES'].map(toBoard)); }

drawBtn.addEventListener('click', async () => {
  const p = drawPool(); if (busy || !p.length) return;
  initAudio(); if (ac && ac.state === 'suspended') ac.resume();
  busy = true; drawBtn.disabled = true; namesBtn.disabled = true; openDrawer(false);
  tiles.forEach(t => t.el.classList.remove('win'));
  const winner = LD.pick(p);
  const need = wrapName(toBoard(winner), cols).length;
  if (need > rows) { build(need); tiles.forEach(t => t.set(' ')); }
  setStatus('Drawing', 'blink'); hintEl.textContent = 'Drawing…';
  const run = ++runId;
  await scramble(reduced ? 300 : 2300, run);
  if (run !== runId) return;
  setStatus('Final call', 'blink');
  await showFrame(frameFor(wrapName(toBoard(winner), cols)), { d: 64, stagger: 22, run });
  if (run !== runId) return;
  tiles.forEach((t, k) => { if (t.char !== ' ') { t.el.classList.add('win'); t.el.animate([{ filter: 'brightness(1)' }, { filter: 'brightness(1.9)' }, { filter: 'brightness(1)' }], { duration: 700, delay: (k % cols) * 28, easing: 'ease-out' }); } });
  setStatus('Winner', 'on'); LD.confetti({ colors: ['#ffb547', '#ffd27c', '#c9a25a', '#f2ead8'] }); LD.snd.chime && (LD.audio(), soundOn && LD.snd.chime());
  winNameEl.textContent = winner; resultEl.classList.add('show');
  if (!winners.includes(winner)) winners.push(winner);
  shownWinner = true; busy = false; persist(); renderUI();
  $('drawNo').textContent = 'Draw ' + String(winners.length).padStart(2, '0');
  resetBtn.hidden = false; drawBtn.hidden = true; hintEl.textContent = 'Press New draw to go again';
});
resetBtn.addEventListener('click', async () => {
  resetBtn.hidden = true; drawBtn.hidden = false; resultEl.classList.remove('show'); shownWinner = false;
  tiles.forEach(t => t.el.classList.remove('win'));
  busy = true; namesBtn.disabled = false; setStatus('Ready', 'off');
  if (build()) tiles.forEach(t => t.set(' '));
  await showFrame(idleFrame(), { d: 50, stagger: 10 });
  busy = false; renderUI();
});

function openDrawer(open) {
  drawerEl.classList.toggle('open', open); namesBtn.setAttribute('aria-expanded', String(open));
  if (open) { namesEl.value = names.join('\n'); namesEl.focus(); }
}
namesBtn.addEventListener('click', () => openDrawer(!drawerEl.classList.contains('open')));
$('closeDrawer').addEventListener('click', () => openDrawer(false));
$('saveNames').addEventListener('click', () => {
  names = [...new Set(namesEl.value.split('\n').map(s => s.replace(/\s+/g, ' ').trim()).filter(Boolean))];
  persist(); renderUI(); openDrawer(false);
  if (!busy && !shownWinner) showFrame(idleFrame(), { d: 50, stagger: 10 });
});
$('clearWinners').addEventListener('click', () => { winners = []; persist(); renderUI(); if (!busy && !shownWinner) showFrame(idleFrame(), { d: 50, stagger: 10 }); });
$('removeWinners').addEventListener('change', e => { removeWinners = e.target.checked; persist(); renderUI(); if (!busy && !shownWinner) showFrame(idleFrame(), { d: 50, stagger: 10 }); });
$('soundBtn').addEventListener('click', () => { soundOn = !soundOn; persist(); renderUI(); });
addEventListener('keydown', e => { if (e.key === 'Escape') openDrawer(false); });

let resizeT;
addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    if (busy) { build(rows); return; }               // only resize tiles mid-draw
    const keep = shownWinner ? winNameEl.textContent : null;
    const need = keep ? wrapName(toBoard(keep), layoutFor(innerWidth)[0]).length : 0;
    if (build(need)) {
      const f = keep ? frameFor(wrapName(toBoard(keep), cols)) : idleFrame();
      tiles.forEach((t, k) => { t.set(f[k]); if (keep && f[k] !== ' ') t.el.classList.add('win'); });
    }
  }, 150);
});

// start: the board is already showing the idle message (fully readable at rest), then does a short settle flip
build();
renderUI(); setStatus('Ready', 'off');
const first = idleFrame(); tiles.forEach((t, k) => t.set(first[k]));
})();
</script>

<script>LD.chrome({ primary: ['draw','reset'], accent: '#c9a25a' });</script>
</body></html>
