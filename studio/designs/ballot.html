<!doctype html>
<html lang="en" data-design="ballot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crystal Ballot · Lucky Draw</title>
<link rel="stylesheet" href="../vendor/fonts/ballot.css">
<link rel="stylesheet" href="ui.css">
<style>
/* Layout: a crystal ballot urn of engraved gold tokens on a dark plinth, lower centre; the chosen token rises into a
   beam of light above the urn mouth; the winner's name settles in the band above it. */
:root { --bg: #04060a; --ink: #eef1f5; --muted: #a3acb8; --accent: #e2c886; --accent-2: #a98a46; --btn-ink: #15110a;
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif; --body: "Manrope", "Segoe UI", system-ui, sans-serif; }
.ui.top h1 { font-weight: 600; letter-spacing: .02em; }
#draw { font-family: var(--body); font-weight: 600; font-size: 15px; letter-spacing: .34em; padding: 16px 52px; }
.winner { visibility: hidden; padding: 8vh 8vw 76vh; }
.winner .box { max-height: 22vh; gap: .8vh; grid-template-rows: auto 1fr auto auto; }
.winner .lbl { color: rgba(238,241,245,.7); letter-spacing: .5em; font-size: clamp(11px, 1.2vw, 14px); }
.winner .name { font-family: var(--display); font-weight: 600; line-height: 1.02; color: #f3e7c6; text-shadow: 0 2px 16px rgba(0,0,0,.8); }
.winner .name .ch { display: inline-block; will-change: transform, opacity; }
.winner .name .wd { display: inline-block; white-space: nowrap; }
.winner .rule { width: min(300px, 34vw); height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
.winner .prize { letter-spacing: .3em; }
#loading { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; color: var(--muted); letter-spacing: .4em; font-size: 11px; text-transform: uppercase; pointer-events: none; }
#loading[hidden] { display: none; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="loading">Sealing the ballot…</div>
<div class="ui top"><div><h1 data-ld-prize>Lucky Draw</h1><p id="meta"></p></div><button id="soundBtn" class="ghost" type="button">Sound on</button></div>
<div class="winner" id="win" aria-hidden="true"><div class="box"><div class="lbl">Drawn in full view</div><div class="fit"><div class="name" id="winName"></div></div><div class="rule" id="rule"></div><div class="prize" data-ld-prize></div></div></div>
<div class="ui bottom"><div class="controls"><button id="draw" type="button">Draw</button><button id="reset" class="ghost" type="button" hidden>New draw</button></div><p class="hint" id="hint"></p></div>
<div id="result" class="sr" role="status" aria-live="polite"></div>

<script src="../core.js"></script>
<script type="importmap">
{ "imports": {
  "three": "../vendor/three/build/three.module.js",
  "three/addons/": "../vendor/three/examples/jsm/",
  "gsap": "../vendor/gsap/index.js",
  "gsap/": "../vendor/gsap/"
} }
</script>
<script>
setTimeout(() => { if (!window.__ballotReady) { const l = document.getElementById('loading'); l.hidden = false;
  l.textContent = 'Could not load the 3D engine. Open the studio through a local web server (e.g. python -m http.server), not by double-clicking the file.'; } }, 12000);
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { gsap } from 'gsap';
import { SplitText } from 'gsap/SplitText.js';
gsap.registerPlugin(SplitText);
window.__ballotReady = true;

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
document.getElementById('stage').appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x030508);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.3, 0.45, 0.9);
composer.addPass(bloom); composer.addPass(new OutputPass());

// stir: how hard the tokens tumble; amb: hall light (dims for the selection); beam: the light from above;
// rise: chosen token lifted out of the urn; face: token turns to the audience; glow: engraving flares
const P = { stir: .25, amb: 1, beam: 0, rise: 0, face: 0, glow: 0, cam: 0 };

// ---------- backdrop ----------
const wall = new THREE.Mesh(new THREE.PlaneGeometry(80, 50), new THREE.ShaderMaterial({
  uniforms: { amb: { value: 1 }, beam: { value: 0 } },
  vertexShader: `varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `uniform float amb; uniform float beam; varying vec2 vP;
    void main(){ vec2 p = vP - vec2(0., 3.); float g = exp(-dot(p*vec2(.07,.06), p*vec2(.07,.06)) * 2.);
      vec3 c = vec3(.006,.009,.016) + vec3(.035,.055,.09) * g * amb + vec3(.09,.075,.045) * exp(-abs(vP.x) * .35) * beam * .5;
      gl_FragColor = vec4(c, 1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
}));
wall.position.set(0, 3, -9); scene.add(wall);

// ---------- plinth ----------
const plinth = new THREE.Mesh(new THREE.CylinderGeometry(1.9, 2.05, 1.2, 96), new THREE.MeshPhysicalMaterial({ color: 0x0b0d12, roughness: .25, metalness: 0, clearcoat: 1, clearcoatRoughness: .08 }));
plinth.position.y = -.6; scene.add(plinth);
const gold = new THREE.MeshStandardMaterial({ color: 0xd8b265, metalness: 1, roughness: .28, envMapIntensity: .9 });
const band = new THREE.Mesh(new THREE.TorusGeometry(1.92, .03, 12, 128), gold); band.rotation.x = Math.PI / 2; band.position.y = -.02; scene.add(band);

// ---------- crystal urn ----------
const urnProfile = [[0,0],[1.0,0],[1.02,.1],[.6,.22],[.42,.42],[.5,.6],[.95,.78],[1.32,1.12],[1.48,1.6],[1.42,2.08],[1.22,2.42],[1.15,2.6],[1.22,2.68]]
  .map(([r, y]) => new THREE.Vector2(r, y));
const glass = new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0, roughness: .04, transmission: 1, thickness: .35, ior: 1.5,
  envMapIntensity: 1.2, specularIntensity: 1, clearcoat: 1, clearcoatRoughness: .02, attenuationColor: new THREE.Color(0xdfeaff), attenuationDistance: 3 });
const urn = new THREE.Group(); scene.add(urn);
urn.add(new THREE.Mesh(new THREE.LatheGeometry(urnProfile, 128), glass));
const lip = new THREE.Mesh(new THREE.TorusGeometry(1.2, .035, 12, 128), gold); lip.rotation.x = Math.PI / 2; lip.position.y = 2.66; urn.add(lip);
const foot = new THREE.Mesh(new THREE.TorusGeometry(1.0, .03, 12, 128), gold); foot.rotation.x = Math.PI / 2; foot.position.y = .1; urn.add(foot);

// ---------- tokens ----------
const N = 64, tokenGeo = new THREE.CylinderGeometry(.3, .3, .045, 48);
const tokens = new THREE.InstancedMesh(tokenGeo, new THREE.MeshStandardMaterial({ color: 0xd9b46a, metalness: 1, roughness: .32, envMapIntensity: 1 }), N);
const seeds = Array.from({ length: N }, () => ({ th: Math.random() * 6.28, r: .25 + Math.random() * .7, y: .95 + Math.random() * 1.1,
  w: .6 + Math.random() * .9, ph: Math.random() * 6.28, tx: (Math.random() - .5) * 3, ty: (Math.random() - .5) * 3 }));
urn.add(tokens);
const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), v = new THREE.Vector3(), one = new THREE.Vector3(1, 1, 1);
function tokenTransform(i, phase, out) {
  const s = seeds[i], th = s.th + phase * s.w, lift = Math.sin(phase * 1.3 + s.ph);
  out.pos.set(Math.cos(th) * s.r, s.y + lift * .32 * P.stir, Math.sin(th) * s.r);
  e.set(s.tx + phase * s.w * 1.7, s.ty + phase * .9, s.ph); out.quat.setFromEuler(e);
}
const tmpT = { pos: new THREE.Vector3(), quat: new THREE.Quaternion() };

// the chosen token: its own mesh, engraved with the winner's name
function engrave(name) {
  const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
  const gr = g.createRadialGradient(220, 200, 20, 256, 256, 256); gr.addColorStop(0, '#fff0c4'); gr.addColorStop(.55, '#d7ae5e'); gr.addColorStop(1, '#8c6427');
  g.fillStyle = gr; g.fillRect(0, 0, 512, 512);
  g.strokeStyle = 'rgba(80,52,14,.8)'; g.lineWidth = 6; g.beginPath(); g.arc(256, 256, 226, 0, 6.29); g.stroke();
  for (let k = 0; k < 72; k++) { const a = k / 72 * 6.283; g.fillStyle = 'rgba(90,60,18,.75)'; g.beginPath(); g.arc(256 + Math.cos(a) * 240, 256 + Math.sin(a) * 240, 4, 0, 6.29); g.fill(); }
  // up to three lines, sized to fit inside the inner ring
  const words = name.split(/\s+/), lines = []; let cur = '';
  g.font = '600 60px "Cormorant Garamond", Georgia, serif';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (g.measureText(t).width > 330 && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); if (lines.length > 3) { lines.length = 3; lines[2] += '…'; }
  let fs = 60; while (fs > 26 && lines.some(l => (g.font = `600 ${fs}px "Cormorant Garamond", Georgia, serif`, g.measureText(l).width > 340))) fs -= 2;
  g.font = `600 ${fs}px "Cormorant Garamond", Georgia, serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  const lh = fs * 1.08, y0 = 256 - (lines.length - 1) * lh / 2;
  lines.forEach((l, k) => { g.fillStyle = 'rgba(255,246,220,.6)'; g.fillText(l, 256 + 2, y0 + k * lh + 3); g.fillStyle = '#2e1c05'; g.fillText(l, 256, y0 + k * lh); });
  const map = new THREE.CanvasTexture(c); map.colorSpace = THREE.SRGBColorSpace; map.center.set(.5, .5); map.rotation = Math.PI / 2;
  // emissive: only the engraved letters glow when it "flares"
  const c2 = document.createElement('canvas'); c2.width = c2.height = 512; const g2 = c2.getContext('2d'); g2.fillStyle = '#000'; g2.fillRect(0, 0, 512, 512);
  g2.font = g.font; g2.textAlign = 'center'; g2.textBaseline = 'middle'; g2.fillStyle = '#fff'; lines.forEach((l, k) => g2.fillText(l, 256, y0 + k * lh));
  const em = new THREE.CanvasTexture(c2); em.center.set(.5, .5); em.rotation = Math.PI / 2; return { map, em };
}
const faceMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: .85, roughness: .3, envMapIntensity: 1, emissive: 0xffd27a, emissiveIntensity: 0 });
const chosen = new THREE.Mesh(tokenGeo, [tokens.material, faceMat, tokens.material]); chosen.visible = false; scene.add(chosen);
const capPos = new THREE.Vector3(), capQuat = new THREE.Quaternion(), TOP = new THREE.Vector3(0, 3.9, .5);
const FACE = new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI / 2, 0, 0)); // top cap toward the audience
let captured = false;

// ---------- light ----------
const key = new THREE.SpotLight(0xfff1d6, 0, 0, .3, .7, 2); key.position.set(0, 12, 2); key.target.position.set(0, 3.6, 0); scene.add(key, key.target);
const fill = new THREE.DirectionalLight(0xbfd4ff, 1.4); fill.position.set(4, 6, 8); scene.add(fill);
const rim = new THREE.DirectionalLight(0x9fc0ff, 1.8); rim.position.set(-5, 4, -6); scene.add(rim);
const beam = new THREE.Mesh(new THREE.CylinderGeometry(.25, 1.6, 11, 48, 1, true), new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, uniforms: { k: { value: 0 } },
  vertexShader: `varying vec3 vN; varying vec3 vV; varying float vY; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); vY = uv.y; gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform float k; varying vec3 vN; varying vec3 vV; varying float vY;
    void main(){ float f = pow(abs(dot(vN, vV)), 2.); float a = k * .16 * f * smoothstep(0., .5, vY) * (1. - smoothstep(.92, 1., vY)); gl_FragColor = vec4(vec3(1., .9, .7) * a, a); }`
}));
beam.position.set(0, 3.0 + 5.5, .4); scene.add(beam);

// ---------- apply ----------
let phase = 0, idleT = 0;
function apply() {
  const still = LD.reduced ? 0 : 1;
  for (let i = 0; i < N; i++) {
    tokenTransform(i, phase, tmpT);
    const s = (i === 0 && P.rise > 0) ? 0 : 1; // token 0 becomes the chosen one
    m4.compose(tmpT.pos, tmpT.quat, v.setScalar(s)); tokens.setMatrixAt(i, m4);
  }
  tokens.instanceMatrix.needsUpdate = true;
  if (P.rise > 0) {
    if (!captured) { tokenTransform(0, phase, tmpT); urn.updateMatrixWorld(); capPos.copy(tmpT.pos).applyMatrix4(urn.matrixWorld); capQuat.copy(urn.quaternion).multiply(tmpT.quat); captured = true; }
    chosen.visible = true;
    chosen.position.lerpVectors(capPos, TOP, P.rise);
    chosen.position.y += Math.sin(idleT * 1.1) * .03 * P.face * still; // it hovers, gently
    chosen.quaternion.slerpQuaternions(capQuat, FACE, P.face); // face may overshoot slightly past 1, then settle
    chosen.scale.setScalar(1 + 1.8 * Math.min(1, P.rise));
  } else { chosen.visible = false; captured = false; }
  faceMat.emissiveIntensity = P.glow * 1.3;
  key.intensity = 900 * P.beam; beam.material.uniforms.k.value = P.beam;
  fill.intensity = 1.4 * P.amb; rim.intensity = .6 + 1.2 * P.amb;
  glass.envMapIntensity = .35 + .6 * P.amb; tokens.material.envMapIntensity = .2 + .4 * P.amb;
  wall.material.uniforms.amb.value = P.amb; wall.material.uniforms.beam.value = P.beam;
  camera.position.set(Math.sin(idleT * .12) * .3 * still, 3.3 + .2 * P.cam, 11.0 - .8 * P.cam);
  camera.lookAt(0, 2.85 + .15 * P.cam, 0);
}
function resize() {
  camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? 62 : 40; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); bloom.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize); resize();

let shown = false, chimeAcc = 0;
gsap.ticker.add((time, deltaMs) => {
  const dt = Math.min(deltaMs / 1000, .05); idleT += dt;
  if (!LD.reduced) { phase += P.stir * dt; urn.rotation.y += (.06 + .25 * P.stir) * dt * (1 - P.beam * .8); }
  // faint glassy clinks while the tokens tumble, more of them the harder they are stirred
  chimeAcc += dt * P.stir * 6; if (chimeAcc > 1 && P.stir > .4) { chimeAcc = 0; if (LD.snd.on) LD.snd.tone(2400 + Math.random() * 1800, .25, .006, 'sine'); }
  apply(); composer.render(dt);
  if (!shown) { shown = true; gsap.to('#loading', { autoAlpha: 0, duration: .8, onComplete: () => { document.getElementById('loading').hidden = true; } }); }
});
if (location.hash === '#debug') window.__ballot = { P, gsap, get tl() { return tl; }, render: () => { apply(); composer.render(0); } };

// ---------- reveal ----------
const winEl = document.getElementById('win'), nameEl = document.getElementById('winName'), ruleEl = document.getElementById('rule');
const lblEl = winEl.querySelector('.lbl'), prizeEl = winEl.querySelector('.prize');
let split = null, tl = null;

LD.stage({
  accent: '#e2c886', drawingHint: 'The ballot is being drawn…',
  draw(winner) {
    const { map, em } = engrave(winner); if (faceMat.map) { faceMat.map.dispose(); faceMat.emissiveMap.dispose(); }
    faceMat.map = map; faceMat.emissiveMap = em; faceMat.needsUpdate = true;
    if (split) { split.revert(); split = null; }
    nameEl.textContent = winner;
    gsap.set(winEl, { autoAlpha: 1 }); gsap.set([lblEl, prizeEl], { autoAlpha: 0 }); gsap.set(ruleEl, { scaleX: 0 });
    LD.fitText(nameEl, { max: Math.min(92, innerWidth * .066), min: 22 });
    split = new SplitText(nameEl, { type: 'words,chars', wordsClass: 'wd', charsClass: 'ch' });
    gsap.set(split.chars, { autoAlpha: 0, y: 26 });
    LD.snd.whoosh(1.6, .03);

    tl = gsap.timeline();
    // 0–3 s: the urn turns and the tokens tumble harder, then settle
    tl.to(P, { stir: 1, duration: 1.4, ease: 'sine.inOut' }, 0)
      .to(P, { stir: .15, duration: 1.6, ease: 'sine.inOut' }, 2.0)
      .to(P, { cam: 1, duration: 9, ease: 'sine.inOut' }, 0)
    // 3–6 s: the hall dims to a single beam; one token rises into it
      .to(P, { amb: .22, duration: 1.6, ease: 'sine.inOut' }, 2.8)
      .to(P, { beam: 1, duration: 1.4, ease: 'sine.inOut' }, 3.1)
      .add(() => { LD.snd.tone(110, 3.5, .03, 'sine'); LD.snd.tone(165, 3.5, .018, 'sine'); }, 3.1)
      // eases out of the urn from rest, rises just past its mark, then settles back onto it
      .to(P, { rise: 1.035, duration: 2.1, ease: 'sine.inOut' }, 3.6)
      .to(P, { rise: 1, duration: .7, ease: 'sine.inOut' }, 5.7)
    // 6–9 s: it turns to face the audience (slight overshoot, settle), the engraving flares, the name settles above
      .to(P, { face: 1.05, duration: 1.3, ease: 'sine.inOut' }, 5.0)
      .to(P, { face: 1, duration: .6, ease: 'sine.inOut' }, 6.3)
      .to(P, { glow: 1, duration: .5, ease: 'power2.out' }, 6.4)
      .to(P, { glow: .35, duration: 1.4, ease: 'sine.inOut' }, 7.0)
      .add(() => { [[523.25, 0], [783.99, .1], [1046.5, .22]].forEach(([f, d]) => setTimeout(() => LD.snd.tone(f, 3, .035, 'sine'), d * 1000)); }, 6.4)
      .to(lblEl, { autoAlpha: 1, duration: .8, ease: 'sine.out' }, 6.5)
      .to(split.chars, { autoAlpha: 1, y: 0, duration: .9, ease: 'back.out(1.6)', stagger: { amount: Math.min(1.0, .028 * split.chars.length) } }, 6.7)
      .to(ruleEl, { scaleX: 1, duration: 1.0, ease: 'power2.out' }, 7.6)
      .to(prizeEl, { autoAlpha: 1, duration: .8, ease: 'sine.out' }, 7.8);
    if (LD.reduced) tl.progress(1);
    return tl.then(() => {});
  },
  reset() {
    tl = gsap.timeline();
    tl.to(winEl, { autoAlpha: 0, duration: .6 }, 0)
      .to(P, { glow: 0, duration: .6, ease: 'sine.out' }, 0)
      .to(P, { rise: 0, face: 0, duration: 1.8, ease: 'sine.inOut' }, .3)
      .to(P, { beam: 0, duration: 1.4, ease: 'sine.inOut' }, 1.4)
      .to(P, { amb: 1, cam: 0, duration: 2.2, ease: 'sine.inOut' }, .8)
      .to(P, { stir: .25, duration: 1.6, ease: 'sine.inOut' }, 1.4)
      .add(() => { if (split) { split.revert(); split = null; } });
    if (LD.reduced) tl.progress(1);
    return tl.then(() => {});
  }
});
</script>
</body>
</html>
