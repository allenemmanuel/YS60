<!doctype html>
<html lang="en" data-design="scratch">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scratch Card · Lucky Draw</title>
<link rel="stylesheet" href="../vendor/fonts/scratch.css">
<link rel="stylesheet" href="ui.css">
<style>
/* Layout: a giant lottery ticket centred on a warm paper backdrop: stub on the left, gold foil panel on the right covering the name; title top-left, Draw docked bottom-centre */
:root { --bg: #efe4cc; --ink: #3a120c; --muted: #7d6046; --accent: #b3262b; --accent-2: #7d1418; --btn-ink: #fff6e6;
  --display: "DM Serif Display", Georgia, serif; --body: "DM Sans", "Segoe UI", system-ui, sans-serif; }
body { background: radial-gradient(90% 80% at 50% 45%, #fbf3e1 0%, #ead9b8 70%, #d9c39a 100%); }
body::before { content: ""; position: fixed; inset: 0; opacity: .35; pointer-events: none;
  background: repeating-linear-gradient(45deg, rgba(179,38,43,.05) 0 2px, transparent 2px 14px), repeating-linear-gradient(-45deg, rgba(179,38,43,.05) 0 2px, transparent 2px 14px); }
.ghost { background: rgba(255,255,255,.5); }
.ui.top h1 { font-family: "Abril Fatface", var(--display); font-weight: 400; }
#draw { font-family: "Abril Fatface", var(--display); font-weight: 400; color: #fff6e6; background: linear-gradient(180deg, #d6383d, var(--accent) 55%, var(--accent-2)); }

.ticket-wrap { position: fixed; inset: 0; display: grid; place-items: center; padding: 16vh 4vw 18vh; perspective: 1600px; }
.ticket { position: relative; width: min(1100px, 100%); aspect-ratio: 2.35; max-height: 100%; display: grid; grid-template-columns: 26% 1fr; border-radius: 22px;
  background: #fffaf0; box-shadow: 0 30px 60px rgba(80,40,10,.28), 0 2px 0 #fff inset; transform-origin: 50% 60%; }
.ticket::before { content: ""; position: absolute; inset: 10px; border: 2px dashed rgba(179,38,43,.35); border-radius: 14px; pointer-events: none; }
.stub { position: relative; border-right: 3px dotted rgba(179,38,43,.4); display: grid; align-content: center; justify-items: center; gap: 6%; padding: 8%; text-align: center; }
.stub .lucky { font: 400 clamp(18px, 3.2vw, 40px)/1 "Abril Fatface", var(--display); color: var(--accent); }
.stub .no { font: 700 clamp(10px, 1.1vw, 13px)/1 var(--body); letter-spacing: .3em; color: var(--muted); text-transform: uppercase; }
.stub .big { font: 400 clamp(36px, 6vw, 76px)/1 "Abril Fatface", var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }
.stub .seal { width: 34%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe9a6, #d9a93e 50%, #9c6c1a); box-shadow: 0 3px 8px rgba(0,0,0,.2); display: grid; place-items: center; color: #7a4e0e; font: 400 clamp(14px, 2vw, 26px)/1 "Abril Fatface", serif; }
.panel { position: relative; margin: 7% 6%; border-radius: 14px; overflow: hidden; background: #fffdf7; box-shadow: inset 0 2px 8px rgba(80,40,10,.12); }
.under { position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr; padding: 4% 6%; text-align: center; }
.under .lbl { font: 700 clamp(10px, 1.2vw, 14px)/1 var(--body); letter-spacing: .35em; text-transform: uppercase; color: var(--muted); padding-top: 3%; }
.under .fit { display: grid; place-items: center; min-height: 0; overflow: hidden; }
.under .name { font-family: var(--display); color: var(--ink); line-height: 1.05; overflow-wrap: normal; text-wrap: balance; }
#foil { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; transition: opacity .9s ease; }
#foil.gone { opacity: 0; pointer-events: none; }
.coin { position: fixed; z-index: 6; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%; pointer-events: none; opacity: 0;
  background: radial-gradient(circle at 35% 30%, #fff1c2, #e2b64f 45%, #9b6a1a 100%); box-shadow: 0 10px 18px rgba(60,30,0,.35), inset 0 0 0 5px rgba(255,240,190,.5);
  display: grid; place-items: center; font: 400 24px/1 "Abril Fatface", serif; color: #7a4e0e; transition: opacity .3s; }
</style>
</head>
<body>
<div class="ticket-wrap">
  <div class="ticket" id="ticket">
    <div class="stub" aria-hidden="true"><div class="lucky">Lucky Draw</div><div class="no">Ticket no.</div><div class="big" id="ticketNo">01</div><div class="seal">★</div></div>
    <div class="panel" id="panel">
      <div class="under"><div class="lbl" data-ld-prize>Winner</div><div class="fit"><div class="name" id="winName"></div></div></div>
      <canvas id="foil" aria-label="Scratch-off foil"></canvas>
    </div>
  </div>
</div>
<div class="coin" id="coin" aria-hidden="true">RM</div>
<div class="ui top"><div><h1 data-ld-prize>Lucky Draw</h1><p id="meta"></p></div><button id="soundBtn" class="ghost" type="button">Sound on</button></div>
<div class="ui bottom"><div class="controls"><button id="draw" type="button">Draw</button><button id="reset" class="ghost" type="button" hidden>New draw</button></div><p class="hint" id="hint"></p></div>
<div id="result" class="sr" role="status" aria-live="polite"></div>

<script src="../core.js"></script>
<script>
(() => {
const foil = document.getElementById('foil'), fg = foil.getContext('2d', { willReadFrequently: true });
const panel = document.getElementById('panel'), coin = document.getElementById('coin'), ticket = document.getElementById('ticket');
let FW, FH, dpr, armed = false, manual = false, lastPt = null;

function paintFoil() {
  dpr = Math.min(devicePixelRatio || 1, 2); FW = panel.clientWidth; FH = panel.clientHeight;
  foil.width = FW * dpr; foil.height = FH * dpr; fg.setTransform(dpr, 0, 0, dpr, 0, 0);
  fg.globalCompositeOperation = 'source-over';
  const gr = fg.createLinearGradient(0, 0, FW, FH);
  gr.addColorStop(0, '#b8892f'); gr.addColorStop(0.25, '#f3dc9a'); gr.addColorStop(0.45, '#c9a24c'); gr.addColorStop(0.7, '#f7e6b0'); gr.addColorStop(1, '#a87a26');
  fg.fillStyle = gr; fg.fillRect(0, 0, FW, FH);
  // fine brushed texture + sparkles
  for (let i = 0; i < FW * FH / 90; i++) { fg.fillStyle = `rgba(${Math.random() < .5 ? '255,250,230' : '90,60,10'},${Math.random() * 0.12})`; fg.fillRect(Math.random() * FW, Math.random() * FH, 1 + Math.random() * 3, 1); }
  fg.font = `400 ${Math.min(FH * 0.24, FW * 0.08)}px "Abril Fatface", Georgia, serif`; fg.textAlign = 'center'; fg.textBaseline = 'middle';
  fg.fillStyle = 'rgba(110,70,10,.45)'; fg.fillText('SCRATCH HERE', FW / 2 + 2, FH / 2 + 2);
  fg.fillStyle = 'rgba(255,248,220,.7)'; fg.fillText('SCRATCH HERE', FW / 2, FH / 2);
  fg.font = `700 ${Math.max(10, FH * 0.06)}px "DM Sans", sans-serif`; fg.fillStyle = 'rgba(110,70,10,.5)';
  for (let x = FW * 0.08; x < FW; x += FW * 0.16) { fg.fillText('★', x, FH * 0.14); fg.fillText('★', x + FW * 0.08, FH * 0.86); }
  foil.classList.remove('gone');
}
// scratching = erasing the foil with a thick, slightly rough stroke
function scratch(x0, y0, x1, y1, w) {
  fg.globalCompositeOperation = 'destination-out'; fg.lineCap = 'round'; fg.lineJoin = 'round';
  fg.lineWidth = w; fg.beginPath(); fg.moveTo(x0, y0); fg.lineTo(x1, y1); fg.stroke();
  for (let i = 0; i < 3; i++) { fg.lineWidth = w * (0.3 + Math.random() * 0.3); fg.beginPath(); const o = (Math.random() - 0.5) * w * 0.9; fg.moveTo(x0, y0 + o); fg.lineTo(x1, y1 + o); fg.stroke(); }
  const now = performance.now(); if (now - (scratch.t || 0) > 45) { scratch.t = now; LD.snd.noise(0.07, 0.035, { type: 'bandpass', freq: 3200 + Math.random() * 1500, q: 1.5 }); }
}
function cleared() {
  const d = fg.getImageData(0, 0, foil.width, foil.height).data; let clear = 0, n = 0;
  for (let i = 3; i < d.length; i += 4 * 97) { n++; if (d[i] < 40) clear++; }
  return clear / n;
}
// manual scratching (mouse, pen or touch) once a winner is under the foil
const local = e => { const r = foil.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
foil.addEventListener('pointerdown', e => { if (!armed) return; manual = true; foil.setPointerCapture(e.pointerId); lastPt = local(e); });
foil.addEventListener('pointermove', e => { if (!armed || !lastPt) return; const p = local(e); scratch(lastPt[0], lastPt[1], p[0], p[1], Math.max(34, FH * 0.16)); lastPt = p; });
foil.addEventListener('pointerup', () => { lastPt = null; });

// auto-scratch: the coin sweeps a zig-zag across the panel
async function autoScratch() {
  const r = foil.getBoundingClientRect(), w = Math.max(40, FH * 0.2), rows = Math.ceil(FH / (w * 0.75)) + 1;
  const pts = [];
  for (let i = 0; i < rows; i++) { const y = (i + 0.5) * FH / rows; pts.push(i % 2 ? [FW + 10, y] : [-10, y], i % 2 ? [-10, y + FH / rows * 0.5] : [FW + 10, y + FH / rows * 0.5]); }
  coin.style.opacity = 1;
  let prev = pts[0];
  for (let i = 1; i < pts.length && armed; i++) {
    const a = prev, b = pts[i], dur = 520 * Math.hypot(b[0] - a[0], b[1] - a[1]) / FW + 60;
    let lx = a[0], ly = a[1];
    await LD.tween(dur, e => {
      const x = a[0] + (b[0] - a[0]) * e, y = a[1] + (b[1] - a[1]) * e + Math.sin(e * Math.PI * 6) * w * 0.12;
      scratch(lx, ly, x, y, w); lx = x; ly = y;
      coin.style.transform = `translate(${r.left + x}px, ${r.top + y}px) rotate(${x * 0.6}deg)`;
    }, LD.ease.inOutSine);
    prev = b;
    if (cleared() > 0.8) break;
  }
  coin.style.opacity = 0;
}

let ticketNo = LD.load().log.length + 1;
const setNo = () => { document.getElementById('ticketNo').textContent = String(ticketNo).padStart(2, '0'); };
LD.stage({
  accent: '#b3262b',
  async draw(winner) {
    const nameEl = document.getElementById('winName');
    nameEl.textContent = winner; LD.fitText(nameEl, { max: Math.min(110, FH * 0.42), min: 16 });
    // the ticket lifts toward the audience
    LD.snd.whoosh(0.7, 0.05);
    await ticket.animate([{ transform: 'none' }, { transform: 'translateY(-1.5%) rotateX(6deg) scale(1.02)' }], { duration: 650, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' }).finished;
    armed = true; manual = false;
    document.getElementById('hint').textContent = 'Scratch the gold panel, or wait for the coin';
    // host may scratch by hand; if they don't start within 2.5 s, the coin does it
    const t0 = performance.now();
    while (!manual && performance.now() - t0 < (LD.reduced ? 0 : 2500)) await LD.sleep(100);
    if (!manual) await autoScratch();
    else while (cleared() < 0.55) await LD.sleep(250);
    armed = false;
    foil.classList.add('gone');
    nameEl.animate([{ transform: 'scale(.92)', filter: 'blur(2px)' }, { transform: 'scale(1.05)', filter: 'none', offset: .6 }, { transform: 'none' }], { duration: 800, easing: 'cubic-bezier(.2,.8,.2,1)' });
    LD.snd.chime(); LD.confetti({ colors: ['#b3262b', '#e2b64f', '#fff6e6', '#3a120c'] });
  },
  async reset() {
    await ticket.animate([{ transform: 'translateY(-1.5%) rotateX(6deg) scale(1.02)' }, { transform: 'translateX(-120%) rotate(-8deg)' }], { duration: 600, easing: 'cubic-bezier(.5,0,.75,0)', fill: 'forwards' }).finished;
    document.getElementById('winName').textContent = ''; paintFoil(); ticketNo = LD.load().log.length + 1; setNo();
    await ticket.animate([{ transform: 'translateX(120%) rotate(8deg)' }, { transform: 'none' }], { duration: 750, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' }).finished;
    ticket.getAnimations().forEach(a => a.cancel());
  }
});
addEventListener('resize', () => { if (!armed && !document.getElementById('winName').textContent) paintFoil(); });
setNo(); paintFoil();
if (document.fonts) document.fonts.ready.then(() => { if (!armed && !document.getElementById('winName').textContent) paintFoil(); });
})();
</script>
</body>
</html>
