/* Layout: full-bleed WebGL stage, title floating top-centre, controls docked bottom-centre, names drawer slides in from the right */
:root {
  --stage: #07060a;
  --gold: #e8c26a;

  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--stage); color: var(--ink); font-family: var(--body); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.ui { position: fixed; left: 0; right: 0; pointer-events: none; display: flex; flex-direction: column; align-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { top: 0; padding-block: calc(18px + env(safe-area-inset-top, 0px)) 0; gap: 4px; text-align: center; }
.top h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(26px, 5vw, 44px); letter-spacing: 0.14em;
  background: linear-gradient(180deg, #fff3cf 0%, var(--gold) 45%, var(--gold-deep) 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  text-wrap: balance; }
.top p { margin: 0; font-size: 12px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
.bottom { bottom: 0; padding-block: 0 calc(22px + env(safe-area-inset-bottom, 0px)); gap: 14px; }
.controls { display: flex; gap: 12px; pointer-events: auto; flex-wrap: wrap; justify-content: center; }
button { font-family: var(--display); font-weight: 700; letter-spacing: 0.2em; cursor: pointer; border-radius: 999px; transition: transform .15s, box-shadow .2s, opacity .2s; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
#spin { font-size: 18px; padding: 16px 46px; border: 1px solid #fff0c4; color: #2a1a05;
  background: radial-gradient(120% 140% at 50% 0%, #fff1c2 0%, var(--gold) 40%, var(--gold-deep) 100%);
  box-shadow: 0 0 0 4px rgba(232,194,106,.12), 0 8px 20px rgba(0,0,0,.45), inset 0 -3px 6px rgba(80,40,0,.35); }
#spin:hover:not(:disabled) { transform: translateY(-2px) scale(1.03); }
#spin:disabled { opacity: .45; cursor: default; animation: none; }
.ghost { font-size: 13px; padding: 14px 26px; color: var(--gold); background: var(--panel); border: 1px solid var(--line); }
.ghost:hover { transform: translateY(-1px); }
.hint { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; margin: 0; text-align: center; }

/* the winner is shown on the 3D card that rises out of the capsule; this banner stays only for screen readers */
#result { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }

/* names drawer */
#namesBtn { position: fixed; z-index: 5; top: calc(18px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  font-size: 11px; padding: 10px 16px; }
#drawer { position: fixed; z-index: 6; top: 0; right: 0; bottom: 0; width: min(380px, 100%); background: rgba(12, 9, 6, .94);
  border-left: 1px solid var(--line); backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 14px;
  padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: 22px; padding-right: max(22px, env(safe-area-inset-right, 0px));
  transform: translateX(105%); transition: transform .35s cubic-bezier(.2,.8,.2,1); }
#drawer.open { transform: none; }
#drawer header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
#drawer h2 { margin: 0; font-family: var(--display); font-size: 18px; letter-spacing: .16em; color: var(--gold); }
#closeDrawer { font-size: 11px; padding: 8px 14px; }
#drawer label.cap { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
#names { flex: 1; min-height: 160px; resize: none; background: rgba(255,255,255,.04); color: var(--ink); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px; font: 14px/1.55 var(--body); }
.row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink); }
.row input { accent-color: var(--gold); width: 18px; height: 18px; }
.winners { font-size: 13px; color: var(--muted); max-height: 28vh; overflow-y: auto; }
.winners h3 { margin: 0 0 6px; font-family: var(--display); font-size: 12px; letter-spacing: .2em; color: var(--gold); font-weight: 500; }
.winners ol { margin: 0; padding-left: 22px; display: grid; gap: 4px; color: var(--ink); overflow-wrap: anywhere; }
.drawer-actions { display: flex; gap: 10px; flex-wrap: wrap; }
#saveNames { font-size: 13px; padding: 12px 22px; color: #2a1a05; border: 1px solid #fff0c4; background: linear-gradient(180deg, #fff1c2, var(--gold) 60%, var(--gold-deep)); }
#clearWinners { font-size: 11px; padding: 10px 16px; }

#loading { position: fixed; inset: 0; display: grid; place-items: center; font-family: var(--display); letter-spacing: .3em; color: var(--muted); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { #spin { animation: none; } #drawer { transition: none; } }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

document.fonts && document.fonts.load('700 80px "Playfair Display"').catch(() => {}); document.fonts && document.fonts.load('600 38px Cinzel').catch(() => {});
const stageEl = document.getElementById('stage');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;

stageEl.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07060a);
scene.fog = new THREE.FogExp2(0x07060a, 0.055);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
scene.environmentIntensity = 0.45; // softer reflections, less glare on the gold

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
const HOME_POS = new THREE.Vector3(5.2, 3.6, 7.4);
const HOME_TARGET = new THREE.Vector3(0, 1.9, 0.3);
camera.position.copy(HOME_POS);
function fitCamera() {
  const portrait = innerWidth / innerHeight < 0.8;
  camera.fov = portrait ? 52 : 38;
  camera.updateProjectionMatrix();
}
fitCamera();

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME_TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 1.8; // must stay below the close-up shot's distance (~2.4) or OrbitControls snaps the camera back out
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.47;
controls.enablePan = false;
controls.autoRotate = !reduced;
controls.autoRotateSpeed = 0.45;

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0x3a2f22, 0x050408, 0.5));
const key = new THREE.SpotLight(0xffd59a, 85, 20, Math.PI * 0.16, 0.55, 1.6);
key.position.set(1.5, 9, 3);
key.target.position.set(0, 1.5, 0.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0004;
key.shadow.radius = 6;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0x8fb4ff, 0.9);
rim.position.set(-4, 4, -6);
scene.add(rim);
const fill = new THREE.PointLight(0xff9a4a, 8, 12, 1.8);
fill.position.set(-3.5, 1.5, 3);
scene.add(fill);

// ---------- floor (matte, no mirror reflection) ----------
const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 64),
  new THREE.MeshStandardMaterial({ color: 0x0a080b, roughness: 0.9, metalness: 0 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = 0.002; floor.receiveShadow = true;
scene.add(floor);
// soft spotlight pool on the floor
const poolTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'); const gr = g.createRadialGradient(128,128,0,128,128,128);
  gr.addColorStop(0,'rgba(255,205,130,0.22)'); gr.addColorStop(0.5,'rgba(255,180,90,0.06)'); gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0,0,256,256); return new THREE.CanvasTexture(c);
})();
const pool = new THREE.Mesh(new THREE.PlaneGeometry(9, 9), new THREE.MeshBasicMaterial({ map: poolTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
pool.rotation.x = -Math.PI / 2; pool.position.set(0, 0.004, 0.6);
scene.add(pool);

// ---------- materials ----------
// satin finishes throughout: highlights are broad and soft instead of sharp glints
const gold = new THREE.MeshStandardMaterial({ color: 0xe6bc68, metalness: 0.9, roughness: 0.42, envMapIntensity: 0.8 });
const goldDark = new THREE.MeshStandardMaterial({ color: 0xb3842f, metalness: 0.9, roughness: 0.5 });
const lacquer = new THREE.MeshStandardMaterial({ color: 0x12080a, metalness: 0, roughness: 0.85, envMapIntensity: 0.2 });
const acrylic = new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0, roughness: 0.3, transparent: true, opacity: 0.05,
  side: THREE.DoubleSide, depthWrite: false, envMapIntensity: 0.4 });

function shadowy(m) { m.castShadow = true; m.receiveShadow = true; return m; }
function rod(a, b, r, mat) {
  const dir = new THREE.Vector3().subVectors(b, a); const len = dir.length();
  const m = shadowy(new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 16), mat));
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return m;
}

// ---------- drum ----------
const DRUM_Y = 2.25, R = 1.15, HALF = 0.9, BALL_R = 0.16, NBALLS = 30;
const drumRoot = new THREE.Group(); drumRoot.position.y = DRUM_Y; scene.add(drumRoot);
const drum = new THREE.Group(); drumRoot.add(drum); // rotates about X

const BARS = 18;
for (let i = 0; i < BARS; i++) {
  const a = (i / BARS) * Math.PI * 2;
  const y = Math.cos(a) * R, z = Math.sin(a) * R;
  drum.add(rod(new THREE.Vector3(-HALF, y, z), new THREE.Vector3(HALF, y, z), 0.022, gold));
}
for (const x of [-HALF, HALF]) {
  const ring = shadowy(new THREE.Mesh(new THREE.TorusGeometry(R, 0.06, 20, 120), gold));
  ring.rotation.y = Math.PI / 2; ring.position.x = x; drum.add(ring);
  const inner = shadowy(new THREE.Mesh(new THREE.TorusGeometry(R * 0.45, 0.03, 12, 80), gold));
  inner.rotation.y = Math.PI / 2; inner.position.x = x; drum.add(inner);
  for (let s = 0; s < 8; s++) {
    const a = (s / 8) * Math.PI * 2;
    drum.add(rod(new THREE.Vector3(x, 0, 0), new THREE.Vector3(x, Math.cos(a) * R, Math.sin(a) * R), 0.026, gold));
  }
  const hub = shadowy(new THREE.Mesh(new THREE.SphereGeometry(0.13, 24, 16), gold)); hub.position.x = x; drum.add(hub);
}
for (const x of [-HALF * 0.33, HALF * 0.33]) {
  const r = shadowy(new THREE.Mesh(new THREE.TorusGeometry(R, 0.022, 12, 120), gold));
  r.rotation.y = Math.PI / 2; r.position.x = x; drum.add(r);
}
const shell = new THREE.Mesh(new THREE.CylinderGeometry(R - 0.03, R - 0.03, HALF * 2, 72, 1, true), acrylic);
shell.rotation.z = Math.PI / 2; shell.renderOrder = 2; drum.add(shell);

// crank (rotates with drum)
const crank = new THREE.Group(); crank.position.x = HALF + 0.62; drum.add(crank);
crank.add(rod(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0.55, 0), 0.035, gold));
crank.add(rod(new THREE.Vector3(0, 0.55, 0), new THREE.Vector3(0.28, 0.55, 0), 0.03, gold));
const knob = shadowy(new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 0.16, 6, 16), lacquer));
knob.rotation.z = Math.PI / 2; knob.position.set(0.3, 0.55, 0); crank.add(knob);
const crankHub = shadowy(new THREE.Mesh(new THREE.SphereGeometry(0.08, 20, 14), gold)); crank.add(crankHub);

// axle + stand (static)
drumRoot.add(rod(new THREE.Vector3(-HALF - 0.62, 0, 0), new THREE.Vector3(HALF + 0.62, 0, 0), 0.045, goldDark));
for (const sx of [-1, 1]) {
  const x = sx * (HALF + 0.38);
  const top = new THREE.Vector3(x, DRUM_Y, 0);
  scene.add(rod(top, new THREE.Vector3(x, 0.22, 0.95), 0.05, gold));
  scene.add(rod(top, new THREE.Vector3(x, 0.22, -0.95), 0.05, gold));
  scene.add(rod(new THREE.Vector3(x, 0.9, 0.67), new THREE.Vector3(x, 0.9, -0.67), 0.03, gold));
  const bearing = shadowy(new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.12, 24), goldDark));
  bearing.rotation.z = Math.PI / 2; bearing.position.copy(top); scene.add(bearing);
  for (const z of [0.95, -0.95]) {
    const foot = shadowy(new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.15, 0.22, 24), gold)); foot.position.set(x, 0.11, z); scene.add(foot);
  }
}
// plinth
const plinth = shadowy(new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.08, 2.6), lacquer)); plinth.position.y = 0.04; scene.add(plinth);
const plinthTrim = shadowy(new THREE.Mesh(new THREE.BoxGeometry(3.66, 0.02, 2.66), gold)); plinthTrim.position.y = 0.068; // thin gold band around the edge, below the plinth top scene.add(plinthTrim);

// chute: gold trough sloping from the drum to the tray
const CHUTE_A = new THREE.Vector3(0, DRUM_Y - R - 0.05, R * 0.55);
const TRAY_P = new THREE.Vector3(0, 0.62, 2.35);
const CHUTE_B = new THREE.Vector3(0, 0.95, 1.95);
const chuteCurve = new THREE.CatmullRomCurve3([CHUTE_A, new THREE.Vector3(0, DRUM_Y - R - 0.12, R * 0.95), new THREE.Vector3(0, 1.25, 1.6), CHUTE_B]);
const chute = shadowy(new THREE.Mesh(new THREE.TubeGeometry(chuteCurve, 48, 0.17, 20, false),
  new THREE.MeshStandardMaterial({ color: 0xe6bc68, metalness: 0.9, roughness: 0.45, side: THREE.DoubleSide, transparent: true, opacity: 0.55, envMapIntensity: 0.6 })));
scene.add(chute);
for (const sx of [-1, 1]) scene.add(rod(new THREE.Vector3(sx * 0.17, 1.25, 1.6), new THREE.Vector3(sx * 0.17, 0.09, 1.6), 0.02, gold));

// velvet tray on a pedestal
const tray = new THREE.Group(); tray.position.copy(TRAY_P).setY(0); scene.add(tray);
tray.add(shadowy(new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.18, 0.5, 24), gold)));
tray.children[0].position.y = 0.3;
const dish = shadowy(new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.34, 0.08, 48), gold)); dish.position.y = 0.56; tray.add(dish);
const velvet = shadowy(new THREE.Mesh(new THREE.CylinderGeometry(0.37, 0.37, 0.02, 48),
  new THREE.MeshPhysicalMaterial({ color: 0x7a0b18, roughness: 0.95, sheen: 1, sheenColor: new THREE.Color(0xff5a6a), sheenRoughness: 0.4 })));
velvet.position.y = 0.6; tray.add(velvet);

// ---------- capsules (two-part gacha capsules, each holding a rolled name slip) ----------
const PALETTE = [0xd21f2c, 0xf2b630, 0x1f5fd1, 0x1c9a57, 0x7d3cc8, 0xf4f1ea];
const clearTop = new THREE.MeshPhysicalMaterial({ color: 0xfff4e0, metalness: 0, roughness: 0.35, transparent: true, opacity: 0.32,
  side: THREE.DoubleSide, depthWrite: false, envMapIntensity: 0.5 });
const slipMat = new THREE.MeshStandardMaterial({ color: 0xf3e6c4, roughness: 0.8 });
const topGeo = new THREE.SphereGeometry(BALL_R, 36, 18, 0, Math.PI * 2, 0, Math.PI / 2);
const botGeo = new THREE.SphereGeometry(BALL_R, 36, 18, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2);
const bandGeo = new THREE.TorusGeometry(BALL_R * 0.985, 0.012, 8, 48);
const slipGeo = new THREE.CylinderGeometry(0.035, 0.035, BALL_R * 1.3, 12);
function makeCapsule(i) {
  const g = new THREE.Group();
  const bot = shadowy(new THREE.Mesh(botGeo, new THREE.MeshPhysicalMaterial({ color: PALETTE[i % PALETTE.length], roughness: 0.45, clearcoat: 0.15, clearcoatRoughness: 0.5 })));
  g.add(bot);
  const band = new THREE.Mesh(bandGeo, gold); band.rotation.x = Math.PI / 2; g.add(band);
  const slip = new THREE.Mesh(slipGeo, slipMat); slip.rotation.z = Math.PI / 2; slip.position.y = -0.02; g.add(slip);
  // the lid hinges at its back edge so it can flip open on the tray
  const hinge = new THREE.Group(); hinge.position.z = -BALL_R; g.add(hinge);
  const lid = new THREE.Mesh(topGeo, clearTop.clone()); lid.position.z = BALL_R; lid.renderOrder = 3; hinge.add(lid);
  g.userData = { hinge, lid, slip };
  return g;
}
const balls = [];
for (let i = 0; i < NBALLS; i++) {
  const mesh = makeCapsule(i);
  drumRoot.add(mesh);
  const b = { n: i + 1, mesh, p: new THREE.Vector3(), v: new THREE.Vector3(), w: new THREE.Vector3(), active: true };
  placeInside(b, i);
  mesh.quaternion.setFromEuler(new THREE.Euler(Math.random() * 6, Math.random() * 6, Math.random() * 6));
  balls.push(b);
}
function placeInside(b, i) {
  const cols = 6, row = Math.floor(i / cols), col = i % cols;
  b.p.set(-HALF + 0.2 + col * ((HALF * 2 - 0.4) / (cols - 1)), -R + 0.2 + row * 0.34, (Math.random() - 0.5) * 0.8);
  b.v.set(0, 0, 0); b.w.set(0, 0, 0); b.mesh.position.copy(b.p);
}
function closeCapsule(m) { m.userData.hinge.rotation.x = 0; m.userData.lid.material.opacity = 0.32; m.userData.slip.visible = true; }

// ---------- winner card (name printed on a gold-edged card; text auto-fits any length) ----------
const CARD_W = 1.5, CARD_H = 0.62, CW = 1536, CH = Math.round(CW * CARD_H / CARD_W);
const cardCanvas = document.createElement('canvas'); cardCanvas.width = CW; cardCanvas.height = CH;
const cardTex = new THREE.CanvasTexture(cardCanvas); cardTex.colorSpace = THREE.SRGBColorSpace; cardTex.anisotropy = 8;
const card = new THREE.Mesh(new THREE.PlaneGeometry(CARD_W, CARD_H),
  // unlit, so the card shows its own colours with no shine or glare from the stage lights
  new THREE.MeshBasicMaterial({ map: cardTex, transparent: true, alphaTest: 0.5, side: THREE.DoubleSide, toneMapped: false, fog: false }));
card.castShadow = true; card.visible = false; scene.add(card);

function wrapLines(ctx, text, maxW) {
  const words = text.split(/\s+/).filter(Boolean), lines = [];
  let line = '';
  const pushWord = w => { // break a single word that is wider than the card
    while (ctx.measureText(w).width > maxW) {
      let k = w.length; while (k > 1 && ctx.measureText(w.slice(0, k) + '-').width > maxW) k--;
      lines.push(w.slice(0, k) + '-'); w = w.slice(k);
    }
    return w;
  };
  for (let w of words) {
    const tryLine = line ? line + ' ' + w : w;
    if (ctx.measureText(tryLine).width <= maxW) { line = tryLine; continue; }
    if (line) lines.push(line);
    line = pushWord(w);
  }
  if (line) lines.push(line);
  return lines;
}
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function drawCard(name) {
  const g = cardCanvas.getContext('2d');
  g.clearRect(0, 0, CW, CH);
  // same look as the winner banner: dark panel, thin gold line, small muted label, gold serif name
  roundRect(g, 6, 6, CW - 12, CH - 12, 72); g.fillStyle = 'rgba(16,12,8,0.94)'; g.fill();
  g.lineWidth = 4; g.strokeStyle = 'rgba(232,194,106,0.5)'; g.stroke();
  g.fillStyle = '#b3a68a'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '600 32px Manrope, "Segoe UI", system-ui, sans-serif';
  try { g.letterSpacing = '10px'; } catch (e) {}
  g.fillText('AND THE WINNER IS', CW / 2 + 5, 100);
  try { g.letterSpacing = '0px'; } catch (e) {}
  // auto-fit: largest size where the wrapped name fits in the text box
  const boxW = CW - 180, boxTop = 150, boxH = CH - 150 - 60;
  let size = 150, lines;
  for (; size >= 34; size -= 4) {
    g.font = `700 ${size}px "Playfair Display", Georgia, serif`;
    lines = wrapLines(g, name, boxW);
    if (lines.length * size * 1.15 <= boxH) break;
  }
  g.fillStyle = '#e8c26a';
  const lh = size * 1.15, y0 = boxTop + boxH / 2 - (lines.length - 1) * lh / 2;
  lines.forEach((l, i) => g.fillText(l, CW / 2, y0 + i * lh));
  cardTex.needsUpdate = true;
}

// ---------- names ----------
const LS = LD.load();
let names = LS.names, winners = LS.winners, removeWinners = LS.removeWinners, soundOn = LS.soundOn, musicOn = LS.musicOn;
const persist = () => LD.save({ names, winners, removeWinners, soundOn, musicOn });
const drawPool = () => removeWinners ? names.filter(n => !winners.includes(n)) : names.slice();

const drawerEl = document.getElementById('drawer'), namesBtn = document.getElementById('namesBtn'), namesEl = document.getElementById('names');
const removeEl = document.getElementById('removeWinners'), countEl = document.getElementById('count');
const winnersBox = document.getElementById('winnersBox'), winnersList = document.getElementById('winnersList');
function renderNamesUI() {
  const p = drawPool().length;
  countEl.textContent = p === 1 ? '1 name in the draw' : `${p} names in the draw`;
  namesBtn.textContent = `NAMES · ${names.length}`;
  winnersBox.hidden = winners.length === 0;
  winnersList.replaceChildren(...winners.map(w => Object.assign(document.createElement('li'), { textContent: w })));
  removeEl.checked = removeWinners;
  if (state === 'idle') {
    spinBtn.disabled = p === 0;
    hintEl.textContent = p === 0 ? 'Add names to start the draw' : 'Drag to orbit · scroll or pinch to zoom';
  }
}
function openDrawer(open) {
  drawerEl.classList.toggle('open', open); namesBtn.setAttribute('aria-expanded', String(open));
  if (open) { namesEl.value = names.join('\n'); namesEl.focus(); }
}
namesBtn.addEventListener('click', () => openDrawer(!drawerEl.classList.contains('open')));
document.getElementById('closeDrawer').addEventListener('click', () => openDrawer(false));
document.getElementById('saveNames').addEventListener('click', () => {
  names = [...new Set(namesEl.value.split('\n').map(s => s.replace(/\s+/g, ' ').trim()).filter(Boolean))];
  persist(); renderNamesUI(); openDrawer(false);
});
document.getElementById('clearWinners').addEventListener('click', () => { winners = []; persist(); renderNamesUI(); });
removeEl.addEventListener('change', () => { removeWinners = removeEl.checked; persist(); renderNamesUI(); });
addEventListener('keydown', e => { if (e.key === 'Escape') openDrawer(false); });

// ---------- background bokeh ----------
const bokehTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  const gr = g.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.55,'rgba(255,255,255,.55)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0,0,64,64); return new THREE.CanvasTexture(c);
})();
const bokeh = new THREE.Group(); scene.add(bokeh);
for (let i = 0; i < 70; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: bokehTex, color: new THREE.Color().setHSL(0.08 + Math.random() * 0.06, 0.8, 0.55 + Math.random() * 0.2),
    transparent: true, opacity: 0.12 + Math.random() * 0.15, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
  const a = Math.random() * Math.PI * 2, r = 13 + Math.random() * 8;
  s.position.set(Math.cos(a) * r, 1 + Math.random() * 7, Math.sin(a) * r);
  const k = 0.3 + Math.random() * 1.1; s.scale.set(k, k, k); s.userData.ph = Math.random() * 6; bokeh.add(s);
}
// drifting sparkles near the drum
const sparkGeo = new THREE.BufferGeometry(); const SP = 160; const sp = new Float32Array(SP * 3); const spSeed = new Float32Array(SP);
for (let i = 0; i < SP; i++) { sp[i*3] = (Math.random()-.5)*6; sp[i*3+1] = Math.random()*5; sp[i*3+2] = (Math.random()-.5)*5; spSeed[i] = Math.random(); }
sparkGeo.setAttribute('position', new THREE.BufferAttribute(sp, 3));
const sparks = new THREE.Points(sparkGeo, new THREE.PointsMaterial({ map: bokehTex, size: 0.07, color: 0xffd98a, transparent: true, opacity: 0.35, depthWrite: false, blending: THREE.AdditiveBlending }));
scene.add(sparks);

// ---------- confetti ----------
const CONF = 420;
const confetti = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.06, 0.1),
  new THREE.MeshStandardMaterial({ metalness: 0.2, roughness: 0.75, side: THREE.DoubleSide, envMapIntensity: 0.5 }), CONF);
confetti.instanceMatrix.setUsage(THREE.DynamicDrawUsage); confetti.visible = false; scene.add(confetti);
const confCols = [0xf2c14e, 0xffe39a, 0xd21f2c, 0xfff4dc, 0xc98a2b];
const conf = [];
for (let i = 0; i < CONF; i++) { confetti.setColorAt(i, new THREE.Color(confCols[i % confCols.length])); conf.push({ p: new THREE.Vector3(), v: new THREE.Vector3(), r: new THREE.Euler(), rv: new THREE.Vector3() }); }
function burst(at) {
  confetti.visible = true;
  for (const c of conf) {
    c.p.copy(at).add(new THREE.Vector3((Math.random()-.5)*.3, .1, (Math.random()-.5)*.3));
    const a = Math.random() * Math.PI * 2, s = 1.5 + Math.random() * 3.2;
    c.v.set(Math.cos(a) * s * .55, 3.2 + Math.random() * 3.5, Math.sin(a) * s * .55);
    c.r.set(Math.random()*6, Math.random()*6, Math.random()*6); c.rv.set((Math.random()-.5)*14, (Math.random()-.5)*14, (Math.random()-.5)*14);
  }
}
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(1,1,1);
function updateConfetti(dt) {
  if (!confetti.visible) return;
  conf.forEach((c, i) => {
    c.v.y -= 6.5 * dt; c.v.multiplyScalar(1 - 1.6 * dt);
    c.v.x += Math.sin(c.r.y * 2) * 0.6 * dt; // flutter
    c.p.addScaledVector(c.v, dt);
    if (c.p.y < 0.01) { c.p.y = 0.01; c.v.set(0, 0, 0); c.rv.set(0, 0, 0); c.r.x = -Math.PI / 2; }
    c.r.x += c.rv.x * dt; c.r.y += c.rv.y * dt; c.r.z += c.rv.z * dt;
    _q.setFromEuler(c.r); _m.compose(c.p, _q, _s); confetti.setMatrixAt(i, _m);
  });
  confetti.instanceMatrix.needsUpdate = true;
}

// ---------- post-processing ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
// no bloom pass: it made bright highlights glow and smear
composer.addPass(new OutputPass());

// ---------- physics (balls inside the rotating cage, drum-root space) ----------
let omega = 0.45, angle = 0;
const G = 9.8, WALL = R - 0.06 - BALL_R, END = HALF - 0.07 - BALL_R;
const tmp = new THREE.Vector3(), n = new THREE.Vector3(), wallV = new THREE.Vector3(), rel = new THREE.Vector3();
function physics(dt) {
  const act = balls.filter(b => b.active);
  for (const b of act) { b.v.y -= G * dt; b.v.multiplyScalar(1 - 0.08 * dt); b.p.addScaledVector(b.v, dt); }
  for (const b of act) {
    const ry = b.p.y, rz = b.p.z, rr = Math.hypot(ry, rz);
    if (rr > WALL) {
      n.set(0, ry / rr, rz / rr);
      b.p.y = n.y * WALL; b.p.z = n.z * WALL;
      const vn = b.v.dot(n);
      if (vn > 0) b.v.addScaledVector(n, -(1 + 0.45) * vn);
      // bars drag the ball along with the drum surface
      wallV.set(0, -omega * b.p.z, omega * b.p.y);
      rel.copy(wallV).sub(b.v); rel.addScaledVector(n, -rel.dot(n));
      b.v.addScaledVector(rel, Math.min(1, 9 * dt));
      // rolling spin
      tmp.crossVectors(n, b.v).multiplyScalar(-1 / BALL_R); b.w.lerp(tmp, Math.min(1, 10 * dt));
    }
    if (b.p.x > END) { b.p.x = END; if (b.v.x > 0) b.v.x *= -0.5; }
    if (b.p.x < -END) { b.p.x = -END; if (b.v.x < 0) b.v.x *= -0.5; }
  }
  const D = BALL_R * 2;
  for (let i = 0; i < act.length; i++) for (let j = i + 1; j < act.length; j++) {
    const a = act[i], b = act[j];
    tmp.subVectors(b.p, a.p); const d2 = tmp.lengthSq();
    if (d2 < D * D && d2 > 1e-8) {
      const d = Math.sqrt(d2); tmp.multiplyScalar(1 / d);
      const pen = (D - d) * 0.5; a.p.addScaledVector(tmp, -pen); b.p.addScaledVector(tmp, pen);
      const vrel = tmp.dot(rel.subVectors(b.v, a.v));
      if (vrel < 0) { const imp = -(1 + 0.6) * vrel * 0.5; a.v.addScaledVector(tmp, -imp); b.v.addScaledVector(tmp, imp); }
    }
  }
  for (const b of act) {
    b.mesh.position.copy(b.p);
    const wl = b.w.length();
    if (wl > 1e-4) { _q.setFromAxisAngle(tmp.copy(b.w).multiplyScalar(1 / wl), wl * dt); b.mesh.quaternion.premultiply(_q); }
  }
}

// ---------- state machine ----------
const spinBtn = document.getElementById('spin'), resetBtn = document.getElementById('reset');
const resultEl = document.getElementById('result'), winNameEl = document.getElementById('winName'), hintEl = document.getElementById('hint');
let state = 'idle', t = 0, winner = null, winnerName = '', camFrom = null, camTo = null;
const IDLE_W = 0.45, MAX_W = 6.2;
const ease = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2;

spinBtn.addEventListener('click', () => {
  const p = drawPool();
  if (state !== 'idle' || p.length === 0) return;
  winnerName = LD.pick(p);
  drawCard(winnerName);
  openDrawer(false);
  state = 'spinup'; t = 0; spinBtn.disabled = true; namesBtn.disabled = true; controls.autoRotate = false;
  for (const b of balls) if (b.active) b.v.y += 1.5 + Math.random() * 2; // jolt
});
resetBtn.addEventListener('click', () => {
  if (winner) { winner.mesh.removeFromParent(); drumRoot.add(winner.mesh); closeCapsule(winner.mesh); winner.active = true; placeInside(winner, winner.n - 1); winner.p.y = 0.2; winner.mesh.position.copy(winner.p); }
  winner = null; card.visible = false; resultEl.classList.remove('show');
  resetBtn.hidden = true; namesBtn.disabled = false;
  camFrom = { p: camera.position.clone(), t: controls.target.clone() }; camTo = { p: HOME_POS.clone(), t: HOME_TARGET.clone() };
  state = 'return'; t = 0; controls.enabled = false;
  renderNamesUI(); spinBtn.disabled = true;
});

// The winning capsule is released while the drum is still slowing down, so there is no pause.
const revealPath = new THREE.CatmullRomCurve3([]);
const prevPos = new THREE.Vector3(), rollAxis = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0);
const landQ = new THREE.Quaternion();
const aimer = new THREE.Object3D();
// capsule stands upright (lid on top) and turns only around the vertical axis toward the camera
function uprightToCamQ() { aimer.position.copy(winner.mesh.position); aimer.lookAt(camera.position.x, winner.mesh.position.y, camera.position.z); return aimer.quaternion; }
const REVEAL_CAM = { p: new THREE.Vector3(1.6, 1.55, 4.6), t: new THREE.Vector3(0, 0.8, 2.2) };
const CLOSE_TARGET = new THREE.Vector3(0, 1.22, 2.35), CLOSE_OFF = new THREE.Vector3(0.9, 0.53, 2.4);
// pull back further on tall phone screens so the whole card fits
const CLOSE_CAM = new THREE.Vector3();
function updateCloseCam() { CLOSE_CAM.copy(CLOSE_TARGET).addScaledVector(CLOSE_OFF, innerWidth / innerHeight < 0.8 ? 1.75 : 1); }
updateCloseCam(); addEventListener('resize', updateCloseCam);
const CARD_REST = TRAY_P.clone().add(new THREE.Vector3(0, 0.62, 0));
const ROLL_T = 3.4;
let landCam = null, landTarget = null, shown = false;
function startReveal() {
  const act = balls.filter(b => b.active);
  act.sort((a, b) => (a.p.y - a.p.z * 0.5) - (b.p.y - b.p.z * 0.5)); // a capsule near the bottom-front
  winner = act[Math.floor(Math.random() * Math.min(6, act.length))];
  winner.active = false;
  const start = new THREE.Vector3(); winner.mesh.getWorldPosition(start);
  winner.mesh.removeFromParent(); scene.add(winner.mesh); winner.mesh.position.copy(start);
  const rest = TRAY_P.clone().add(new THREE.Vector3(0, BALL_R + 0.02, 0));
  revealPath.points = [start, CHUTE_A.clone(), ...[0.33, 0.66].map(u => chuteCurve.getPoint(u)), CHUTE_B.clone(), rest];
  revealPath.updateArcLengths();
  prevPos.copy(start); shown = false;
  camFrom = { p: camera.position.clone(), t: controls.target.clone() }; camTo = REVEAL_CAM;
  controls.enabled = false; state = 'reveal'; t = 0;
}
let slowT = -1; // drum keeps decelerating to a full stop in the background
function drumSlowdown(dt) {
  if (slowT < 0) return;
  slowT += dt; const k = Math.min(1, slowT / 2.4);
  omega = MAX_W * (1 - ease(k));
  if (k >= 1) { omega = 0; slowT = -1; }
}
function cardFaceCamera() { card.lookAt(camera.position); }
function showWinner() {
  winNameEl.textContent = winnerName;
  winNameEl.classList.toggle('long', winnerName.length > 28 && winnerName.length <= 48);
  winNameEl.classList.toggle('xlong', winnerName.length > 48);
  resultEl.classList.add('show');
  hintEl.textContent = 'Press Reset to draw again';
  if (!winners.includes(winnerName)) winners.push(winnerName);
  persist(); renderNamesUI();
}

function step(dt) {
  t += dt;
  if (state === 'idle') omega += (IDLE_W - omega) * Math.min(1, dt * 1.5);
  else if (state === 'spinup') { omega = IDLE_W + (MAX_W - IDLE_W) * ease(Math.min(1, t / 1.2)); if (t > 1.2) { state = 'spinning'; t = 0; } }
  else if (state === 'spinning') { omega = MAX_W; if (t > 3.2) { state = 'slowdown'; t = 0; slowT = 0; } }
  else if (state === 'slowdown') { drumSlowdown(dt); if (slowT > 1.7 || slowT < 0) startReveal(); }
  else if (state === 'reveal') {
    drumSlowdown(dt);
    const k = Math.min(1, t / ROLL_T);
    const u = 1 - Math.pow(1 - k, 2.2);
    winner.mesh.position.copy(revealPath.getPointAt(u));
    const d = winner.mesh.position.distanceTo(prevPos);
    if (d > 1e-6) {
      rollAxis.subVectors(winner.mesh.position, prevPos); rollAxis.y = 0;
      if (rollAxis.lengthSq() > 1e-10) { rollAxis.crossVectors(UP, rollAxis).normalize(); _q.setFromAxisAngle(rollAxis, d / BALL_R); winner.mesh.quaternion.premultiply(_q); }
    }
    prevPos.copy(winner.mesh.position);
    const c = ease(Math.min(1, t / 2.6));
    camera.position.lerpVectors(camFrom.p, camTo.p, c); controls.target.lerpVectors(camFrom.t, camTo.t, c);
    if (k >= 1) { state = 'landing'; t = 0; landQ.copy(winner.mesh.quaternion); landCam = camera.position.clone(); landTarget = controls.target.clone(); }
  }
  else if (state === 'landing') {
    drumSlowdown(dt);
    // damped bounce on the velvet while the capsule rights itself, lid up
    const L = 1.2, k = Math.min(1, t / L);
    const bounce = Math.abs(Math.sin(t * 9)) * Math.exp(-t * 4.5) * 0.12;
    winner.mesh.position.copy(TRAY_P).y += BALL_R + 0.02 + bounce;
    winner.mesh.quaternion.slerpQuaternions(landQ, uprightToCamQ(), ease(k));
    const c = ease(Math.min(1, t / 2.4));
    camera.position.lerpVectors(landCam, CLOSE_CAM, c); controls.target.lerpVectors(landTarget, CLOSE_TARGET, c);
    if (k >= 1) { state = 'opening'; t = 0; card.visible = true; card.scale.setScalar(0.05); card.position.copy(winner.mesh.position); }
  }
  else if (state === 'opening') {
    drumSlowdown(dt);
    const c = ease(Math.min(1, (t + 1.2) / 2.4)); // finish the camera ease begun in landing
    camera.position.lerpVectors(landCam, CLOSE_CAM, c); controls.target.lerpVectors(landTarget, CLOSE_TARGET, c);
    winner.mesh.quaternion.slerp(uprightToCamQ(), Math.min(1, dt * 8));
    // lid flips open, slip disappears as the card rises out of the capsule and unfurls
    const lidK = ease(Math.min(1, t / 0.7));
    winner.mesh.userData.hinge.rotation.x = -1.9 * lidK;
    const ck = Math.min(1, Math.max(0, (t - 0.35) / 1.3)), ce = 1 - Math.pow(1 - ck, 3);
    winner.mesh.userData.slip.visible = ck <= 0;
    card.position.lerpVectors(winner.mesh.position, CARD_REST, ce);
    card.scale.setScalar(0.05 + 0.95 * ce);
    cardFaceCamera();
    if (t > 1.1 && !shown) { shown = true; showWinner(); }
    if (ck >= 1) { state = 'won'; t = 0; resetBtn.hidden = false; controls.enabled = true; }
  }
  else if (state === 'won') {
    drumSlowdown(dt); if (slowT < 0) omega = 0; // drum stays stopped
    winner.mesh.position.y = TRAY_P.y + BALL_R + 0.02;
    winner.mesh.quaternion.slerp(uprightToCamQ(), Math.min(1, dt * 10));
    card.position.y = CARD_REST.y + Math.sin(t * 1.6) * 0.02; // gentle float
    cardFaceCamera(); // name always faces the viewer
  }
  else if (state === 'return') {
    const c = ease(Math.min(1, t / 1.6));
    camera.position.lerpVectors(camFrom.p, camTo.p, c); controls.target.lerpVectors(camFrom.t, camTo.t, c);
    if (c >= 1) { state = 'idle'; t = 0; controls.enabled = true; controls.autoRotate = !reduced; renderNamesUI(); }
  }
  angle += omega * dt; drum.rotation.x = angle;
  key.intensity = 85 + Math.min(1, omega / MAX_W) * 20;
}
renderNamesUI();

// ---------- loop ----------
const clock = new THREE.Clock();
let first = true;
function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 30);
  step(dt);
  const sub = 5; for (let i = 0; i < sub; i++) physics(dt / sub);
  updateConfetti(dt);
  const et = clock.elapsedTime;
  bokeh.children.forEach(s => s.material.opacity = 0.03 + 0.05 * (0.5 + 0.5 * Math.sin(et * 0.6 + s.userData.ph)));
  const pa = sparkGeo.attributes.position;
  for (let i = 0; i < SP; i++) { let y = pa.getY(i) + dt * (0.08 + spSeed[i] * 0.15); if (y > 5) y = 0; pa.setY(i, y); pa.setX(i, pa.getX(i) + Math.sin(et + spSeed[i] * 9) * dt * 0.05); }
  pa.needsUpdate = true;
  if (state === 'reveal' || state === 'landing' || state === 'opening' || state === 'return') camera.lookAt(controls.target);
  else controls.update();
  composer.render();
  if (first) { first = false; document.getElementById('loading').hidden = true; }
  requestAnimationFrame(frame);
}
// let balls settle before the first frame is shown
for (let i = 0; i < 240; i++) { physics(1 / 120); angle += IDLE_W / 120; drum.rotation.x = angle; }
frame();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; fitCamera();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
</script>

<script>LD.chrome({ primary: ['spin','reset'], accent: '#e8c26a' });</script>
