<!doctype html>
<html lang="en" data-design="wheel">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fortune Wheel · Lucky Draw</title>
<link rel="stylesheet" href="../vendor/fonts/wheel.css">
<link rel="stylesheet" href="ui.css">
<style>
/* Layout: a carnival wheel centred on a deep violet stage, pointer at 12 o'clock; title top-left, Draw docked bottom-centre */
:root { --bg: #0d0820; --ink: #fff7e6; --muted: #b9a9d9; --accent: #f5d27a; --accent-2: #c9962e; --btn-ink: #2a1a05;
  --display: "Fraunces", Georgia, serif; --body: "Outfit", "Segoe UI", system-ui, sans-serif; }
body { background: radial-gradient(80% 80% at 50% 52%, #2a1550 0%, #120a2b 55%, #07041a 100%); }
.winner { background: radial-gradient(80% 70% at 50% 50%, rgba(13,8,32,.94), rgba(13,8,32,.78) 65%, rgba(13,8,32,.35)); opacity: 0; transition: opacity .7s ease; }
.winner.show { opacity: 1; }
.winner .name { color: #fff7e6; text-shadow: 0 0 30px rgba(245,210,122,.45), 0 4px 0 #6b3fb0; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div class="ui top"><div><h1 data-ld-prize>Lucky Draw</h1><p id="meta"></p></div><button id="soundBtn" class="ghost" type="button">Sound on</button></div>
<div class="winner" id="win" aria-hidden="true"><div class="box"><div class="lbl">The wheel has chosen</div><div class="fit"><div class="name" id="winName"></div></div><div class="prize" data-ld-prize></div></div></div>
<div class="ui bottom"><div class="controls"><button id="draw" type="button">Spin</button><button id="reset" class="ghost" type="button" hidden>New draw</button></div><p class="hint" id="hint"></p></div>
<div id="result" class="sr" role="status" aria-live="polite"></div>

<script src="../core.js"></script>
<script>
(() => {
const cv = document.getElementById('c'), g = cv.getContext('2d');
const COLORS = ['#e0475b', '#f08a3c', '#f5c64f', '#2fa37a', '#3b82c4', '#8e4fd0'];
const MAX_SEG = 24, TAU = Math.PI * 2, POINTER = -Math.PI / 2;
let W, H, R, CX, CY, dpr, wheelImg = null, segs = [], angle = 0, omega = 0.12, mode = 'idle', winIdx = -1, glow = 0, pointerKick = 0, lastSeg = -1;

// segments: the winner is always on the wheel; with big lists the wheel shows a random sample around it
function buildSegments(winner) {
  const pool = LD.pool();
  let list = LD.shuffle(pool.filter(n => n !== winner)).slice(0, (winner ? MAX_SEG - 1 : MAX_SEG));
  if (winner) list.splice(LD.randInt(list.length + 1), 0, winner);
  if (list.length === 1) list = [list[0], list[0]];
  segs = list; winIdx = winner ? segs.indexOf(winner) : -1;
  renderWheel();
}
function ellipsize(text, maxW) {
  if (g.measureText(text).width <= maxW) return text;
  let lo = 0, hi = text.length;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; g.measureText(text.slice(0, m) + '…').width <= maxW ? lo = m : hi = m - 1; }
  return text.slice(0, lo).trimEnd() + '…';
}
function renderWheel() {
  const n = Math.max(1, segs.length), size = Math.ceil(R * 2 * dpr);
  wheelImg = document.createElement('canvas'); wheelImg.width = wheelImg.height = size;
  const w = wheelImg.getContext('2d'); w.scale(dpr, dpr); w.translate(R, R);
  const step = TAU / n;
  for (let i = 0; i < n; i++) {
    const a0 = i * step, a1 = a0 + step, col = COLORS[i % COLORS.length === 0 && i === n - 1 && n % COLORS.length === 1 ? 1 : i % COLORS.length];
    w.beginPath(); w.moveTo(0, 0); w.arc(0, 0, R, a0, a1); w.closePath();
    const gr = w.createRadialGradient(0, 0, R * 0.15, 0, 0, R); gr.addColorStop(0, shade(col, -0.25)); gr.addColorStop(0.7, col); gr.addColorStop(1, shade(col, 0.12));
    w.fillStyle = gr; w.fill();
    w.strokeStyle = 'rgba(255,240,200,.55)'; w.lineWidth = 2; w.stroke();
    // name along the segment's centre line, reading outward from the hub
    w.save(); w.rotate(a0 + step / 2);
    const fs = Math.max(11, Math.min(R * 0.065, R * step * 0.42));
    w.font = `600 ${fs}px Outfit, system-ui, sans-serif`; w.textAlign = 'right'; w.textBaseline = 'middle';
    g.font = w.font; const label = ellipsize(segs[i] || '', R * 0.66);
    w.fillStyle = col === '#f5c64f' ? '#3a2400' : '#fffaf0'; w.shadowColor = 'rgba(0,0,0,.35)'; w.shadowBlur = 3;
    w.fillText(label, R * 0.92, 0); w.restore();
  }
  // inner shading ring
  const vg = w.createRadialGradient(0, 0, R * 0.6, 0, 0, R); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.28)');
  w.fillStyle = vg; w.beginPath(); w.arc(0, 0, R, 0, TAU); w.fill();
}
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, gg = (n >> 8) & 255, b = n & 255;
  const t = k < 0 ? 0 : 255, p = Math.abs(k);
  r = Math.round((t - r) * p + r); gg = Math.round((t - gg) * p + gg); b = Math.round((t - b) * p + b);
  return `rgb(${r},${gg},${b})`;
}
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  R = Math.min(W * 0.42, H * 0.36); CX = W / 2; CY = H * 0.53;
  if (segs.length) renderWheel();
}
const segAt = a => { const n = segs.length, rel = ((POINTER - a) % TAU + TAU) % TAU; return Math.floor(rel / (TAU / n)) % n; };

function draw(now) {
  const t = now / 1000;
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  // stand + shadow
  g.save(); g.fillStyle = 'rgba(0,0,0,.45)'; g.filter = 'blur(18px)'; g.beginPath(); g.ellipse(CX, CY + R * 1.08, R * 0.85, R * 0.12, 0, 0, TAU); g.fill(); g.restore();
  // rim
  const rimW = R * 0.085;
  g.beginPath(); g.arc(CX, CY, R + rimW, 0, TAU);
  const rg = g.createLinearGradient(CX - R, CY - R, CX + R, CY + R); rg.addColorStop(0, '#fbe6a8'); rg.addColorStop(0.45, '#c9962e'); rg.addColorStop(0.7, '#f5d27a'); rg.addColorStop(1, '#8a5f1c');
  g.fillStyle = rg; g.fill();
  g.beginPath(); g.arc(CX, CY, R + rimW * 0.35, 0, TAU); g.fillStyle = '#3a2366'; g.fill();
  // wheel
  g.save(); g.translate(CX, CY); g.rotate(angle);
  if (wheelImg) g.drawImage(wheelImg, -R, -R, R * 2, R * 2);
  // winning segment glow
  if (glow > 0 && winIdx >= 0) {
    const step = TAU / segs.length;
    g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, R, winIdx * step, (winIdx + 1) * step); g.closePath();
    g.fillStyle = `rgba(255,248,220,${0.22 * glow * (0.75 + 0.25 * Math.sin(t * 6))})`; g.fill();
    g.lineWidth = 4; g.strokeStyle = `rgba(255,236,170,${glow})`; g.stroke();
  }
  // pegs
  const n = segs.length, step = TAU / Math.max(1, n);
  for (let i = 0; i < n; i++) { const a = i * step; g.beginPath(); g.arc(Math.cos(a) * (R - 6), Math.sin(a) * (R - 6), Math.max(3, R * 0.014), 0, TAU); g.fillStyle = '#fff4cf'; g.fill(); }
  g.restore();
  // marquee bulbs on the rim, chasing faster while spinning
  const bulbs = 36, chase = mode === 'spin' ? t * 14 : mode === 'won' ? (Math.floor(t * 4) % 2) * 2 : t * 2.5;
  for (let i = 0; i < bulbs; i++) {
    const a = i / bulbs * TAU, on = mode === 'won' ? (i % 2 === 0) === (chase < 1) : (Math.floor(chase) + i) % 3 !== 0;
    const x = CX + Math.cos(a) * (R + rimW * 0.68), y = CY + Math.sin(a) * (R + rimW * 0.68), br = Math.max(3, rimW * 0.2);
    if (on) { g.beginPath(); g.arc(x, y, br * 2.6, 0, TAU); g.fillStyle = 'rgba(255,230,160,.18)'; g.fill(); }
    g.beginPath(); g.arc(x, y, br, 0, TAU); g.fillStyle = on ? '#fff6d6' : '#6b5420'; g.fill();
  }
  // hub
  const hr = R * 0.15, hg = g.createRadialGradient(CX - hr * 0.3, CY - hr * 0.3, 1, CX, CY, hr);
  hg.addColorStop(0, '#fff3c4'); hg.addColorStop(0.5, '#e7b94c'); hg.addColorStop(1, '#8a5f1c');
  g.beginPath(); g.arc(CX, CY, hr, 0, TAU); g.fillStyle = hg; g.fill();
  g.beginPath(); g.arc(CX, CY, hr * 0.62, 0, TAU); g.fillStyle = '#3a2366'; g.fill();
  g.fillStyle = '#f5d27a'; g.font = `800 ${hr * 0.55}px Fraunces, Georgia, serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('★', CX, CY + hr * 0.04);
  // pointer (flapper) at 12 o'clock, kicked by the pegs
  const pl = R * 0.2, pw = R * 0.075;
  g.save(); g.translate(CX, CY - R - rimW * 0.5); g.rotate(-pointerKick * 0.5);
  g.shadowColor = 'rgba(0,0,0,.5)'; g.shadowBlur = 10; g.shadowOffsetY = 4;
  g.beginPath(); g.moveTo(-pw, -pl * 0.35); g.lineTo(pw, -pl * 0.35); g.lineTo(0, pl * 0.75); g.closePath();
  const pg = g.createLinearGradient(-pw, 0, pw, 0); pg.addColorStop(0, '#fff'); pg.addColorStop(1, '#d9d2e8'); g.fillStyle = pg; g.fill();
  g.shadowColor = 'transparent'; g.beginPath(); g.arc(0, -pl * 0.35, pw * 0.45, 0, TAU); g.fillStyle = '#e0475b'; g.fill();
  g.restore();
}

let spin = null, last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (mode === 'idle') { angle += omega * dt; }
  else if (mode === 'spin' && spin) {
    const k = Math.min(1, (now - spin.t0) / spin.T);
    angle = spin.a0 + spin.fn(k);
    if (k >= 1) { mode = 'settled'; spin.done(); spin = null; }
  }
  // pointer flick: each peg crossing kicks it, it springs back
  if (segs.length) {
    const s = segAt(angle);
    if (s !== lastSeg) { if (mode === 'spin') { pointerKick = 1; LD.snd.tick(1700); } lastSeg = s; }
  }
  pointerKick = Math.max(0, pointerKick - dt * 7);
  draw(now); requestAnimationFrame(loop);
}

// spin profile: short wind-up backwards, then a long decelerating glide (quartic ease-out) to the exact target
function spinTo(target, T) {
  return new Promise(done => {
    const a0 = angle, back = 0.22, wind = 0.08; // first 8% of the time pulls back a little
    const D = target - a0;
    const fn = k => k < wind
      ? -back * Math.sin((k / wind) * Math.PI / 2)
      : -back + (D + back) * (1 - Math.pow(1 - (k - wind) / (1 - wind), 4));
    spin = { a0, T, fn, t0: performance.now(), done }; mode = 'spin';
  });
}

LD.stage({
  accent: '#f5d27a', drawingHint: 'Round and round it goes…',
  async draw(winner) {
    // land the winner's segment under the pointer, at a random spot inside it (not always dead centre)
    if (!segs.includes(winner)) { segs[LD.randInt(segs.length)] = winner; renderWheel(); } // only one label changes, so the wheel doesn't jump
    winIdx = segs.indexOf(winner);
    const n = segs.length, step = TAU / n, inside = (0.2 + 0.6 * Math.random()) * step;
    let target = POINTER - (winIdx * step + inside);
    const turns = LD.reduced ? 1 : 7 + LD.randInt(3);
    while (target < angle + turns * TAU) target += TAU;
    LD.snd.whoosh(1.2, 0.04);
    await spinTo(target, LD.reduced ? 600 : 8200 + Math.random() * 1200);
    mode = 'won'; LD.snd.boom();
    await LD.tween(500, k => { glow = k; }, LD.ease.outCubic);
    await LD.sleep(500);
    const nameEl = document.getElementById('winName'); nameEl.textContent = winner;
    const win = document.getElementById('win'); win.classList.add('show');
    LD.fitText(nameEl, { max: Math.min(140, innerWidth * 0.09), min: 22 });
    nameEl.animate([{ transform: 'scale(.6) translateY(30px)', opacity: 0 }, { transform: 'scale(1.06)', opacity: 1, offset: .7 }, { transform: 'none', opacity: 1 }], { duration: LD.reduced ? 1 : 900, easing: 'cubic-bezier(.2,.8,.2,1)' });
    LD.snd.chime(); LD.confetti({ colors: COLORS.concat(['#fff7e6', '#f5d27a']) });
  },
  async reset() {
    document.getElementById('win').classList.remove('show');
    await LD.tween(400, k => { glow = 1 - k; });
    mode = 'idle'; buildSegments(null);
  }
});
addEventListener('resize', resize);
resize(); buildSegments(null);
if (document.fonts) document.fonts.ready.then(() => renderWheel());
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
