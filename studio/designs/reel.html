// hero panel for the reveal

  const back = new THREE.Mesh(new THREE.BoxGeometry(PANEL_W + 0.1, PANEL_H + 0.1, 0.06), new THREE.MeshStandardMaterial({ color: 0xc8ae78, metalness: 0.75, roughness: 0.5 }));

const haloTex = (() => {

let reveal = null; // { t, dir: 1 out | -1 back, hidden: panel }
const HERO_FROM = new THREE.Vector3(0, REEL_Y, R + 0.02), HERO_TO = new THREE.Vector3(0, REEL_Y + 0.3, R + 1.3);
function startReveal() {

// highlight window: gold bars + red pointers in front of the reel

const barMat = new THREE.MeshStandardMaterial({ color: 0xc8ae78, emissive: 0xc8ae78, emissiveIntensity: 0.18, metalness: 0.7, roughness: 0.55 });
for (const sy of [-1, 1]) { const bar = new THREE.Mesh(new THREE.BoxGeometry(PANEL_W + 0.5, 0.025, 0.025), barMat); bar.position.y = sy * (PANEL_H / 2 + 0.03); winGroup.add(bar); }

});
const edgeMat = new THREE.MeshStandardMaterial({ color: 0xc8ae78, metalness: 0.7, roughness: 0.55 });
[[0, FH / 2 - T / 2, FW - T, 0.03], [0, -FH / 2 + T / 2, FW - T, 0.03], [-FW / 2 + T / 2, 0, 0.03, FH - T], [FW / 2 - T / 2, 0, 0.03, FH - T]].forEach(([x, y, w, h]) => {

const bulbPts = [];
{
  const gap = 0.36, nx = Math.round(FW / gap), ny = Math.round(FH / gap);

}
const bulbs = new THREE.InstancedMesh(new THREE.SphereGeometry(0.05, 14, 10), new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false }), bulbPts.length);

// sweeping spotlights with visible beams
const beamTex = (() => {

  // alphaMap reads brightness, so the fade is drawn black to white (bright near the lamp, fading toward the floor)
  const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, '#000'); gr.addColorStop(0.12, '#8c8c8c'); gr.addColorStop(1, '#000');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256); return new THREE.CanvasTexture(c);
})();
const spots = [];
[[-9, 0xffe2b8, 0], [9, 0xffe2b8, 1.6], [-4.5, 0xfff0d8, 3.1], [4.5, 0xfff0d8, 4.4]].forEach(([x, color, ph]) => {

  const beam = new THREE.Mesh(beamGeo, new THREE.MeshBasicMaterial({ color, alphaMap: beamTex, transparent: true, opacity: 0.07, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false }));

// background: crowd of tiny lights + bokeh
const bokehTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.5, 'rgba(255,255,255,.5)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
})();
const crowdN = 900, crowdPos = new Float32Array(crowdN * 3), crowdCol = new Float32Array(crowdN * 3), crowdPh = new Float32Array(crowdN);
for (let i = 0; i < crowdN; i++) {
  const a = (Math.random() - 0.5) * Math.PI * 1.25, r = 24 + Math.random() * 14;

// confetti for the win
const CONF = 260;

function burst() {

// post
const composer = new EffectComposer(renderer);

composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- reel motion (same draw logic as the 2D reel) ----------
let order = [], pos = 0, vel = 0.7, state = 'idle', t0 = 0, decel = null, winner = null, lastCenter = null, wonAt = 0;
const IDLE_V = 0.7, MAX_V = 24;
function rebuildOrder() { order = shuffle(drawPool()); panels.forEach(p => p.k = null); }
function updatePanels() {
  const N = order.length;
  reel.rotation.x = pos * STEP; // turning the reel brings the next name (k+1) down into the window
  panels.forEach((p, i) => {
    // label k is the reel index whose angle matches this panel, chosen nearest to the current position
    // panel i faces the audience when pos ≡ i (mod P); it carries reel index kNear, the one nearest the current position
    const kNear = i + P * Math.round((pos - i) / P);

    const want = kNear + (state === 'won' && kNear === Math.round(pos) ? 0.5 : 0);
    if (p.k !== want) { const isWin = state === 'won' && kNear === Math.round(pos); drawPanel(p, order[((kNear % N) + N) % N], isWin); p.k = want; }

}
function startDecel(now) {
  const N = order.length, w = order.indexOf(winner), T0 = reduced ? 1.5 : 6.5;

}
function land() {

  panels.forEach(p => p.k = null);
  crash(); setMusicLevel();
  setTimeout(() => { if (state === 'won') { whoosh(); startReveal(); } }, reduced ? 0 : 650);
  $('winName').textContent = winner;
  persist(); renderUI();
  spinBtn.hidden = true; resetBtn.hidden = false;
  hintEl.textContent = 'Press New draw to go again';
}

const easeIO = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const clock = new THREE.Clock();
const spotTarget = new THREE.Vector3(), centerTarget = new THREE.Vector3(0, REEL_Y, R);
let first = true, bulbClock = 0, spinStart = 0;
const lookNow = LOOK.clone(), LOOK_REVEAL = new THREE.Vector3(0, REEL_Y + 0.25, R + 1.3);
// how far to move in so the lifted name fills about three quarters of the screen width

}

}

// ---------- UI ----------
const spinBtn = $('spin'), resetBtn = $('reset'), hintEl = $('hint');

}

});
