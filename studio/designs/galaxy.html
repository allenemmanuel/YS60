<!doctype html>
<html lang="en" data-design="galaxy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Galaxy Warp · Lucky Draw</title>
<link rel="stylesheet" href="../vendor/fonts/galaxy.css">
<link rel="stylesheet" href="ui.css">
<style>
/* Layout: full-bleed 3D galaxy; each entrant is a named star; the camera warps to the winner's star; title top-left, Warp docked bottom-centre */
:root { --bg: #020108; --ink: #f4f1ff; --muted: #a59ccc; --accent: #c9b6ff; --accent-2: #7a5cff; --btn-ink: #0b0620;
  --display: "Space Grotesk", "Segoe UI", sans-serif; --body: "Space Grotesk", "Segoe UI", system-ui, sans-serif; }
.ui.top h1 { font-family: "Syncopate", var(--display); font-weight: 700; letter-spacing: .06em; font-size: clamp(20px, 3vw, 34px); }
#draw { font-family: "Syncopate", var(--display); font-size: 18px; letter-spacing: .3em; }
/* GSAP owns the winner card's opacity/transform (autoAlpha), so no CSS transition here */
.winner { visibility: hidden; opacity: 0; }
/* dark scrim behind the name so it stays readable over the bright star */
.winner::before { content: ""; position: absolute; inset: 0; z-index: -1;
  background: radial-gradient(ellipse 62% 42% at 50% 50%, rgba(4,2,16,.82) 0%, rgba(4,2,16,.55) 45%, rgba(4,2,16,0) 75%); }
.winner .box { will-change: transform, opacity; }
.winner .name { color: #fff; text-shadow: 0 2px 14px rgba(4,2,16,.95), 0 0 26px rgba(200,180,255,.75), 0 0 64px rgba(122,92,255,.5); letter-spacing: .01em; }
#loading { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; color: var(--muted); letter-spacing: .3em; font-size: 12px; text-transform: uppercase; pointer-events: none; }
#loading[hidden] { display: none; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="loading">Charting the stars…</div>
<div class="ui top"><div><h1 data-ld-prize>Lucky Draw</h1><p id="meta"></p></div><button id="soundBtn" class="ghost" type="button">Sound on</button></div>
<div class="winner" id="win" aria-hidden="true"><div class="box"><div class="lbl">Destination reached</div><div class="fit"><div class="name" id="winName"></div></div><div class="prize" data-ld-prize></div></div></div>
<div class="ui bottom"><div class="controls"><button id="draw" type="button">Warp</button><button id="reset" class="ghost" type="button" hidden>New draw</button></div><p class="hint" id="hint"></p></div>
<div id="result" class="sr" role="status" aria-live="polite"></div>

<script src="../core.js"></script>
<script type="importmap">
{ "imports": {
  "three": "../vendor/three/build/three.module.js",
  "gsap": "../vendor/gsap/index.js",
  "gsap/": "../vendor/gsap/"
} }
</script>
<script>
// If the 3D engine can't load (page opened as a file instead of over http, or vendor/ missing), say so instead of sitting on the loading text.
setTimeout(() => { if (!window.__galaxyReady) { const l = document.getElementById('loading'); l.hidden = false;
  l.textContent = 'Could not load the 3D engine. Open the studio through a local web server (e.g. python -m http.server), not by double-clicking the file.'; } }, 12000);
</script>
<script type="module">
import * as THREE from 'three';
import { gsap } from 'gsap';
import { CustomEase } from 'gsap/CustomEase.js';
gsap.registerPlugin(CustomEase);
window.__galaxyReady = true; // module only runs if three + gsap imported, so the "could not load" fallback stays quiet

// Flight ease: smooth launch, cruise, then a ~1.8% overshoot past the stop that settles back.
// Control points either side of each joint are collinear, so the speed has no kinks.
CustomEase.create('warpArrive', 'M0,0 C0.25,0 0.42,0.52 0.6,0.86 0.68,1.011 0.76,1.018 0.82,1.018 0.9,1.018 0.95,1 1,1');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('stage').appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x020108);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.01, 200);
const HOME = new THREE.Vector3(0, 7.5, 15), ORIGIN = new THREE.Vector3(0, -0.6, 0), UP = new THREE.Vector3(0, 1, 0);
camera.position.copy(HOME); camera.lookAt(ORIGIN);

// soft round sprite used for every star
const dot = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,.8)'); gr.addColorStop(0.6, 'rgba(255,255,255,.15)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();

// ---------- galaxy: spiral arms of dust ----------
const galaxy = new THREE.Group(); scene.add(galaxy);
const N = 14000, ARMS = 4, GR = 9;
let dust, core;
{
  const pos = new Float32Array(N * 3), col = new Float32Array(N * 3), inner = new THREE.Color(0xffd9a0), outer = new THREE.Color(0x5b7cff), c = new THREE.Color();
  for (let i = 0; i < N; i++) {
    const r = Math.pow(Math.random(), 1.6) * GR, arm = (i % ARMS) / ARMS * Math.PI * 2, a = arm + r * 0.55;
    const spread = 0.35 + r * 0.06, rx = (Math.random() - 0.5) * spread * 2, rz = (Math.random() - 0.5) * spread * 2;
    pos[i * 3] = Math.cos(a) * r + rx; pos[i * 3 + 1] = (Math.random() - 0.5) * 0.5 * (1 - r / GR) ** 2; pos[i * 3 + 2] = Math.sin(a) * r + rz;
    c.copy(inner).lerp(outer, Math.min(1, r / GR * 1.2)); c.multiplyScalar(0.5 + Math.random() * 0.6);
    col.set([c.r, c.g, c.b], i * 3);
  }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  dust = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.09, map: dot, vertexColors: true, transparent: true, opacity: 1, depthWrite: false, blending: THREE.AdditiveBlending }));
  galaxy.add(dust);
  core = new THREE.Sprite(new THREE.SpriteMaterial({ map: dot, color: 0xffe2b0, transparent: true, opacity: 0.85, depthWrite: false, blending: THREE.AdditiveBlending }));
  core.scale.setScalar(5); galaxy.add(core);
}
// distant background stars
{
  const n = 2500, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const v = new THREE.Vector3().randomDirection().multiplyScalar(60 + Math.random() * 60); pos.set([v.x, v.y, v.z], i * 3); }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.35, map: dot, color: 0xbfc8ff, transparent: true, opacity: 0.7, depthWrite: false, blending: THREE.AdditiveBlending })));
}

// ---------- named stars ----------
const MAX_STARS = 90, STAR = 0.42;
let stars = [];
function labelTexture(text) {
  const c = document.createElement('canvas'), g = c.getContext('2d'), fs = 44;
  g.font = `600 ${fs}px "Space Grotesk", system-ui, sans-serif`;
  const w = Math.min(1024, Math.ceil(g.measureText(text).width) + 24); c.width = w; c.height = fs + 20;
  g.font = `600 ${fs}px "Space Grotesk", system-ui, sans-serif`; g.fillStyle = '#e8e2ff'; g.textBaseline = 'middle'; g.fillText(text, 12, c.height / 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return { t, aspect: w / c.height };
}
function buildStars(force, labelOpacity) {
  stars.forEach(s => { galaxy.remove(s.sprite, s.label); s.sprite.material.dispose(); s.label.material.map.dispose(); s.label.material.dispose(); });
  const pool = LD.pool(); const list = LD.shuffle(pool).slice(0, MAX_STARS);
  if (force && !list.includes(force)) list[0] = force;
  const lo = pool.length > 40 ? 0.35 : 0.6; // label opacity, read once (not every frame)
  stars = list.map((name, i) => {
    // place along the arms, away from the bright core
    const r = 2.2 + Math.random() * (GR - 3), arm = LD.randInt(ARMS) / ARMS * Math.PI * 2, a = arm + r * 0.55 + (Math.random() - 0.5) * 0.4;
    const p = new THREE.Vector3(Math.cos(a) * r, (Math.random() - 0.5) * 0.25, Math.sin(a) * r);
    const hue = [0xffffff, 0xffe7b8, 0xc9d6ff, 0xffd0e8][i % 4];
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: dot, color: hue, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
    sprite.position.copy(p); sprite.scale.setScalar(STAR); galaxy.add(sprite);
    const { t, aspect } = labelTexture(name.length > 26 ? name.slice(0, 25) + '…' : name);
    const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, opacity: labelOpacity ?? lo, depthWrite: false }));
    const h = 0.17; label.scale.set(h * aspect, h, 1); label.center.set(0, 0.5); label.position.copy(p).add(new THREE.Vector3(0.18, 0.02, 0)); galaxy.add(label);
    return { name, sprite, label, lo, ph: Math.random() * 6, pulse: 1 };
  });
}

// ---------- motion state (everything below is driven by GSAP's ticker, in seconds) ----------
// `spin` is the galaxy's angular VELOCITY (rad/s); the loop integrates it while `integrate` is on.
const S = { spin: 0.035, integrate: true, idle: true };
const look = ORIGIN.clone(), tmp = new THREE.Vector3();
let flared = null; // the winner's star while it is flared (skip its twinkle)
function resize() { camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 0.8 ? 72 : 55; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); }
addEventListener('resize', resize); resize();
const FOV0 = () => (camera.aspect < 0.8 ? 72 : 55);

if (location.hash === '#debug') window.__galaxy = { galaxy, camera, gsap, get tl() { return tl; }, render: () => renderer.render(scene, camera) };
let t = 0, shown = false;
gsap.ticker.add((time, deltaMs) => {
  const dt = Math.min(deltaMs / 1000, 0.05); t += dt;
  if (S.integrate) galaxy.rotation.y += S.spin * dt;
  if (S.idle) {
    // slow orbit for life; exponential smoothing written frame-rate independently
    tmp.set(HOME.x + Math.sin(t * 0.07) * 2, HOME.y + Math.sin(t * 0.05) * 0.6, HOME.z);
    camera.position.lerp(tmp, 1 - Math.exp(-0.8 * dt));
    look.lerp(ORIGIN, 1 - Math.exp(-2 * dt)); camera.lookAt(look);
  }
  if (!LD.reduced) for (const s of stars) if (s !== flared) s.sprite.scale.setScalar(STAR * s.pulse * (0.85 + 0.15 * Math.sin(t * 2.2 + s.ph)));
  renderer.render(scene, camera);
  if (!shown) { shown = true; gsap.to('#loading', { autoAlpha: 0, duration: 0.6, onComplete: () => { document.getElementById('loading').hidden = true; } }); }
});

const winEl = document.getElementById('win'), boxEl = winEl.querySelector('.box'), nameEl = document.getElementById('winName');
let tl = null;

LD.stage({
  accent: '#c9b6ff', drawingHint: 'Engaging warp drive…',
  draw(winner) {
    let star = stars.find(s => s.name === winner);
    if (!star) { buildStars(winner); star = stars.find(s => s.name === winner); }
    S.idle = false;
    const V = 2.2, T_UP = 1.4, T_FLY = 3.6;
    const camFrom = camera.position.clone(), lookFrom = look.clone();
    const st = { up: 0, fly: 0 };
    let r0 = 0, rotEnd = 0, path = null, pathLen = 1, target = new THREE.Vector3();
    LD.snd.whoosh(2.4, 0.06);

    // Galaxy rotation is computed analytically from here on (not integrated per frame), so its
    // angular velocity is exactly continuous at every hand-off.
    gsap.killTweensOf(stars.map(s => s.label.material)); // e.g. a label fade-in still running from load/reset
    gsap.killTweensOf(S); const v0 = S.spin, rA = galaxy.rotation.y; S.integrate = false;
    const sineInOut = gsap.parseEase('sine.inOut');

    tl = gsap.timeline();
    // 1) spin-up: angular velocity v(u) = v0 + (V-v0)·u² — starts at the current idle speed (no jolt), ends at V.
    //    camera eases back to the home view; labels fade out.
    tl.to(st, { up: 1, duration: T_UP, ease: 'none', onUpdate() {
        const u = st.up, e = sineInOut(u);
        galaxy.rotation.y = rA + T_UP * (v0 * u + (V - v0) * u * u * u / 3);
        camera.position.lerpVectors(camFrom, HOME, e); look.lerpVectors(lookFrom, ORIGIN, e); camera.lookAt(look);
      } }, 0)
      .to(stars.map(s => s.label.material), { opacity: 0, duration: T_UP * 0.8, ease: 'power1.in' }, 0)
    // 2) warp. The galaxy decelerates from exactly V (velocity V·(1-u)² → starts at cruise speed, ends at 0),
    //    so where it stops is known in advance; the camera flies to that spot on a curved path.
      .add(() => {
        S.spin = 0; r0 = galaxy.rotation.y;
        rotEnd = r0 + V * T_FLY / 3; // ∫ V(1-u)² over T_FLY
        target.copy(star.sprite.position).applyAxisAngle(UP, rotEnd); // star's world position once the galaxy stops
        const out = target.clone().sub(ORIGIN).setY(0).normalize();
        const end = target.clone().addScaledVector(out, 2.6).add(new THREE.Vector3(0, 0.95, 0));
        const start = camera.position.clone();
        const mid = start.clone().lerp(end, 0.5).add(new THREE.Vector3(out.z * 4, 2.5, -out.x * 4));
        path = new THREE.CatmullRomCurve3([start, mid, end]); pathLen = path.getLength();
        LD.snd.whoosh(3, 0.08);
      }, T_UP)
      .to(st, { fly: 1, duration: T_FLY, ease: 'none', onUpdate() {
        const u = st.fly;
        galaxy.rotation.y = r0 + V * T_FLY * (1 - Math.pow(1 - u, 3)) / 3;
        const e = gsap.parseEase('warpArrive')(u);
        // beyond 1 the ease overshoots: carry on along the end tangent, then settle back
        // getPointAt = arc-length parameterised, so speed stays continuous where the curve's segments join
        if (e <= 1) path.getPointAt(e, camera.position);
        else path.getPointAt(1, camera.position).addScaledVector(path.getTangentAt(1, tmp), (e - 1) * pathLen);
        const k = Math.min(1, u * 1.4), ls = k * k * (3 - 2 * k);
        look.lerpVectors(ORIGIN, star.sprite.getWorldPosition(tmp), ls); camera.lookAt(look);
        camera.fov = FOV0() + 26 * Math.sin(Math.PI * Math.min(1, e)) ** 2; camera.updateProjectionMatrix();
      } }, T_UP)
      // dim the dust as we arrive so close particles don't wash out the reveal
      .to(dust.material, { opacity: 0.32, duration: T_FLY * 0.5, ease: 'sine.inOut' }, T_UP + T_FLY * 0.45)
      .to(core.material, { opacity: 0.45, duration: T_FLY * 0.5, ease: 'sine.inOut' }, T_UP + T_FLY * 0.45)
    // 3) the star flares (overshoot + settle) and the name blooms out of it
      .add(() => { flared = star; LD.snd.boom(); }, T_UP + T_FLY - 0.25)
      .to(star.sprite.scale, { x: STAR * 3.4, y: STAR * 3.4, duration: 1.1, ease: 'back.out(2.4)' }, '<')
      .to(star.sprite.material.color, { r: 1, g: 0.95, b: 0.82, duration: 0.6 }, '<')
      .add(() => {
        nameEl.textContent = winner;
        gsap.set(winEl, { autoAlpha: 1 }); gsap.set(boxEl, { autoAlpha: 0 });
        LD.fitText(nameEl, { max: Math.min(140, innerWidth * 0.1), min: 20 });
      }, '<0.25')
      .fromTo(boxEl, { autoAlpha: 0, scale: 0.9, y: 18 }, { autoAlpha: 1, scale: 1, y: 0, duration: 1.0, ease: 'back.out(1.6)' }, '<')
      .add(() => { LD.snd.chime(); LD.confetti({ colors: ['#ffffff', '#c9b6ff', '#ffe7b8', '#9fd0ff'], count: 140 }); }, '<0.1');
    if (LD.reduced) tl.progress(1);
    return tl.then(() => {});
  },
  reset() {
    const star = flared;
    const from = camera.position.clone(), lookFrom = look.clone(), st = { k: 0 };
    tl = gsap.timeline();
    tl.to(winEl, { autoAlpha: 0, duration: 0.45, ease: 'power1.out' }, 0);
    if (star) tl.to(star.sprite.scale, { x: STAR, y: STAR, duration: 0.6, ease: 'power2.inOut' }, 0);
    tl.to(st, { k: 1, duration: 2.4, ease: 'power3.inOut', onUpdate() {
        camera.position.lerpVectors(from, HOME, st.k); look.lerpVectors(lookFrom, ORIGIN, st.k); camera.lookAt(look);
      } }, 0.2)
      .to(dust.material, { opacity: 1, duration: 1.6, ease: 'sine.inOut' }, 0.5)
      .to(core.material, { opacity: 0.85, duration: 1.6, ease: 'sine.inOut' }, 0.5)
      .add(() => {
        flared = null; buildStars(null, 0);
        gsap.to(stars.map(s => s.label.material), { opacity: stars[0] ? stars[0].lo : 0.6, duration: 0.9, ease: 'sine.out' });
        // idle drift resumes by easing the camera smoothing back in and the spin up from rest (no jolt)
        S.idle = true; S.integrate = true; S.spin = 0;
        gsap.to(S, { spin: 0.035, duration: 2.2, ease: 'sine.in' });
      });
    if (LD.reduced) tl.progress(1);
    return tl.then(() => {});
  }
});

// Build the named stars once the label font is ready (avoids a visible reshuffle a moment after load).
Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 2500))])
  .then(() => { if (!S.idle || stars.length) return; buildStars(null, 0); gsap.to(stars.map(s => s.label.material), { opacity: stars[0] ? stars[0].lo : 0.6, duration: 0.8 }); });
</script>
</body>
</html>
