<!doctype html>
<html lang="en" data-design="agung">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Agung · Lucky Draw</title>
<link rel="stylesheet" href="../vendor/fonts/agung.css">
<link rel="stylesheet" href="ui.css">
<style>
/* Layout: a single bronze agung hangs in a dark hall under one spotlight, filling the upper two-thirds;
   the winner's name rises out of the gong's boss into the band below it. Title top-left, Draw bottom-centre. */
:root { --bg: #070504; --ink: #f1e6d2; --muted: #b29e84; --accent: #d9a85e; --accent-2: #9a6a2c; --btn-ink: #1d1206;
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif; --body: "Manrope", "Segoe UI", system-ui, sans-serif; }
.ui.top h1 { font-weight: 600; letter-spacing: .02em; }
#draw { font-family: var(--body); font-weight: 600; font-size: 15px; letter-spacing: .34em; padding: 16px 52px; }
/* the name occupies the band under the gong */
.winner { visibility: hidden; padding: 64vh 6vw 13vh; }
.winner .box { max-height: 24vh; gap: .9vh; }
.winner .lbl { color: rgba(241,230,210,.72); letter-spacing: .5em; font-size: clamp(11px, 1.2vw, 14px); }
.winner .name { font-family: var(--display); font-weight: 700; line-height: 1.02; color: #d9a85e; filter: drop-shadow(0 3px 8px rgba(0,0,0,.7)); }
/* embossed bronze: each letter carries its own cast-bronze gradient */
.winner .name .ch { display: inline-block; background: linear-gradient(180deg, #fff0c9 0%, #eec27a 28%, #b97a35 58%, #7a4a1c 80%, #d7a35c 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; will-change: transform, opacity; }
.winner .name .wd { display: inline-block; white-space: nowrap; }
.winner .rule { width: min(320px, 36vw); height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
.winner .prize { letter-spacing: .3em; }
#loading { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; color: var(--muted); letter-spacing: .4em; font-size: 11px; text-transform: uppercase; pointer-events: none; }
#loading[hidden] { display: none; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="loading">The hall falls quiet…</div>
<div class="ui top"><div><h1 data-ld-prize>Lucky Draw</h1><p id="meta"></p></div><button id="soundBtn" class="ghost" type="button">Sound on</button></div>
<div class="winner" id="win" aria-hidden="true"><div class="box"><div class="lbl">On the third strike</div><div class="fit"><div class="name" id="winName"></div></div><div class="rule" id="rule"></div><div class="prize" data-ld-prize></div></div></div>
<div class="ui bottom"><div class="controls"><button id="draw" type="button">Strike</button><button id="reset" class="ghost" type="button" hidden>New draw</button></div><p class="hint" id="hint"></p></div>
<div id="result" class="sr" role="status" aria-live="polite"></div>

<script src="../core.js"></script>
<script type="importmap">
{ "imports": {
  "three": "../vendor/three/build/three.module.js",
  "three/addons/": "../vendor/three/examples/jsm/",
  "gsap": "../vendor/gsap/index.js",
  "gsap/": "../vendor/gsap/"
} }
</script>
<script>
setTimeout(() => { if (!window.__agungReady) { const l = document.getElementById('loading'); l.hidden = false;
  l.textContent = 'Could not load the 3D engine. Open the studio through a local web server (e.g. python -m http.server), not by double-clicking the file.'; } }, 12000);
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { gsap } from 'gsap';
import { SplitText } from 'gsap/SplitText.js';
gsap.registerPlugin(SplitText);
window.__agungReady = true;

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
document.getElementById('stage').appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x050302);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.45, 0.8);
composer.addPass(bloom); composer.addPass(new OutputPass());

// ---------- state: everything below reads from P; one GSAP timeline per draw writes it ----------
// clock: seconds since the draw began (drives strikes, swing and ripples deterministically)
const P = { clock: 0, cam: 0, spot: 0.35, conv: 0, boss: 0 };
const STRIKES = [2.0, 3.9, 5.8], AMPS = [0.55, 0.8, 1.0];
const GONG_Y = 1.6, R = 3.0;

// ---------- back wall: a warm pool of spill light behind the gong ----------
const wall = new THREE.Mesh(new THREE.PlaneGeometry(70, 44), new THREE.ShaderMaterial({
  uniforms: { spot: { value: 0.35 }, flash: { value: 0 } },
  vertexShader: `varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `uniform float spot; uniform float flash; varying vec2 vP;
    void main(){
      vec2 p = vP - vec2(0., ${GONG_Y.toFixed(2)} + 1.2);
      float pool = exp(-dot(p * vec2(.10, .085), p * vec2(.10, .085)) * 2.2);
      vec3 c = vec3(.010,.007,.005) + vec3(.16,.085,.035) * pool * (spot * .9 + flash * .5);
      gl_FragColor = vec4(c, 1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
}));
wall.position.set(0, 2, -7); scene.add(wall);

// ---------- the agung ----------
// hammered surface: a bump map of small irregular dimples
const hammer = (() => { const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 1100; i++) { const x = Math.random() * 512, y = Math.random() * 512, r = 5 + Math.random() * 13;
    const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(40,40,40,.55)'); gr.addColorStop(.7, 'rgba(110,110,110,.2)'); gr.addColorStop(1, 'rgba(128,128,128,0)');
    g.fillStyle = gr; g.beginPath(); g.ellipse(x, y, r, r * (.7 + Math.random() * .5), Math.random() * 3, 0, 6.29); g.fill(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(5, 1); return t; })();
// emissive mask: only the central boss can glow (lathe v runs from the boss centre outward)
const bossMask = (() => { const c = document.createElement('canvas'); c.width = 4; c.height = 256; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 256, 0, 0); gr.addColorStop(0, '#fff'); gr.addColorStop(.26, '#fff'); gr.addColorStop(.36, '#000'); gr.addColorStop(1, '#000');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256); return new THREE.CanvasTexture(c); })();
// profile (radius, depth toward the viewer): boss, two raised rings, face, and the deep rolled flange
const PROF = [[0.001,.44],[.18,.42],[.34,.36],[.46,.27],[.55,.16],[.62,.07],[.70,.02],[.82,0],[1.0,.035],[1.12,0],
  [1.8,.03],[2.3,.06],[2.42,.1],[2.54,.06],[2.85,.08],[3.0,.04],[3.08,-.08],[3.12,-.3],[3.12,-.62],[3.05,-.66],[2.98,-.6]];
const pivot = new THREE.Group(); pivot.position.set(0, GONG_Y + 5.2, 0); scene.add(pivot);
const gongGroup = new THREE.Group(); gongGroup.position.set(0, -5.2, 0); pivot.add(gongGroup);
const gongMat = new THREE.MeshStandardMaterial({ color: 0xb98146, metalness: 1, roughness: 0.34, bumpMap: hammer, bumpScale: 0.9,
  envMapIntensity: 0.45, emissive: 0xffb45a, emissiveMap: bossMask, emissiveIntensity: 0, side: THREE.DoubleSide });
const lathe = new THREE.LatheGeometry(PROF.map(([r, h]) => new THREE.Vector2(r, h)), 160);
const gong = new THREE.Mesh(lathe, gongMat); gong.rotation.x = Math.PI / 2; gongGroup.add(gong);
// cords to the (unseen) frame above
const cordMat = new THREE.MeshStandardMaterial({ color: 0x4a1d12, roughness: .9, metalness: 0 });
[-1, 1].forEach(s => {
  const a = new THREE.Vector3(s * R * Math.sin(.68), R * Math.cos(.68), -.35), b = new THREE.Vector3(s * .5, 5.4, -.35);
  const len = a.distanceTo(b), m = new THREE.Mesh(new THREE.CylinderGeometry(.045, .045, len, 8), cordMat);
  m.position.copy(a).add(b).multiplyScalar(.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize()); gongGroup.add(m);
});

// ripples of light across the face (one shader disc just in front of the face; the boss hides its centre)
const ripple = new THREE.Mesh(new THREE.CircleGeometry(R + .02, 128), new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { tau: { value: new THREE.Vector3(-1, -1, -1) }, amp: { value: new THREE.Vector3(...AMPS) }, conv: { value: 0 } },
  vertexShader: `varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `uniform vec3 tau; uniform vec3 amp; uniform float conv; varying vec2 vP;
    float ring(float r, float c, float w){ float d = (r - c) / w; return exp(-d*d); }
    void main(){
      float r = length(vP), a = 0.;
      for (int i = 0; i < 3; i++) {
        float t = tau[i]; if (t < 0.) continue;
        float fade = exp(-t * 1.1) * amp[i];
        a += ring(r, .66 + 2.3 * t, .13) * fade;                 // leading ring
        a += ring(r, .66 + 1.45 * t, .09) * fade * .45;          // trailing echo
        a += exp(-t * 4.) * amp[i] * .22 * (1. - r / 3.1);       // the face flashes as it is struck
      }
      // on the third strike the rings fold back into the boss
      float c = 3.0 - 2.34 * conv;
      a += ring(r, c, .11) * smoothstep(0., .08, conv) * (1. - smoothstep(.86, 1., conv)) * (.5 + conv);
      a *= 1. - smoothstep(3.0, 3.06, r);
      gl_FragColor = vec4(vec3(1., .74, .38) * a * 1.6, a);
    }`
}));
ripple.position.z = .135; gongGroup.add(ripple);

// ---------- lighting ----------
const spot = new THREE.SpotLight(0xffe2b8, 400, 0, .42, .65, 2); spot.position.set(0, GONG_Y + 9.5, 7); spot.target.position.set(0, GONG_Y, 0);
scene.add(spot, spot.target);
const rimLight = new THREE.DirectionalLight(0xff9a4a, 1.2); rimLight.position.set(-6, 4, -5); scene.add(rimLight);
scene.add(new THREE.AmbientLight(0x2a1a10, .25));

// visible shaft of the spotlight, and dust motes drifting in it
const beam = new THREE.Mesh(new THREE.CylinderGeometry(.35, 4.2, 15, 48, 1, true), new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  uniforms: { k: { value: .35 } },
  vertexShader: `varying vec3 vN; varying vec3 vV; varying float vY; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); vY = uv.y; gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform float k; varying vec3 vN; varying vec3 vV; varying float vY;
    void main(){ float f = pow(abs(dot(vN, vV)), 2.5); float a = k * .07 * f * smoothstep(0., .55, vY) * (1. - smoothstep(.9, 1., vY)); gl_FragColor = vec4(vec3(1., .86, .62) * a, a); }`
}));
beam.position.copy(spot.position).add(spot.target.position).multiplyScalar(.5).add(new THREE.Vector3(0, 0, .6));
beam.lookAt(spot.target.position); beam.rotateX(Math.PI / 2); scene.add(beam);
const dotTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 32; const g = c.getContext('2d');
  const gr = g.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 32, 32);
  return new THREE.CanvasTexture(c); })();
const MOTES = 260, moteBase = new Float32Array(MOTES * 3), motePos = new Float32Array(MOTES * 3), motePh = new Float32Array(MOTES);
for (let i = 0; i < MOTES; i++) { moteBase[i*3] = (Math.random() - .5) * 7; moteBase[i*3+1] = GONG_Y - 3 + Math.random() * 10; moteBase[i*3+2] = .8 + Math.random() * 5; motePh[i] = Math.random() * 6.28; }
const moteGeo = new THREE.BufferGeometry(); moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
const motes = new THREE.Points(moteGeo, new THREE.PointsMaterial({ size: .05, map: dotTex, color: 0xffd9a0, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: .5 }));
scene.add(motes);

// ---------- names carried outward on the ripples ----------
let rippleNames = [];
function labelTexture(text) {
  const c = document.createElement('canvas'), g = c.getContext('2d'), fs = 40;
  g.font = `italic 500 ${fs}px "Cormorant Garamond", Georgia, serif`;
  const w = Math.min(1024, Math.ceil(g.measureText(text).width) + 20); c.width = w; c.height = fs + 16;
  g.font = `italic 500 ${fs}px "Cormorant Garamond", Georgia, serif`; g.fillStyle = '#f3dfbf'; g.textBaseline = 'middle'; g.fillText(text, 10, c.height / 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return { t, aspect: w / c.height };
}
function buildRippleNames() {
  rippleNames.forEach(n => { scene.remove(n.sp); n.sp.material.map.dispose(); n.sp.material.dispose(); });
  const pool = LD.shuffle(LD.pool()), per = 10; rippleNames = [];
  if (!pool.length) return;
  for (let s = 0; s < 3; s++) for (let j = 0; j < per; j++) {
    const name = pool[(s * per + j) % pool.length];
    const { t, aspect } = labelTexture(name.length > 28 ? name.slice(0, 27) + '…' : name);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false, opacity: 0 }));
    const h = .34; sp.scale.set(h * aspect, h, 1); scene.add(sp);
    rippleNames.push({ sp, s, th: (j / per) * Math.PI * 2 + s * .31 + (Math.random() - .5) * .25 });
  }
}

// ---------- per-frame application of the state ----------
const tau = i => P.clock - STRIKES[i];
const bossWorld = new THREE.Vector3();
let idleT = 0;
function apply() {
  // swing: each strike adds a damped oscillation about the cord pivot (analytic, so it is frame-rate independent)
  let ax = 0, az = 0, flash = 0;
  for (let i = 0; i < 3; i++) { const t = tau(i); if (t < 0) continue;
    const e = Math.exp(-t / 1.5) * AMPS[i];
    ax += .03 * e * Math.sin(2 * Math.PI * .55 * t); az += .006 * e * Math.sin(2 * Math.PI * .83 * t + .7); flash += Math.exp(-t * 3) * AMPS[i]; }
  const still = LD.reduced ? 0 : 1;
  pivot.rotation.x = ax + .0035 * Math.sin(idleT * .9) * still; pivot.rotation.z = az + .002 * Math.sin(idleT * .6 + 1) * still;
  ripple.material.uniforms.tau.value.set(tau(0), tau(1), tau(2)); ripple.material.uniforms.conv.value = P.conv;
  gongMat.emissiveIntensity = P.boss * 1.3 + flash * .2;
  spot.intensity = 420 * (.25 + .75 * P.spot) + 160 * flash;
  wall.material.uniforms.spot.value = P.spot; wall.material.uniforms.flash.value = flash;
  beam.material.uniforms.k.value = P.spot + flash * .4; motes.material.opacity = .25 + .35 * P.spot;
  bloom.strength = .4 + .25 * P.boss;
  for (const n of rippleNames) { const t = tau(n.s);
    if (t < 0) { n.sp.material.opacity = 0; continue; }
    const rad = 3.45 + 2.6 * (1 - Math.exp(-t * 1.2)), th = n.th + t * .04;
    n.sp.position.set(Math.cos(th) * rad, GONG_Y + Math.sin(th) * rad, .3);
    n.sp.material.opacity = .55 * THREE.MathUtils.smoothstep(t, 0, .25) * (1 - THREE.MathUtils.smoothstep(t, 1.1, 2.4)); }
  // camera: slow push-in during the draw, plus a constant faint drift (never stops, so no hand-off jolt)
  camera.position.set(Math.sin(idleT * .13) * .25 * still, .25 + .2 * P.cam + Math.sin(idleT * .09) * .08 * still, 15.2 - 1.3 * P.cam);
  camera.lookAt(0, .55 - .05 * P.cam, 0);
}
function resize() {
  camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 1 ? 60 : 40; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); bloom.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize); resize();

let shown = false;
gsap.ticker.add((time, deltaMs) => {
  const dt = Math.min(deltaMs / 1000, .05); idleT += dt;
  if (!LD.reduced) for (let i = 0; i < MOTES; i++) {
    motePos[i*3] = moteBase[i*3] + Math.sin(idleT * .21 + motePh[i]) * .35;
    motePos[i*3+1] = moteBase[i*3+1] + Math.sin(idleT * .13 + motePh[i] * 1.7) * .5;
    motePos[i*3+2] = moteBase[i*3+2] + Math.cos(idleT * .17 + motePh[i]) * .25; }
  moteGeo.attributes.position.needsUpdate = true;
  apply(); composer.render(dt);
  if (!shown) { shown = true; gsap.to('#loading', { autoAlpha: 0, duration: .8, onComplete: () => { document.getElementById('loading').hidden = true; } }); }
});
if (location.hash === '#debug') window.__agung = { P, gsap, get tl() { return tl; }, render: () => { apply(); composer.render(0); } };

// ---------- sound: a synthesised bronze gong (inharmonic partials, slow beating, a soft mallet) ----------
let out = null;
function bus() {
  const ac = LD.audio(); if (!ac) return null;
  if (!out) { out = ac.createGain(); const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 2.5; out.connect(comp).connect(ac.destination); }
  return ac;
}
function gongSound(power = 1, deep = false) {
  const ac = bus(); if (!ac || !LD.snd.on) return; const t0 = ac.currentTime + .01, f0 = 92;
  const parts = [[1, 1, 8], [1.47, .55, 6], [1.99, .42, 5], [2.44, .3, 4], [2.98, .22, 3.2], [3.56, .15, 2.5], [4.31, .1, 1.8], [5.2, .06, 1.2]];
  parts.forEach(([m, a, d], i) => [0, .55].forEach((beat, k) => {
    if (k && i > 2) return;
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine';
    o.frequency.setValueAtTime(f0 * m * .985 + beat, t0); o.frequency.exponentialRampToValueAtTime(f0 * m + beat, t0 + .9); // the gong's pitch "blooms"
    const v = .06 * a * power * (k ? .6 : 1);
    g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + .02 + i * .012); g.gain.exponentialRampToValueAtTime(.0001, t0 + d * (.6 + .4 * power));
    o.connect(g).connect(out); o.start(t0); o.stop(t0 + d + .1);
  }));
  // mallet: a short, soft, low thump
  const n = ac.createBufferSource(), buf = ac.createBuffer(1, ac.sampleRate * .2, ac.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / ch.length, 4);
  n.buffer = buf; const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520; const ng = ac.createGain(); ng.gain.value = .5 * power;
  n.connect(lp).connect(ng).connect(out); n.start(t0);
  if (deep) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 46; g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.09, t0 + .05); g.gain.exponentialRampToValueAtTime(.0001, t0 + 9);
    o.connect(g).connect(out); o.start(t0); o.stop(t0 + 9.2); }
}

// ---------- reveal ----------
const winEl = document.getElementById('win'), nameEl = document.getElementById('winName'), ruleEl = document.getElementById('rule');
const lblEl = winEl.querySelector('.lbl'), prizeEl = winEl.querySelector('.prize');
let split = null, tl = null;

LD.stage({
  accent: '#d9a85e', drawingHint: 'The agung is struck…',
  draw(winner) {
    buildRippleNames();
    if (split) { split.revert(); split = null; }
    nameEl.textContent = winner;
    gsap.set(winEl, { autoAlpha: 1 }); gsap.set([lblEl, prizeEl, nameEl], { autoAlpha: 0 }); gsap.set(ruleEl, { scaleX: 0 });
    LD.fitText(nameEl, { max: Math.min(96, innerWidth * .07), min: 22 });
    split = new SplitText(nameEl, { type: 'words,chars', wordsClass: 'wd', charsClass: 'ch' });
    gsap.set(nameEl, { autoAlpha: 1 });
    // each letter starts at the gong's boss on screen and travels to its place
    // measure where the boss will be on screen at the moment of the reveal (camera part-way through its push-in)
    const ref = [], camNow = P.cam; P.clock = 0; P.cam = gsap.parseEase('sine.inOut')((STRIKES[2] + 1.8) / 9.5); apply();
    bossWorld.set(0, GONG_Y, .44);
    const scr = bossWorld.clone().project(camera), bx = (scr.x + 1) / 2 * innerWidth, by = (1 - scr.y) / 2 * innerHeight;
    P.cam = camNow; apply();
    split.chars.forEach(c => { const r = c.getBoundingClientRect(); ref.push([bx - (r.left + r.width / 2), by - (r.top + r.height / 2)]); });
    split.chars.forEach((c, i) => gsap.set(c, { x: ref[i][0], y: ref[i][1], scale: .2, autoAlpha: 0 }));

    tl = gsap.timeline();
    tl.to(P, { clock: 11, duration: 11, ease: 'none' }, 0)
      .to(P, { cam: 1, duration: 9.5, ease: 'sine.inOut' }, 0)
      .to(P, { spot: 1, duration: 1.8, ease: 'sine.inOut' }, 0);
    STRIKES.forEach((s, i) => tl.add(() => { if (!LD.reduced) gongSound(AMPS[i], i === 2); }, s));
    // after the third strike the rings fold back into the boss, which begins to glow
    tl.to(P, { conv: 1, duration: 1.2, ease: 'power2.in' }, STRIKES[2] + .6)
      .to(P, { boss: 1, duration: .45, ease: 'power2.out' }, STRIKES[2] + 1.72)
      .to(P, { boss: .5, duration: 1.8, ease: 'sine.inOut' }, STRIKES[2] + 2.3)
    // the name rises out of the boss, letter by letter, and settles with a slight overshoot
      .to(split.chars, { x: 0, y: 0, scale: 1, autoAlpha: 1, duration: 1.25, ease: 'back.out(1.15)',
        stagger: { amount: Math.min(1.1, .03 * split.chars.length) } }, STRIKES[2] + 1.8)
      .add(() => { if (LD.reduced) gongSound(1, true); else LD.snd.tone(184, 3.5, .03, 'sine'); }, STRIKES[2] + 1.8)
      .to(lblEl, { autoAlpha: 1, duration: .9, ease: 'sine.out' }, STRIKES[2] + 2.6)
      .to(ruleEl, { scaleX: 1, duration: 1.1, ease: 'power2.out' }, STRIKES[2] + 2.9)
      .to(prizeEl, { autoAlpha: 1, duration: .9, ease: 'sine.out' }, STRIKES[2] + 3.1);
    if (LD.reduced) tl.progress(1);
    return tl.then(() => {});
  },
  reset() {
    tl = gsap.timeline();
    tl.to(winEl, { autoAlpha: 0, duration: .6, ease: 'power1.out' }, 0)
      .to(P, { boss: 0, duration: 1.4, ease: 'sine.inOut' }, 0)
      .to(P, { cam: 0, duration: 2.6, ease: 'sine.inOut' }, 0)
      .to(P, { spot: .35, duration: 2.2, ease: 'sine.inOut' }, .2)
      .to(P, { clock: P.clock + 3, duration: 2.6, ease: 'none' }, 0) // let any remaining sway die away naturally
      .add(() => { P.clock = 0; P.conv = 0; if (split) { split.revert(); split = null; } });
    if (LD.reduced) tl.progress(1);
    return tl.then(() => {});
  }
});
</script>
