<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="pages.css">
    <title>YS60 · Lucky Draw Hub</title>
</head>
<body>
    <div class="hub-container">
        <h1>MALAM SAMBUTAN ULANG TAHUN 60</h1>
        <h1>YAYASAN SABAH</h1>
        <p class="subtitle">Cabutan Tiket Bertuah</p>

        <div class="gate" id="gate" role="region" aria-label="Sign in"></div>

        <div class="nav-cards">
            <a href="names.html" class="nav-card">
                <i class="fas fa-users"></i>
                <div class="nav-card-content">
                    <h3>Names</h3>
                    <p>Add the guest names to the draw</p>
                </div>
                <span class="count" id="cNames">—</span>
                <i class="fas fa-chevron-right chev"></i>
            </a>

            <a href="prizes.html" class="nav-card">
                <i class="fas fa-gift"></i>
                <div class="nav-card-content">
                    <h3>Prizes</h3>
                    <p>Set up the prizes in draw order</p>
                </div>
                <span class="count" id="cPrizes">—</span>
                <i class="fas fa-chevron-right chev"></i>
            </a>

            <a href="display.html" class="nav-card">
                <i class="fas fa-tv"></i>
                <div class="nav-card-content">
                    <h3>Prize Display</h3>
                    <p>Screen for the venue: next prize and winners</p>
                </div>
                <span class="count" id="cDisplay">—</span>
                <i class="fas fa-chevron-right chev"></i>
            </a>

            <a href="draw.html" class="nav-card">
                <i class="fas fa-random"></i>
                <div class="nav-card-content">
                    <h3>Draw</h3>
                    <p>Run the lucky draw and select winners</p>
                </div>
                <span class="count" id="cDraw">—</span>
                <i class="fas fa-chevron-right chev"></i>
            </a>
        </div>
    </div>
<script src="core.js"></script>
<script src="pages.js"></script>
<script>
gate($('gate'));

function render() {
  const on = LD.live.state() === 'on';
  if (!on) { ['cNames', 'cPrizes', 'cDisplay', 'cDraw'].forEach(id => { $(id).textContent = '—'; }); return; }
  const rows = prizeRows();
  $('cNames').textContent = Object.keys(LD.live.guests()).length;
  $('cPrizes').textContent = rows.filter(p => !p.won).length;
  $('cDisplay').textContent = rows.filter(p => p.won).length;
  $('cDraw').textContent = LD.pool().length;
}

LD.live.onChange(render);
render();
</script>
</body>
</html>
